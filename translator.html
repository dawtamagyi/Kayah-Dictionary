        * {
            box-sizing: border-box;
            margin: 0;

        }
        body {
            background: #FFC0CB;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1.5rem;
        }
        .card {
            max-width: 960px;
            width: 100%;
            background: white;
            padding: 2.2rem 2rem;
            border-radius: 40px;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.08);
            border: 1px solid #f0f0f0;
        }
        .grid {
            display: flex;
            flex-direction: column;
            gap: 1.8rem;
        }
        .pair {
            display: flex;
            flex-wrap: wrap;
            gap: 1.2rem;
        }
        .pair > div {
            flex: 1 1 220px;
            min-width: 180px;
        }
        textarea,
        .output-box {
            width: 100%;
            padding: 1rem 1.2rem;
            font-size: 1.2rem;
            border-radius: 28px;
            border: 1px solid #e0e0e0;
            background: white;
            box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.02);
            transition: 0.15s;
            line-height: 1.6;
            min-height: 120px;
            resize: vertical;
            font-family: 'Segoe UI', 'Noto Sans Kayah Li', sans-serif;
        }
        textarea:focus {
            outline: 2px solid #b0b0b0;
            border-color: transparent;
            background: #ffffff;
        }
        .output-box {
            background: #fafafa;
            color: #1f1a14;
            white-space: pre-wrap;
            word-break: break-word;
            border: 1px solid #e0e0e0;
            overflow-y: auto;
            font-family: 'Segoe UI', 'Noto Sans Kayah Li', sans-serif;
        }
        @media (max-width: 500px) {
            .card {
                padding: 1.5rem;
            }
        }
    </style>
</head>

            // --------------------------------------------------------------

                        result = result.replace(/\s+/g, " ").trim();
                        if (trailingPunct) {
                            if (trailingPunct === "?") result += "?";
                            else if (trailingPunct === "꤯") result += "꤯";
                            else if (trailingPunct === "!") result += "!";
                            else result += trailingPunct;
                        }
                        return result;
                    }

                    let hasBecause = false;
                    let becauseIndex = -1;
                    for (let i = 0; i < tokens.length; i++) {
                        if (tokens[i].toLowerCase() === "because") {
                            hasBecause = true;
                            becauseIndex = i;
                            break;
                        }
                    }

                    if (hasBecause && becauseIndex >= 0) {
                        let mainTokens = [];
                        let becauseTokens = [];
                        for (let i = 0; i < becauseIndex; i++) {
                            mainTokens.push(tokens[i]);
                        }
                        for (let i = becauseIndex + 1; i < tokens.length; i++) {
                            becauseTokens.push(tokens[i]);
                        }

                        let mainResult = translatePhrase(mainTokens, endsWithQuestion || isToBeQuestion || isWhQuestion, isHaveStart, isImperative, hasModalBeforeConjunction, modalType, false, null, null);
                        let becauseResult = translatePhrase(becauseTokens, false, false, false, false, null, false, null, null);

                        // Modal/aux form goes at end of main clause, BEFORE the conjunction
                        let modalEndForm = null;
                        if (mainResult.modalInfo) {
                            if (mainResult.modalInfo.type === "will") {
                                modalEndForm = "ꤕꤢ꤭ꤟꤟꤢꤧ꤭";
                            } else if (mainResult.modalInfo.type === "should") {
                                modalEndForm = "ꤒꤥ꤭ꤊꤢꤪ꤬ꤟꤟꤢꤧ꤭";
                            } else if (mainResult.modalInfo.type === "can" || mainResult.modalInfo.type === "could" || mainResult.modalInfo.type === "may") {
                                modalEndForm = "ꤢ꤬ꤔꤟꤤꤕꤚꤢꤧꤟꤟꤢꤧ꤭";
                            } else {
                                modalEndForm = mainResult.modalInfo.translation;
                            }
                        } else {
                            for (let i = 0; i < mainTokens.length; i++) {
                                const lower = mainTokens[i].toLowerCase().replace(/[.,;!?]+$/, "");
                                if (lower === "will") { modalEndForm = "ꤕꤢ꤭ꤟꤟꤢꤧ꤭"; break; }
                                if (lower === "should") { modalEndForm = "ꤒꤥ꤭ꤊꤢꤪ꤬ꤟꤟꤢꤧ꤭"; break; }
                                if (lower === "do" || lower === "does" || lower === "did") { modalEndForm = "ꤟꤟꤢꤧ꤭"; break; }
                            }
                        }

                        let result = mainResult.text;
                        if (modalEndForm) {
                            result = (result ? result + " " : "") + modalEndForm;
                        }
                        if (result.length > 0) {
                            result += " " + "ꤗꤟꤢꤩ꤬ꤒꤢꤩ꤭ꤚꤢꤪ";
                        } else {
                            result = "ꤗꤟꤢꤩ꤬ꤒꤢꤩ꤭ꤚꤢꤪ";
                        }
                        if (becauseResult.text.length > 0) {
                            result += " " + becauseResult.text;
                        }

                        if (isToBeQuestion) {
                            result += " ꤥ꤬ꤟꤟꤢꤧ꤭";
                        }

                        result = result.replace(/\s+/g, " ").trim();
                        if (trailingPunct) {
                            if (trailingPunct === "?") result += "?";
                            else if (trailingPunct === "꤯") result += "꤯";
                            else if (trailingPunct === "!") result += "!";
                            else result += trailingPunct;
                        }
                        return result;
                    }

                    if (isToBeQuestion) {
                        let remainingTokens = tokens.slice(1);
                        let result = translatePhrase(remainingTokens, true, false, isImperative, hasModalBeforeConjunction, modalType, false, null, null);
                        let finalResult = result.text;

                        finalResult += " ꤥ꤬ꤟꤟꤢꤧ꤭";

                        if (trailingPunct) {
                            if (trailingPunct === "?") finalResult += "?";
                            else if (trailingPunct === "꤯") finalResult += "꤯";
                            else if (trailingPunct === "!") finalResult += "!";
                            else finalResult += trailingPunct;
                        }
                        return finalResult;
                    }

                    if (isWhQuestion) {
                        let questionTranslation = null;
                        let remainingTokens = [];

                        if (isWillStart || isCanStart || isCouldStart || isMayStart) {
                            remainingTokens = tokens.slice(1);
                            if (isWillStart) {
                                questionTranslation = "ꤕꤢ꤭ꤟꤟꤢꤧ꤭";
                            } else {
                                questionTranslation = "ꤢ꤬ꤔꤟꤤꤕꤚꤢꤧꤟꤟꤢꤧ꤭";
                            }
                        } else if (isShouldStart) {
                            questionTranslation = "ꤒꤥ꤭ꤊꤢꤪ꤬ꤟꤟꤢꤧ꤭";
                            remainingTokens = tokens.slice(1);
                        } else if (isDoStart) {
                            questionTranslation = "ꤟꤟꤢꤧ꤭";
                            remainingTokens = tokens.slice(1);
                        } else {
                            let matched = false;
                            for (let n = 4; n >= 1; n--) {
                                if (tokens.length >= n) {
                                    const phrase = tokens.slice(0, n).join(" ").toLowerCase();
                                    if (whQuestionKeys.has(phrase)) {
                                        const trans = dict.get(phrase);
                                        if (trans) {
                                            questionTranslation = trans;
                                        } else {
                                            const parts = phrase.split(" ");
                                            let transParts = [];
                                            for (const p of parts) {
                                                transParts.push(getTranslation(p));
                                            }
                                            questionTranslation = transParts.join(" ");
                                        }
                                        remainingTokens = tokens.slice(n);
                                        matched = true;
                                        break;
                                    }
                                }
                            }
                            if (!matched) {
                                questionTranslation = getTranslation(firstToken);
                                remainingTokens = tokens.slice(1);
                            }
                        }

                        let result = translatePhrase(remainingTokens, true, isHaveStart, isImperative, hasModalBeforeConjunction, modalType, false, null, null);
                        let finalResult = result.text;

                        if (finalResult.length > 0 && questionTranslation) {
                            finalResult += " " + questionTranslation;
                        } else if (questionTranslation) {
                            finalResult = questionTranslation;
                        }

                        if (trailingPunct) {
                            if (trailingPunct === "?") finalResult += "?";
                            else if (trailingPunct === "꤯") finalResult += "꤯";
                            else if (trailingPunct === "!") finalResult += "!";
                            else finalResult += trailingPunct;
                        }
                        return finalResult;
                    }

                    let result = translatePhrase(tokens, false, isHaveStart, isImperative, hasModalBeforeConjunction, modalType, false, null, null);
                    let finalResult = result.text;

                    if (result.modalInfo) {
                        if (isWillStart || isCanStart || isCouldStart || isMayStart || endsWithQuestion) {
                            if (result.modalInfo.type === "will") {
                                finalResult += " ꤕꤢ꤭ꤟꤟꤢꤧ꤭";
                            } else {
                                finalResult += " ꤢ꤬ꤔꤟꤤꤕꤚꤢꤧꤟꤟꤢꤧ꤭";
                            }
                        } else {
                            finalResult += " " + result.modalInfo.translation;
                        }
                    }

                    if (trailingPunct) {
                        if (trailingPunct === "?") finalResult += "?";
                        else if (trailingPunct === "꤯") finalResult += "꤯";
                        else if (trailingPunct === "!") finalResult += "!";
                        else finalResult += trailingPunct;
                    }
                    return finalResult;
                });

                return translatedSentences.join(" ");
            }

            // --------------------------------------------------------------
            //  Translate Kayah Li → English
            // --------------------------------------------------------------
            function translateToEnglish(text) {
                if (!text.trim()) return "";
                let normalized = text.replace(/꤯/g, ".");
                const tokens = normalized.split(/\s+/).filter(w => w.length > 0);
                const englishParts = tokens.map(token => {
                    let punct = "";
                    const match = token.match(/[.,;!?]+$/);
                    if (match) {
                        punct = match[0];
                        token = token.slice(0, -match[0].length);
                    }
                    let eng = reverseDict.get(token);
                    if (!eng) {
                        eng = token;
                    }
                    return eng + punct;
                });
                return englishParts.join(" ");
            }

            // --------------------------------------------------------------
            //  UI logic
            // --------------------------------------------------------------
            const inputEl = document.getElementById("inputText");
            const outputEl = document.getElementById("outputText");

            let currentDirection = "en2kayah";

            function updateTranslation() {
                const raw = inputEl.value;
                let result = "";
                if (currentDirection === "en2kayah") {
                    result = translateToKayah(raw);
                } else {
                    result = translateToEnglish(raw);
                }
                outputEl.textContent = result || " ";
            }

            inputEl.addEventListener("input", updateTranslation);

            currentDirection = "en2kayah";
            inputEl.placeholder = "Type English …";
            window.addEventListener("load", function() {
                updateTranslation();
            });

            window.translator = { translateToKayah, translateToEnglish };
        })();
    </script>

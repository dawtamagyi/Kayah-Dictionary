    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            font-family: "Kay Pho Du", serif;
        }
        body {
            background: #FFC0CB;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1.5rem;
            font-family: "Kay Pho Du", serif;
            font-weight: 400;
        }
        .card {
            max-width: 960px;
            width: 100%;
            background: white;
            padding: 2.2rem 2rem;
            border-radius: 40px;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.08);
            border: 1px solid #f0f0f0;
        }
        .grid {
            display: flex;
            flex-direction: column;
            gap: 1.8rem;
        }
        .pair {
            display: flex;
            flex-wrap: wrap;
            gap: 1.2rem;
        }
        .pair > div {
            flex: 1 1 220px;
            min-width: 180px;
        }
        textarea,
        .output-box {
            width: 100%;
            padding: 1rem 1.2rem;
            font-size: 1.2rem;
            border-radius: 28px;
            border: 1px solid #e0e0e0;
            background: white;
            box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.02);
            transition: 0.15s;
            line-height: 1.6;
            min-height: 120px;
            resize: vertical;
            font-family: "Kay Pho Du", serif;
            font-weight: 400;
        }
        textarea:focus {
            outline: 2px solid #b0b0b0;
            border-color: transparent;
            background: #ffffff;
        }
        .output-box {
            background: #fafafa;
            color: #1f1a14;
            white-space: pre-wrap;
            word-break: break-word;
            border: 1px solid #e0e0e0;
            overflow-y: auto;
            font-family: "Kay Pho Du", serif;
            font-weight: 400;
        }
        h1 {
            font-family: "Kay Pho Du", serif;
            font-weight: 700;
        }
        label {
            font-family: "Kay Pho Du", serif;
            font-weight: 600;
        }
        .kay-pho-du-regular {
            font-family: "Kay Pho Du", serif;
            font-weight: 400;
            font-style: normal;
        }
        .kay-pho-du-medium {
            font-family: "Kay Pho Du", serif;
            font-weight: 500;
            font-style: normal;
        }
        .kay-pho-du-semibold {
            font-family: "Kay Pho Du", serif;
            font-weight: 600;
            font-style: normal;
        }
        .kay-pho-du-bold {
            font-family: "Kay Pho Du", serif;
            font-weight: 700;
            font-style: normal;
        }
        @media (max-width: 500px) {
            .card {
                padding: 1.5rem;
            }
        }
    </style>
</head>

            // Move clause-final WH (what/how/…) to just before time-conjunction at end

            function reorderWhBeforeTimeConj(text) {
                if (!text) return text;
                const whForms = ["ꤒꤤ꤭ꤒꤢꤩ꤭", "ꤖꤢꤨꤒꤢꤩ꤭", "ꤙꤤꤒꤢꤩ꤭", "ꤢ꤬ꤗꤟꤢꤩ꤬ꤒꤢꤩ꤭", "ꤒꤣ꤬ꤊꤟꤊꤣ꤬ꤒꤢꤩ꤭"];

                // subordinate starts after main — find first subject-like word after a verb before conj?
                // Simpler: put WH immediately before conjIdx's preceding subject chain
                // User order: you need what | we leave before
                // So WH should sit right before the sub subject (we)
                // Find start of sub: walk left from conjIdx-1 while not hitting a "main-looking" boundary
                // Put WH at conjIdx (before conj), and sub subject words stay before conj
                // Current: need we leave before what
                // Target: need what we leave before
                // So insert WH at position of first word of sub clause (word after main verb objects)
                // Heuristic: move WH to index conjIdx - (sub length). Sub = words from some point to conjIdx-1.
                // Put WH right before sub start. Sub start ≈ first pronoun/subject before conj going left until verb/object of main ends.
                // Simplest heuristic matching user example: place WH immediately before the word sequence ending at conjIdx-1 that starts with a subject pronoun

                let subStart = conjIdx;
                for (let i = conjIdx - 1; i >= 0; i--) {
                    if (subj.has(words[i].replace(/[.,;!?꤯]+$/, ""))) {
                        subStart = i;
                    } else if (subStart < conjIdx) {
                        break;
                    }
                }
                if (subStart >= conjIdx) return text;
                const whWord = words[whIdx];
                words.splice(whIdx, 1);
                // adjust subStart if we removed after it
                if (whIdx < subStart) subStart -= 1;
                words.splice(subStart, 0, whWord);
                return words.join(" ");

            // Append will/can/could/would short form from translatePhrase result

                            const vTrans = getWordTranslation(verbTok) || (vLow === "do" ? "ꤗꤟꤢꤩ꤬" : verbTok);
                            translatedWords.push(vTrans);
                        }
                        const objInfo = collectWhToObjects(afterVerbIdx);
                        for (const ot of objInfo.pronouns) translatedWords.push(ot);
                        translatedWords.push(whToPhraseMap[lower]);
                        for (const ot of objInfo.others) translatedWords.push(ot);
                        translatedWords.push(whToThat);
                        // skip verb + objects
                        const skipCount = (verbTok ? 1 : 0) + objInfo.consumed;
                        if (skipCount > 0) {
                            i += skipCount; // loop will i++ so this advances past verb+objs; but we use skipNext for one
                            // safer: set i to last consumed index (loop increments)
                            // afterVerbIdx - 1 is last object index if any; if only verb: i stays and skipNext
                        }
                        // Advance i to last consumed token so for-loop i++ lands after
                        if (verbTok || objInfo.consumed > 0) {
                            i = afterVerbIdx + objInfo.consumed - 1;
                        }
                        continue;
                    }
                    // Case B: separate tokens how + to + verb
                    if (whToWordMap[lower] && i + 1 < tokens.length &&
                        tokens[i + 1].toLowerCase().replace(/[.,;!?]+$/, "") === "to") {
                        let verbTok = null;
                        let afterVerbIdx = i + 2; // default after "to"
                        if (i + 2 < tokens.length) {
                            const cand = tokens[i + 2];
                            const vLow = cand.toLowerCase().replace(/[.,;!?]+$/, "");
                            if (isActionVerb(cand) || whToVerbExtras.includes(vLow)) {
                                verbTok = cand;
                                afterVerbIdx = i + 3;
                            }
                        }
                        translatedWords.push("ꤊꤟꤢꤦ"); // infinitive "to"
                        if (verbTok) {
                            const vLow = verbTok.toLowerCase().replace(/[.,;!?]+$/, "");
                            const vTrans = getWordTranslation(verbTok) || (vLow === "do" ? "ꤗꤟꤢꤩ꤬" : verbTok);
                            translatedWords.push(vTrans);
                        }
                        const objInfo = collectWhToObjects(afterVerbIdx);
                        for (const ot of objInfo.pronouns) translatedWords.push(ot);
                        translatedWords.push(whToWordMap[lower]);
                        for (const ot of objInfo.others) translatedWords.push(ot);
                        translatedWords.push(whToThat);
                        // Advance past to + verb + objects
                        i = afterVerbIdx + objInfo.consumed - 1;
                        continue;
                    }

                    // Mid-sentence WH clause without "to": how/what/where + subject + …
                    // e.g. how I will come → I come will how
                    if (whToWordMap[lower] && i + 1 < tokens.length &&
                        tokens[i + 1].toLowerCase().replace(/[.,;!?]+$/, "") !== "to") {
                        const nxt = tokens[i + 1].toLowerCase().replace(/[.,;!?]+$/, "");
                        if (isSubject(tokens[i + 1]) || nxt === "will" || nxt === "would" || nxt === "can" || nxt === "should") {
                            const restTokens = tokens.slice(i + 1);
                            const restRes = translatePhrase(restTokens, false, false, false, false, null, false, null, null);
                            let restText = (restRes.text || "").trim();
                            if (restRes.modalInfo && (restRes.modalInfo.type === "will" || restRes.modalInfo.type === "would")) {
                                restText = (restText ? restText + " " : "") + "ꤕꤢ꤭";
                            } else if (restRes.modalInfo) {
                                restText = (restText ? restText + " " : "") + restRes.modalInfo.translation;
                            }
                            if (restText) translatedWords.push(...restText.split(/\s+/).filter(Boolean));
                            translatedWords.push(whToWordMap[lower]);
                            i = tokens.length;
                            continue;
                        }
                    }



                    // Mid-sentence "whose" + noun → whose then noun
                    // e.g. I don't know whose book on the table
                    // → Subject + verb + negative + whose + noun + noun + on
                    if (lower === "whose" && i + 1 < tokens.length) {
                        const nextTok = tokens[i + 1];
                        const nextLow = nextTok.toLowerCase().replace(/[.,;!?]+$/, "");
                        if (isNoun(nextTok) || nextLow === "book" || nextLow === "books" || nextLow === "house" || nextLow === "car" || nextLow === "money") {
                            translatedWords.push(getWordTranslation("whose") || "ꤢꤨ꤭ꤕꤢꤩ꤭");
                            translatedWords.push(getWordTranslation(nextTok));
                            skipNext = true;
                            continue;
                        }
                    }

                    // Skip "do", "does", "did" when they are used as auxiliary verbs in questions
                    if ((lower === "do" || lower === "does" || lower === "did") && isQuestion) {
                        // Check if there's a main verb after it
                        let hasMainVerb = false;
                        for (let j = i + 1; j < tokens.length; j++) {
                            if (isActionVerb(tokens[j]) || tokens[j].toLowerCase() === "want" || tokens[j].toLowerCase() === "need" || tokens[j].toLowerCase() === "come" || tokens[j].toLowerCase() === "go") {
                                hasMainVerb = true;
                                break;
                            }
                        }
                        if (hasMainVerb) {
                            continue; // Skip "do" in questions
                        }
                    }

                    if (lower === "a" || lower === "an") {
                        continue;
                    }

                    // Handle modal before conjunction
                    if (isModalAtEnd(token) && modalBeforeConjunctionMarker && conjunctionIndex !== -1) {
                        continue;
                    }

                    // Check if this is the conjunction
                    if (modalBeforeConjunctionMarker && conjunctionIndex !== -1 && i === conjunctionIndex) {
                        translatedWords.push(modalBeforeConjunctionMarker);
                        const conjTrans = getTranslation(conjunctionType);
                        if (conjTrans) {
                            translatedWords.push(conjTrans);
                        }
                        skipNext = true;
                        continue;
                    }

                    // Handle WH word after noun
                    if (whWordAfterNoun && i === whWordIndex) {
                        // Skip adding the WH word here - it will be added after the noun
                        continue;
                    }

                    // Handle "whose" - add before the noun
                    if (whoseWordTrans && i === whoseWordPos) {
                        // Skip adding "whose" here - it will be added before the noun
                        continue;
                    }

                    // If we have "whose" and we find a noun, add "whose" before it
                    if (whoseWordTrans && isNoun(token) && i > whoseWordPos) {
                        // Check if we haven't added "whose" yet
                        let whoseAdded = false;
                        for (let k = 0; k < translatedWords.length; k++) {
                            if (translatedWords[k] === whoseWordTrans) {
                                whoseAdded = true;
                                break;
                            }
                        }
                        if (!whoseAdded) {
                            translatedWords.push(whoseWordTrans);
                        }
                    }

                    if (lower === "too" && i + 1 < tokens.length) {
                        const nextToken = tokens[i + 1];
                        const nextLower = nextToken.toLowerCase().replace(/[.,;!?]+$/, "");
                        if (adjectiveMap.has(nextLower) || isActionVerb(nextToken) || isPastParticiple(nextToken)) {
                            tooMarker = "ꤒꤢ꤬ꤜꤝꤥꤏꤢꤦꤜꤢꤦ꤭";
                            let adjTrans = getWordTranslation(nextToken);
                            translatedWords.push(adjTrans);
                            translatedWords.push(tooMarker);
                            if (firstVerbIndex === -1) firstVerbIndex = translatedWords.length - 1;
                            skipNext = true;
                            continue;
                        }
                    }

                    // Bare sentence-initial "No" + noun → noun + ꤥ꤬ꤒꤥ꤬
                    // No house → house ꤥ꤬ꤒꤥ꤬
                    // (have/has/had + no + noun handled separately → noun + have + no)
                    if (lower === "no") {
                        // If previous content token was have/has/had, let the dedicated
                        // "have no NOUN" handler own this (do not consume here).
                        let prevIsHave = false;
                        for (let pj = i - 1; pj >= 0; pj--) {
                            const pl = tokens[pj].toLowerCase().replace(/[.,;!?]+$/, "");
                            if (!pl) continue;
                            if (pl === "have" || pl === "has" || pl === "had") { prevIsHave = true; }
                            break;
                        }
                        if (!prevIsHave) {
                            let ni = i + 1;
                            while (ni < tokens.length && isArticle(tokens[ni])) ni++;
                            if (ni < tokens.length) {
                                const ntok = tokens[ni];
                                const nl = ntok.toLowerCase().replace(/[.,;!?]+$/, "");
                                const isNounLike = isNoun(ntok) || adjectiveMap.has(nl) ||
                                    (dict.has(nl) && !isNegativeWord(ntok) && !isModalAtEnd(ntok) &&
                                     !isToBeVerb(ntok) && !isActionVerb(ntok) && !isSubject(ntok) &&
                                     nl !== "not" && nl !== "and" && nl !== "or" && nl !== "but");
                                if (isNounLike) {
                                    const nTrans = getWordTranslation(ntok) || ntok;
                                    translatedWords.push(nTrans);
                                    translatedWords.push("ꤥ꤬ꤒꤥ꤬");
                                    skipTokens = ni - i;
                                    continue;
                                }
                            }
                            // bare no
                            translatedWords.push("ꤒꤥ꤬");
                            continue;
                        }

                    }

                    if (isNegativeWord(token)) {
                        const negLower = token.toLowerCase().replace(/[.,;!?]+$/, "");
                        // mustn't → must inline + ꤒꤥ꤬ at end of main
                        if (negLower === "mustn't" || negLower === "must not") {
                            translatedWords.push("ꤒꤥ꤭ꤙꤢꤧ꤬");
                            hasNegation = true;
                            foundNegationWord = "mustn't";
                            negativeTranslation = "ꤒꤥ꤬";
                            continue;
                        }
                        hasNegation = true;
                        foundNegationWord = token;
                        // Always use the specific negative translation (can't→ꤢ꤬ꤔꤟꤤꤒꤥ꤬, won't→ꤒꤥ꤬ꤕꤢ꤭, etc.)
                        negativeTranslation = getNegativeTranslation(token);
                        continue;
                    }

                    if (isModalAtEnd(token)) {
                        modalToken = token;
                        continue;
                    }

                    if (isToBeVerb(token) && !isHaveVerb(token)) {
                        toBeFound = true;
                        if (goingToIndex !== -1 && i < goingToIndex) {
                            continue;
                        }
                        if (wantToIndex !== -1 && i < wantToIndex) {
                            continue;
                        }
                        translatedWords.push("ꤗꤢ꤬(ꤥ꤬)");
                        if (firstVerbIndex === -1) firstVerbIndex = translatedWords.length - 1;
                        continue;
                    }

                    if (lower === "in" && i > 0) {
                        const prevToken = tokens[i - 1];
                        const prevLower = prevToken.toLowerCase().replace(/[.,;!?]+$/, "");
                        if (prevLower === "hotel" || prevLower === "house" || prevLower === "school" || prevLower === "church" || isNoun(prevToken)) {
                            continue;
                        }
                    }

                    if (skipPrepCount > 0) {
                        skipPrepCount--;
                        continue;
                    }

                    // multi-word prepositions on end-placement list → deferred to end
                    const mwHere = matchMultiWordPrep(tokens, i);
                    if (mwHere && endPlacementPreps.has(mwHere.phrase)) {
                        if (mwHere.trans && !deferredPreps.includes(mwHere.trans)) {
                            deferredPreps.push(mwHere.trans);
                        }
                        skipPrepCount = mwHere.len - 1;
                        continue;
                    }

                    if (lower === "on" && nounForOn) {
                        continue;
                    }

                    // year / years / yrs / years old → AFTER the number
                    // e.g. 2 years old → 2 ꤔꤢ꤬
                    if (lower === "years old" || lower === "years" || lower === "year" ||
                        lower === "yrs" || lower === "year old" || lower === "yrs old") {
                        // already handled when number was seen; skip standalone
                        continue;
                    }
                    // Attached time: 5am, 5pm, 5a.m, 5p.m.
                    {
                        const raw = token.replace(/[.,;!?]+$/, "");
                        const mAmPm = raw.match(/^(\d+)\s*(a\.m\.?|p\.m\.?|am|pm)$/i);
                        if (mAmPm) {
                            const num = mAmPm[1];
                            const ap = mAmPm[2].toLowerCase().replace(/\./g, "");
                            translatedWords.push(num);
                            translatedWords.push(ap === "pm" || ap === "p.m" ? "ꤗꤢꤦ꤭ꤙꤢꤧ꤬ꤗꤟꤢꤪꤟꤢꤩ" : "ꤗꤢꤦ꤭ꤙꤢꤧ꤬ꤗꤟꤢꤪꤜꤤ꤭");
                            continue;
                        }
                    }
                    if (/^\d+$/.test(lower) || /^\d+$/.test(token.replace(/[.,;!?]+$/, ""))) {
                        let yearsTrans = null;
                        let skipYears = 0;
                        let ampmTrans = null;
                        let skipAmpm = 0;
                        if (i + 1 < tokens.length) {
                            const n1raw = tokens[i + 1].toLowerCase();
                            const n1 = n1raw.replace(/[.,;!?]+$/, "");
                            const n1Bare = n1.replace(/\./g, "");
                            // am / pm / a.m / p.m after number
                            if (n1Bare === "pm" || n1 === "p.m" || n1 === "p.m.") {
                                ampmTrans = "ꤗꤢꤦ꤭ꤙꤢꤧ꤬ꤗꤟꤢꤪꤟꤢꤩ";
                                skipAmpm = 1;
                            } else if (n1Bare === "am" || n1 === "a.m" || n1 === "a.m.") {
                                ampmTrans = "ꤗꤢꤦ꤭ꤙꤢꤧ꤬ꤗꤟꤢꤪꤜꤤ꤭";
                                skipAmpm = 1;
                            } else if (n1 === "years old" || n1 === "year old" || n1 === "yrs old") {
                                yearsTrans = "ꤔꤢ꤬";
                                skipYears = 1;
                            } else if (n1 === "years" || n1 === "year" || n1 === "yrs") {
                                if (i + 2 < tokens.length && tokens[i + 2].toLowerCase().replace(/[.,;!?]+$/, "") === "old") {
                                    yearsTrans = "ꤔꤢ꤬";
                                    skipYears = 2;
                                } else {
                                    yearsTrans = "ꤔꤢ꤬";
                                    skipYears = 1;
                                }
                            }
                        }
                        if (ampmTrans) {
                            translatedWords.push(token.replace(/[.,;!?]+$/, ""));
                            translatedWords.push(ampmTrans);
                            i += skipAmpm;
                            continue;
                        }
                        if (yearsTrans) {
                            // number first, then years
                            translatedWords.push(token.replace(/[.,;!?]+$/, ""));
                            translatedWords.push(yearsTrans);
                            i += skipYears;
                            continue;
                        }
                    }
                    // standalone am/pm after number already handled; skip stray time markers
                    {
                        const bare = lower.replace(/\./g, "");
                        if (bare === "pm" || lower === "p.m" || lower === "p.m.") {
                            translatedWords.push("ꤗꤢꤦ꤭ꤙꤢꤧ꤬ꤗꤟꤢꤪꤟꤢꤩ");
                            continue;
                        }
                        // do NOT treat be-verb "am" as time here
                        if (lower === "a.m" || lower === "a.m.") {
                            translatedWords.push("ꤗꤢꤦ꤭ꤙꤢꤧ꤬ꤗꤟꤢꤪꤜꤤ꤭");
                            continue;
                        }
                    }

                    // "about" is deferred to end after object/possessive phrase (never inline)
                    if (lower === "about") {
                        if (!aboutTranslation) aboutTranslation = "ꤚꤤ꤬ꤊꤛꤢ꤭";
                        continue;
                    }

                    // Frequency adverbs — fixed Kayah position regardless of English position
                    // Front: always, almost always, usually, normally, generally, sometimes, occasionally, seldom, rarely, hardly ever
                    // After main verb: often, frequently
                    {
                        const freqFront = {
                            "always": "ꤕꤝꤟꤥ꤭ꤖꤟꤌꤣ",
                            "almost always": "ꤕꤝꤟꤥ꤭ꤖꤟꤌꤣ",
                            "usually": "ꤢꤧꤒꤢ꤬ꤊꤤ꤬",
                            "normally": "ꤢꤧꤒꤢ꤬ꤊꤤ꤬",
                            "generally": "ꤢꤧꤒꤢ꤬ꤊꤤ꤬",
                            "sometimes": "ꤒꤢ꤬ꤖꤟꤌꤣꤒꤢ꤬ꤋꤛꤢ꤬",
                            "occasionally": "ꤒꤢ꤬ꤖꤟꤌꤣꤖꤟꤌꤣ",
                            "seldom": "ꤑꤟꤢꤩꤒꤢ꤬ꤖꤟꤌꤣ",
                            "rarely": "ꤑꤟꤢꤩꤒꤢ꤬ꤖꤟꤌꤣ",
                            "hardly ever": "ꤑꤟꤢꤩꤒꤢ꤬ꤖꤟꤌꤣ"
                        };
                        const freqAfter = {
                            "often": "ꤒꤢ꤬ꤗꤥ꤭ꤒꤢ꤬ꤗꤥ꤭",
                            "frequently": "ꤒꤢ꤬ꤗꤥ꤭ꤒꤢ꤬ꤗꤥ꤭"
                        };
                        // multi-word first
                        if (i + 1 < tokens.length) {
                            const two = (lower + " " + tokens[i + 1].toLowerCase().replace(/[.,;!?]+$/, "")).trim();
                            if (freqFront[two]) {
                                freqFrontTrans = freqFront[two];
                                skipNext = true;
                                continue;
                            }
                            if (freqAfter[two]) {
                                freqAfterVerbTrans = freqAfter[two];
                                skipNext = true;
                                continue;
                            }
                        }
                        if (freqFront[lower]) {
                            freqFrontTrans = freqFront[lower];
                            continue;
                        }
                        if (freqAfter[lower]) {
                            freqAfterVerbTrans = freqAfter[lower];
                            continue;
                        }
                    }

                    // never / have never / has never / had never → end of main clause
                    // Sentence-initial Never … → ꤒꤢ꤬ꤖꤟꤌꤣꤗꤟꤢꤩ (stop-style)
                    // Mid-clause never → ꤒꤢ꤬ꤖꤟꤌꤣꤒꤥ꤬
                    if (lower === "never" || lower === "have never" || lower === "has never" || lower === "had never") {
                        if (isNeverStart && (lower === "never") && i === 0) {
                            neverTranslation = "ꤒꤢ꤬ꤖꤟꤌꤣꤗꤟꤢꤩ";
                        } else {
                            neverTranslation = getWordTranslation(token) || dict.get(lower) || dict.get("never") || "ꤒꤢ꤬ꤖꤟꤌꤣꤒꤥ꤬";
                        }
                        continue;
                    }
                    // like / as: comparison vs verb
                    // I like her → ꤞꤢꤧꤕꤜꤢꤪ꤬ꤥ꤬
                    // like they say / as they say → ꤞꤛꤢꤖꤢꤨ / ꤖꤢꤨ + verb+ꤔꤌꤣ꤬
                    // Like you doing, … → ꤞꤛꤢꤖꤢꤨ at start
                    if (lower === "like" || lower === "as") {
                        const subjPron = new Set(["i","you","we","they","he","she","it"]);
                        const negSet = new Set(["don't","doesn't","didn't","not","never","ain't","can't","won't","wouldn't","shouldn't","isn't","aren't","wasn't","weren't","no"]);
                        let prevContent = "";
                        for (let pj = i - 1; pj >= 0; pj--) {
                            const pl = tokens[pj].toLowerCase().replace(/[.,;!?]+$/, "");
                            if (!pl) continue;
                            prevContent = pl;
                            break;
                        }
                        const nextTok = (i + 1 < tokens.length) ? tokens[i + 1].toLowerCase().replace(/[.,;!?]+$/, "") : "";
                        let isComparison = false;
                        if (i === 0) {
                            isComparison = true;
                        } else if (/,$/.test((tokens[i - 1] || ""))) {
                            isComparison = true;
                        } else if (subjPron.has(nextTok)) {
                            // like they say / as she doing
                            isComparison = true;
                        } else if ((nextTok === "him" || nextTok === "her" || nextTok === "them" || nextTok === "me" || nextTok === "us") &&
                                   !(subjPron.has(prevContent) || negSet.has(prevContent))) {
                            // ", like him," not "I like her"
                            isComparison = true;
                        } else if (subjPron.has(prevContent) || negSet.has(prevContent)) {
                            isComparison = false; // verb
                        } else if (lower === "as") {
                            isComparison = true; // as usually comparison
                        } else {
                            isComparison = false;
                        }
                        if (isComparison) {
                            translatedWords.push(lower === "as" ? "ꤖꤢꤨ" : "ꤞꤛꤢꤖꤢꤨ");
                            // ꤔꤌꤣ꤬ after verb OR subject/object pronouns; before comma when clause ends
                            // Like you, people… → you+ꤔꤌꤣ꤬
                            // like him, I… → him+ꤔꤌꤣ꤬
                            // like he doing → he doing+ꤔꤌꤣ꤬
                            const allPron = new Set(["i","you","we","they","he","she","it","him","her","them","me","us"]);
                            if (allPron.has(nextTok) && i + 1 < tokens.length) {
                                const rawNext = tokens[i + 1];
                                const hasComma = /,$/.test(rawNext);
                                let afterPron = "";
                                if (i + 2 < tokens.length) {
                                    afterPron = tokens[i + 2].toLowerCase().replace(/[.,;!?]+$/, "");
                                }
                                // verb follows pronoun in same clause?
                                const verbFollows = afterPron && (
                                    isActionVerb(tokens[i + 2]) ||
                                    isPastParticiple(tokens[i + 2]) ||
                                    afterPron.endsWith("ing") ||
                                    ["do","does","did","say","said","doing","going","come","go","show","shows","showed",
                                     "tell","tells","told","help","helps","helped","know","knows","knew",
                                     "want","wants","need","needs","like","likes","love","loves","get","gets","got"].includes(afterPron)
                                );
                                if (hasComma || !verbFollows) {
                                    // clause ends at pronoun (before comma / new clause) → pronoun+ꤔꤌꤣ꤬
                                    const pTrans = getWordTranslation(rawNext) || rawNext.replace(/,$/, "");
                                    translatedWords.push(pTrans.replace(/,$/, "") + "ꤔꤌꤣ꤬");
                                    skipNext = true;
                                    likeAsNeedThat = false;
                                    continue;
                                }
                                // pronoun + verb in same clause → emit pronoun, attach ꤔꤌꤣ꤬ to verb later
                                const pTrans = getWordTranslation(rawNext) || rawNext;
                                translatedWords.push(pTrans.replace(/,$/, ""));
                                skipNext = true;
                                likeAsNeedThat = true;
                                continue;
                            }
                            // like/as + verb directly → ꤔꤌꤣ꤬ after that verb
                            likeAsNeedThat = true;
                            continue;
                        }
                        if (lower === "like") {
                            translatedWords.push("ꤞꤢꤧꤕꤜꤢꤪ꤬ꤥ꤬");
                            continue;
                        }
                        // bare "as" comparison fallback
                        translatedWords.push("ꤖꤢꤨ");
                        likeAsNeedThat = true;
                        continue;
                    }

                    // ever → after main verb (ꤔꤢꤪ)
                    if (lower === "ever") {
                        everAdverb = getWordTranslation(token) || dict.get("ever") || "ꤔꤢꤪ";
                        continue;
                    }
                    // again → after main/subordinate verb (ꤕꤟꤥꤞꤛꤢ)
                    if (lower === "again") {
                        againAdverb = getWordTranslation(token) || dict.get("again") || "ꤕꤟꤥꤞꤛꤢ";
                        continue;
                    }
                    // really → after verb (need to eat really dinner), before objects
                    if (lower === "really") {
                        reallyAdverb = getWordTranslation(token) || dict.get("really") || "ꤔꤟꤤꤔꤛꤢ꤬";
                        continue;
                    }
                    // used to / use to → after main verb (ꤊꤟꤊꤣ꤭)
                    if (lower === "used to" || lower === "use to") {
                        usedToTranslation = getWordTranslation(token) || dict.get(lower) || "ꤊꤟꤊꤣ꤭";
                        continue;
                    }
                    // dare not / dared not / daren't → after main verb
                    if (lower === "dare not" || lower === "dared not" || lower === "daren't") {
                        postVerbAux = getWordTranslation(token) || dict.get(lower) || "ꤙꤢꤦ꤬ꤒꤥ꤬";

        * {

		.kay-pho-du-regular {
  font-family: "Kay Pho Du", serif;
  font-weight: 400;
  font-style: normal;
}

.kay-pho-du-medium {
  font-family: "Kay Pho Du", serif;
  font-weight: 500;
  font-style: normal;
}

  font-family: "Kay Pho Du", serif;

        body {
            background: #FFC0CB;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1.5rem;
        }
        .card {
            max-width: 960px;
            width: 100%;
            background: white;
            padding: 2.2rem 2rem;
            border-radius: 40px;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.08);
            border: 1px solid #f0f0f0;
        }
        .grid {
            display: flex;
            flex-direction: column;
            gap: 1.8rem;
        }
        .pair {
            display: flex;
            flex-wrap: wrap;
            gap: 1.2rem;
        }
        .pair > div {
            flex: 1 1 220px;
            min-width: 180px;
        }
        textarea,
        .output-box {
            width: 100%;
            padding: 1rem 1.2rem;
            font-size: 1.2rem;
            border-radius: 28px;
            border: 1px solid #e0e0e0;
            background: white;
            box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.02);
            transition: 0.15s;
            line-height: 1.6;
            min-height: 120px;
            resize: vertical;
            font-family: 'Segoe UI', 'Noto Sans Kayah Li', sans-serif;
        }
        textarea:focus {
            outline: 2px solid #b0b0b0;
            border-color: transparent;
            background: #ffffff;
        }
        .output-box {
            background: #fafafa;
            color: #1f1a14;
            white-space: pre-wrap;
            word-break: break-word;
            border: 1px solid #e0e0e0;
            overflow-y: auto;
            font-family: 'Segoe UI', 'Noto Sans Kayah Li', sans-serif;
        }
        @media (max-width: 500px) {
            .card {
                padding: 1.5rem;
            }
        }

                "made", "spoken", "written", "drunk", "broken", "chosen",
                "driven", "fallen", "forgotten", "grown", "known", "lost",
                "met", "put", "run", "said", "shown", "sung", "sat",
                "stood", "told", "thought", "won", "booked"
            ]);

            // Set of action verbs (not nouns)
            const actionVerbs = new Set([
                "go", "eat", "do", "see", "come", "take", "make", "say",
                "know", "think", "hear", "find", "put", "run", "use", "write",
                "speak", "read", "close", "open", "start", "finish", "arrive",
                "board", "prove", "need", "want", "live", "stay", "tell", "ask",
                "help", "watch", "drink", "work", "remember", "forget", "wait", "book"
            ]);

            // Reverse map
            const reverseDict = new Map();
            for (let [en, kay] of dict.entries()) {
                if (kay && kay.length > 0 && !kay.includes("|") && kay !== "HAVE_PLACEHOLDER" && kay !== "DONE_PLACEHOLDER" && kay !== "STILL_PLACEHOLDER" && kay !== "GOING_TO_PLACEHOLDER" && kay !== "TO_PLACEHOLDER" && kay !== "WHEN_PLACEHOLDER") {
                    if (!reverseDict.has(kay)) {
                        reverseDict.set(kay, en);
                    }
                }
            }

            // --------------------------------------------------------------
            //  Helper functions
            // --------------------------------------------------------------
            function normalizeContractions(text) {
                let result = text;
                for (let [smart, straight] of smartQuoteMap) {
                    const smartRegex = new RegExp(smart.replace(/'/g, "['’]"), 'g');
                    result = result.replace(smartRegex, straight);
                }
                result = result.replace(/’/g, "'");
                return result;
            }

            function tokenizeEnglish(text) {
                text = normalizeContractions(text);
                const tokens = [];
                const words = text.split(/\s+/).filter(w => w.length > 0);
                let i = 0;
                while (i < words.length) {
                    const lowerWord = words[i].toLowerCase().replace(/[.,;!?]+$/, "");
                    if (lowerWord === "a" || lowerWord === "an") {
                        i++;
                        continue;
                    }
                    let matched = false;
                    for (let n = 4; n >= 2; n--) {
                        if (i + n <= words.length) {
                            const phrase = words.slice(i, i + n).join(" ");
                            if (dict.has(phrase.toLowerCase())) {
                                tokens.push(phrase);
                                i += n;
                                matched = true;
                                break;
                            }
                        }
                    }
                    if (!matched) {
                        tokens.push(words[i]);
                        i++;
                    }
                }
                return tokens;
            }

            function isNegativeWord(token) {
                const lower = token.toLowerCase().replace(/[.,;!?]+$/, "");
                return negativeWords.has(lower);
            }

            function getNegativeTranslation(token) {
                const lower = token.toLowerCase().replace(/[.,;!?]+$/, "");
                return negativeTranslations.get(lower) || "ꤒꤥ꤬";
            }

            function isAdjective(token) {
                const lower = token.toLowerCase().replace(/[.,;!?]+$/, "");
                return adjectiveMap.has(lower);
            }

            function isModalAtEnd(token) {
                const lower = token.toLowerCase().replace(/[.,;!?]+$/, "");
                return modalVerbsAtEnd.has(lower);
            }

            function getModalTranslation(token) {
                const lower = token.toLowerCase().replace(/[.,;!?]+$/, "");
                return modalTranslations.get(lower) || null;
            }

            function isTimeConjunction(token) {
                const lower = token.toLowerCase().replace(/[.,;!?]+$/, "");
                return timeConjunctions.has(lower);
            }

            function isToBeVerb(token) {
                const lower = token.toLowerCase().replace(/[.,;!?]+$/, "");
                return lower === "am" || lower === "is" || lower === "are" || lower === "was" || lower === "were" || lower ===
                    "be";
            }

            function isToBeQuestionStart(token) {
                const lower = token.toLowerCase().replace(/[.,;!?]+$/, "");
                return toBeQuestionVerbs.has(lower);
            }

            function isPrepositionAfter(token) {
                const lower = token.toLowerCase().replace(/[.,;!?]+$/, "");
                return prepositionsAfter.has(lower);
            }

            // Only these prepositions move to end of clause in Kayah Li:
            // in, on, under, across, over, after, before, during, since, for,
            // in front of, instead of, next to
            const endPlacementPreps = new Set([
                "in", "on", "under", "across", "over", "after", "before",
                "during", "since", "for", "in front of", "instead of", "next to"
            ]);
            const multiWordPreps = [
                "in front of", "instead of", "next to"
            ];
            function matchMultiWordPrep(tokens, i) {
                for (const mw of multiWordPreps) {
                    const parts = mw.split(" ");
                    if (i + parts.length <= tokens.length) {
                        let ok = true;
                        for (let k = 0; k < parts.length; k++) {
                            const tl = tokens[i + k].toLowerCase().replace(/[.,;!?]+$/, "");
                            if (tl !== parts[k]) { ok = false; break; }
                        }
                        if (ok) return { phrase: mw, len: parts.length, trans: prepositionsAfter.get(mw) || dict.get(mw) };
                    }
                }
                return null;
            }

            function getPrepositionTranslation(token) {
                const lower = token.toLowerCase().replace(/[.,;!?]+$/, "");
                return prepositionsAfter.get(lower) || null;
            }

            function isHaveVerb(token) {
                const lower = token.toLowerCase().replace(/[.,;!?]+$/, "");
                return lower === "have" || lower === "has" || lower === "had";
            }

            function isPastParticiple(token) {
                const lower = token.toLowerCase().replace(/[.,;!?]+$/, "");
                return pastParticipleWords.has(lower);
            }

            function isArticle(token) {
                const lower = token.toLowerCase().replace(/[.,;!?]+$/, "");
                return lower === "a" || lower === "an";
            }

            function isSubject(token) {
                const lower = token.toLowerCase().replace(/[.,;!?]+$/, "");
                return lower === "i" || lower === "he" || lower === "she" || lower === "we" || lower === "they" || lower ===
                    "you" || lower === "it";
            }

            function isStillWord(token) {
                const lower = token.toLowerCase().replace(/[.,;!?]+$/, "");
                return lower === "still";
            }

            function isActionVerb(token) {
                const lower = token.toLowerCase().replace(/[.,;!?]+$/, "");
                return actionVerbs.has(lower);
            }

            function isGoingToPhrase(tokens, index) {
                if (index + 1 < tokens.length) {
                    const current = tokens[index].toLowerCase().replace(/[.,;!?]+$/, "");
                    const next = tokens[index + 1].toLowerCase().replace(/[.,;!?]+$/, "");
                    if (current === "going" && next === "to") {
                        return true;
                    }
                    if (current === "about" && next === "to") {
                        return true;
                    }
                }
                return false;
            }

            function isWantToPhrase(tokens, index) {
                if (index + 1 < tokens.length) {
                    const current = tokens[index].toLowerCase().replace(/[.,;!?]+$/, "");
                    const next = tokens[index + 1].toLowerCase().replace(/[.,;!?]+$/, "");
                    if (current === "want" && next === "to") {
                        return true;
                    }
                    if (index + 2 < tokens.length) {
                        const next2 = tokens[index + 2].toLowerCase().replace(/[.,;!?]+$/, "");
                        if (current === "would" && next === "like" && next2 === "to") {
                            return true;
                        }
                    }
                    if (current === "need" && next === "to") {
                        return true;
                    }
                    if (current === "love" && next === "to") {
                        return true;
                    }
                }
                return false;
            }

            function isNoun(token) {
                const lower = token.toLowerCase().replace(/[.,;!?]+$/, "");
                // Adjectives, WH words, subjects, modals are never nouns
                if (adjectiveMap.has(lower)) {
                    return false;
                }
                if (whQuestionWords.has(lower) || lower === "whose" || lower === "what" || lower === "who" || lower === "when" || lower === "where" || lower === "why" || lower === "how" || lower === "which") {
                    return false;
                }
                if (isSubject(token) || isModalAtEnd(token) || isToBeVerb(token) || isNegativeWord(token)) {
                    return false;
                }
                if (dict.has(lower)) {
                    const val = dict.get(lower);
                    if (val && val !== "HAVE_PLACEHOLDER" && val !== "DONE_PLACEHOLDER" && val !== "STILL_PLACEHOLDER" && val !== "GOING_TO_PLACEHOLDER" && val !== "TO_PLACEHOLDER" && val !== "WHEN_PLACEHOLDER" && !val.includes("|")) {
                        if (actionVerbs.has(lower) || pastParticipleWords.has(lower)) {
                            return false;
                        }
                        return true;
                    }
                }
                const commonNouns = ["school", "home", "work", "church", "hotel", "box", "table", "water", "book", "name", "house", "day", "meeting", "train", "committee", "storm", "teacher", "homework", "girl", "leader", "doors", "seats", "food", "room", "ticket", "tickets", "plane", "bus", "night", "rain", "screenshot", "money", "country", "books"];
                if (commonNouns.includes(lower)) {
                    return true;
                }
                return false;
            }

            function getSubjectTranslation(token) {
                const lower = token.toLowerCase().replace(/[.,;!?]+$/, "");
                if (lower === "i") return "ꤠꤢ꤭";
                if (lower === "he" || lower === "she" || lower === "it") return "ꤢꤧ꤬";
                if (lower === "we") return "ꤕꤟꤢꤧ꤬";
                if (lower === "they") return "ꤢꤧ꤬ꤞꤤ꤭";
                if (lower === "you") return "ꤔꤟꤢꤧ꤬";
                return null;
            }

            function isHaveAsAuxiliary(tokens, haveIndex) {
                if (haveIndex + 1 < tokens.length) {
                    const nextToken = tokens[haveIndex + 1];
                    if (isPastParticiple(nextToken)) {
                        return true;
                    }
                    if (nextToken.toLowerCase() === "been" && haveIndex + 2 < tokens.length) {
                        return true;
                    }
                }
                return false;
            }

            function isHaveAsMainVerb(tokens, haveIndex) {
                if (haveIndex + 1 < tokens.length) {
                    const nextToken = tokens[haveIndex + 1];
                    if (isNoun(nextToken)) {
                        return true;
                    }
                    if (isArticle(nextToken) && haveIndex + 2 < tokens.length) {
                        if (isNoun(tokens[haveIndex + 2])) {
                            return true;
                        }
                    }
                }
                return false;
            }

            function isWhWord(token) {
                const lower = token.toLowerCase().replace(/[.,;!?]+$/, "");
                return whQuestionWords.has(lower);
            }

            // --------------------------------------------------------------
            //  Get translation for a word
            // --------------------------------------------------------------
            function getWordTranslation(word) {
                const lower = word.toLowerCase().replace(/[.,;!?]+$/, "");
                if (dict.has(lower)) {
                    const val = dict.get(lower);
                    if (val && val.includes("|")) {
                        const parts = val.split("|");
                        const first = parts[0].split("_");
                        return first[1] || val;
                    }
                    if (val === "HAVE_PLACEHOLDER") {
                        return null;
                    }
                    if (val === "DONE_PLACEHOLDER") {
                        return "ꤗꤟꤢꤩ꤬ꤓꤌꤣ꤭";
                    }
                    if (val === "STILL_PLACEHOLDER") {
                        return null;
                    }
                    if (val === "GOING_TO_PLACEHOLDER") {
                        return null;
                    }
                    if (val === "TO_PLACEHOLDER") {
                        return null;
                    }
                    if (val === "WHEN_PLACEHOLDER") {
                        return null;
                    }
                    return val;
                }
                if (adjectiveMap.has(lower)) return adjectiveMap.get(lower);
                if (prepositionsAfter.has(lower)) return prepositionsAfter.get(lower);
                if (modalTranslations.has(lower)) return modalTranslations.get(lower);
                return word;
            }

            function getTranslation(word) {
                const lower = word.toLowerCase().replace(/[.,;!?]+$/, "");
                if (dict.has(lower)) {
                    const val = dict.get(lower);
                    if (val && val.includes("|")) {
                        const parts = val.split("|");
                        const first = parts[0].split("_");
                        return first[1] || val;
                    }
                    if (val === "HAVE_PLACEHOLDER") {
                        return null;
                    }
                    if (val === "DONE_PLACEHOLDER") {
                        return "ꤗꤟꤢꤩ꤬ꤓꤌꤣ꤭";
                    }
                    if (val === "STILL_PLACEHOLDER") {
                        return null;
                    }
                    if (val === "GOING_TO_PLACEHOLDER") {
                        return null;
                    }
                    if (val === "TO_PLACEHOLDER") {
                        return null;
                    }
                    if (val === "WHEN_PLACEHOLDER") {
                        return null;
                    }
                    return val;
                }
                if (adjectiveMap.has(lower)) return adjectiveMap.get(lower);
                if (prepositionsAfter.has(lower)) return prepositionsAfter.get(lower);
                if (modalTranslations.has(lower)) return modalTranslations.get(lower);
                return word;
            }

            // --------------------------------------------------------------
            //  Translate phrase - Main translation logic
            // --------------------------------------------------------------
            function translatePhrase(tokens, isQuestion, isHaveStart, isImperative, isModalBeforeConjunction, modalType, isWhNounQuestion, whNounWord, whNounSubject) {
                const everWordsAtEnd = new Set(["whatever", "whoever", "whomever", "whichever"]);

                // Split at whatever/whoever/… so will attaches to end of MAIN clause only
                // e.g. I will tell her whatever you need
                // → [I tell her] + ꤕꤢ꤭ + [you need] + whatever
                let everIdx = -1;
                let everKey = null;
                for (let i = 0; i < tokens.length; i++) {
                    const tl = tokens[i].toLowerCase().replace(/[.,;!?]+$/, "");
                    if (everWordsAtEnd.has(tl)) {
                        everIdx = i;
                        everKey = tl;
                        break;
                    }
                }
                if (everIdx >= 0 && !isWhNounQuestion) {
                    const mainTokens = tokens.slice(0, everIdx);
                    const subTokens = tokens.slice(everIdx + 1);
                    const everTrans = getWordTranslation(everKey) || dict.get(everKey) || everKey;

                    // Translate main (picks up will as modalInfo)
                    const mainRes = translatePhrase(mainTokens, isQuestion, isHaveStart, isImperative, isModalBeforeConjunction, modalType, false, null, null);
                    // Translate subordinate clause (no question/modal-at-end)
                    const subRes = translatePhrase(subTokens, false, false, false, false, null, false, null, null);

                    let modalEndForm = null;
                    if (mainRes.modalInfo) {
                        if (mainRes.modalInfo.type === "will") modalEndForm = "ꤕꤢ꤭";
                        else if (mainRes.modalInfo.type === "should") modalEndForm = "ꤒꤥ꤭ꤊꤢꤪ꤬";
                        else if (mainRes.modalInfo.type === "can" || mainRes.modalInfo.type === "could" || mainRes.modalInfo.type === "may") modalEndForm = "ꤢ꤬ꤔꤟꤤꤕꤚꤢꤧ";
                        else modalEndForm = mainRes.modalInfo.translation;
                    } else {
                        // fallback: scan main tokens for will/should/can
                        for (let i = 0; i < mainTokens.length; i++) {
                            const lower = mainTokens[i].toLowerCase().replace(/[.,;!?]+$/, "");
                            if (lower === "will") { modalEndForm = "ꤕꤢ꤭"; break; }
                            if (lower === "should") { modalEndForm = "ꤒꤥ꤭ꤊꤢꤪ꤬"; break; }
                            if (lower === "can" || lower === "could" || lower === "may") { modalEndForm = "ꤢ꤬ꤔꤟꤤꤕꤚꤢꤧ"; break; }
                        }
                    }

                    let result = mainRes.text || "";
                    if (modalEndForm) result = (result ? result + " " : "") + modalEndForm;
                    if (subRes.text) result = (result ? result + " " : "") + subRes.text;
                    result = (result ? result + " " : "") + everTrans;
                    result = result.replace(/\s+/g, " ").trim();

                    return {
                        text: result,
                        hasNegation: mainRes.hasNegation || subRes.hasNegation,
                        modalInfo: null, // already applied
                        toBeFound: mainRes.toBeFound,
                        haveFound: mainRes.haveFound,
                        haveTranslation: mainRes.haveTranslation,
                        isHaveStart: mainRes.isHaveStart || false,
                        nounTranslation: mainRes.nounTranslation,
                        v3Translation: mainRes.v3Translation,
                        isDonStart: mainRes.isDonStart || false
                    };
                }

                let hasNegation = false;
                let modalToken = null;
                let everWordTranslation = null;
                let deferredPreps = []; // prepositions moved to end after objects/nouns
                let translated = [];
                let skipNext = false;
                let skipPrepCount = 0;
                let toBeFound = false;
                let prepositionToken = null;
                let prepositionTranslation = null;
                let haveTokenIndex = -1;
                let haveTranslation = null;
                let isHaveWithV3 = false;
                let v3TokenIndex = -1;
                let v3Translation = null;
                let nounTokenIndex = -1;
                let nounTranslation = null;
                let haveFound = false;
                let subjectToken = null;
                let subjectTranslation = null;
                let isAuxiliaryHave = false;
                let isMainVerbHave = false;
                let stillTranslation = null;
                let stillIndex = -1;
                let goingToTranslation = null;
                let goingToIndex = -1;
                let goingToIsNoun = false;
                let wantToTranslation = null;
                let wantToIndex = -1;
                let wantToSkipCount = 0;
                let questionWordTranslation = null;
                let questionWordIndex = -1;
                let verbTranslation = null;
                let verbIndex = -1;
                let negationWord = null;
                let isDonStart = false;
                let negativeTranslation = null;
                if (tokens.length > 0) {
                    const firstLower = tokens[0].toLowerCase().replace(/[.,;!?]+$/, "");
                    if (firstLower === "don't" || firstLower === "doesn't" || firstLower === "didn't" || firstLower === "do not") {
                        isDonStart = true;
                    }
                }
                let tooTranslation = null;
                let tooIndex = -1;
                let verbForToo = null;
                let verbForTooIndex = -1;
                let inTranslation = null;
                let inIndex = -1;
                let thatTranslation = null;
                let thatIndex = -1;
                let thatMarkerAdded = false;
                let modalBeforeConj = false;
                let whWordFound = false;
                let whWordTrans = null;
                let whWordPos = -1;
                let isWhoseWord = false;

                if (isModalBeforeConjunction) {
                    modalBeforeConj = true;
                }

                // First pass - detect WH words, prepositions, have, etc.
                for (let i = 0; i < tokens.length; i++) {
                    // Check for WH words
                    const lower = tokens[i].toLowerCase().replace(/[.,;!?]+$/, "");
                    if (isWhWord(tokens[i]) && whWordPos === -1) {
                        const trans = getWordTranslation(tokens[i]);
                        if (trans && trans !== tokens[i]) {
                            whWordFound = true;
                            whWordTrans = trans;
                            whWordPos = i;
                            if (lower === "whose") {
                                isWhoseWord = true;
                            }
                        }
                    }

                    // multi-word prep first (only end-placement list)
                    const mwPrep = matchMultiWordPrep(tokens, i);
                    if (mwPrep && mwPrep.trans && endPlacementPreps.has(mwPrep.phrase)) {
                        deferredPreps.push(mwPrep.trans);
                    } else if (isPrepositionAfter(tokens[i])) {
                        prepositionToken = tokens[i];
                        prepositionTranslation = getPrepositionTranslation(tokens[i]);
                        const pl = tokens[i].toLowerCase().replace(/[.,;!?]+$/, "");
                        if (prepositionTranslation === "ꤒꤢ꤬ꤜꤝꤥꤏꤢꤦꤜꤢꤦ꤭") {
                            tooTranslation = prepositionTranslation;
                            tooIndex = i;
                        } else if (prepositionTranslation === "ꤊꤢꤨ꤭" && endPlacementPreps.has("in")) {
                            inTranslation = prepositionTranslation;
                            inIndex = i;
                        } else if (prepositionTranslation && endPlacementPreps.has(pl)) {
                            // only listed preps → defer to end
                            if (pl !== "on" && pl !== "in") {
                                deferredPreps.push(prepositionTranslation);
                            }
                        }
                    }
                    if (tokens[i].toLowerCase().replace(/[.,;!?]+$/, "") === "that") {
                        thatTranslation = "ꤔꤌꤣ꤬";
                        thatIndex = i;
                    }
                    if (isHaveVerb(tokens[i])) {
                        haveTokenIndex = i;
                        haveFound = true;

                        if (isHaveAsAuxiliary(tokens, i)) {
                            isAuxiliaryHave = true;
                            if (i + 1 < tokens.length) {
                                const nextToken = tokens[i + 1];
                                if (isPastParticiple(nextToken)) {
                                    isHaveWithV3 = true;
                                    v3TokenIndex = i + 1;
                                    v3Translation = getWordTranslation(nextToken);
                                }
                            }
                        } else if (isHaveAsMainVerb(tokens, i)) {
                            isMainVerbHave = true;
                            let nextIdx = i + 1;
                            if (nextIdx < tokens.length && isArticle(tokens[nextIdx])) {
                                nextIdx++;
                            }
                            if (nextIdx < tokens.length && isNoun(tokens[nextIdx])) {
                                nounTokenIndex = nextIdx;
                                nounTranslation = getWordTranslation(tokens[nextIdx]);
                            }
                        }
                    }
                    if (isStillWord(tokens[i])) {
                        stillIndex = i;
                        stillTranslation = "ꤒꤢꤪ꤭ꤕꤢ꤭";
                    }
                    if (isGoingToPhrase(tokens, i)) {
                        goingToIndex = i;
                        if (i + 2 < tokens.length) {
                            const afterTo = tokens[i + 2];
                            if (isNoun(afterTo)) {
                                goingToIsNoun = true;
                                goingToTranslation = "ꤡꤛꤣꤘꤣ";
                            } else if (isActionVerb(afterTo) || isPastParticiple(afterTo)) {
                                goingToIsNoun = false;
                                goingToTranslation = "ꤊꤟꤢꤦ";
                            } else {
                                goingToIsNoun = false;
                                goingToTranslation = "ꤊꤟꤢꤦ";
                            }
                        } else {
                            goingToIsNoun = false;
                            goingToTranslation = "ꤊꤟꤢꤦ";
                        }
                    }
                    if (isWantToPhrase(tokens, i)) {
                        wantToIndex = i;
                        const current = tokens[i].toLowerCase().replace(/[.,;!?]+$/, "");
                        if (current === "would" && i + 2 < tokens.length) {
                            wantToTranslation = "ꤞꤢꤧꤐꤟꤢꤦ";
                            wantToSkipCount = 3;
                        } else if (current === "want") {
                            wantToTranslation = "ꤞꤢꤧꤐꤟꤢꤦ";
                            wantToSkipCount = 2;
                        } else if (current === "need") {
                            wantToTranslation = "ꤜꤥ꤬";
                            wantToSkipCount = 2;
                        } else if (current === "love") {
                            wantToTranslation = "ꤞꤢꤧꤐꤟꤢꤦ";
                            wantToSkipCount = 2;
                        }
                    }
                    if (i < haveTokenIndex || haveTokenIndex === -1) {
                        if (isSubject(tokens[i])) {
                            subjectToken = tokens[i];
                            subjectTranslation = getSubjectTranslation(tokens[i]);
                        }
                    }
                }

                // Detect "how to do", "what to do", etc.
                for (let i = 0; i < tokens.length; i++) {
                    const lower = tokens[i].toLowerCase().replace(/[.,;!?]+$/, "");
                    if (i + 2 < tokens.length) {
                        const next1 = tokens[i + 1].toLowerCase().replace(/[.,;!?]+$/, "");
                        const next2 = tokens[i + 2].toLowerCase().replace(/[.,;!?]+$/, "");
                        if (next1 === "to" && isActionVerb(tokens[i + 2])) {
                            if (lower === "how") {
                                questionWordTranslation = "ꤖꤢꤨꤒꤢꤩ꤭";
                                verbTranslation = getWordTranslation(tokens[i + 2]);
                                questionWordIndex = i;
                                verbIndex = i + 2;
                                break;
                            } else if (lower === "what") {
                                questionWordTranslation = "ꤒꤤ꤭ꤒꤢꤩ꤭";
                                verbTranslation = getWordTranslation(tokens[i + 2]);
                                questionWordIndex = i;
                                verbIndex = i + 2;
                                break;
                            } else if (lower === "when") {
                                questionWordTranslation = "ꤙꤤꤋꤢꤧ꤭ꤒꤢꤩ꤭";
                                verbTranslation = getWordTranslation(tokens[i + 2]);
                                questionWordIndex = i;
                                verbIndex = i + 2;

                    if (isToBeQuestion) {
                        let remainingTokens = tokens.slice(1);
                        let result = translatePhrase(remainingTokens, true, false, isImperative, hasModalBeforeConjunction, modalType, false, null, null);
                        let finalResult = result.text;

                        finalResult += " ꤥ꤬ꤟꤟꤢꤧ꤭";

                        if (trailingPunct) {
                            if (trailingPunct === "?") finalResult += "?";
                            else if (trailingPunct === "꤯") finalResult += "꤯";
                            else if (trailingPunct === "!") finalResult += "!";
                            else finalResult += trailingPunct;
                        }
                        return finalResult;
                    }

                    if (isWhQuestion) {
                        let questionTranslation = null;
                        let remainingTokens = [];

                        if (isWillStart || isCanStart || isCouldStart || isMayStart) {
                            remainingTokens = tokens.slice(1);
                            if (isWillStart) {
                                questionTranslation = "ꤕꤢ꤭ꤟꤟꤢꤧ꤭";
                            } else {
                                questionTranslation = "ꤢ꤬ꤔꤟꤤꤕꤚꤢꤧꤟꤟꤢꤧ꤭";
                            }
                        } else if (isShouldStart) {
                            questionTranslation = "ꤒꤥ꤭ꤊꤢꤪ꤬ꤟꤟꤢꤧ꤭";
                            remainingTokens = tokens.slice(1);
                        } else if (isDoStart) {
                            questionTranslation = "ꤟꤟꤢꤧ꤭";
                            remainingTokens = tokens.slice(1);
                        } else {
                            let matched = false;
                            for (let n = 4; n >= 1; n--) {
                                if (tokens.length >= n) {
                                    const phrase = tokens.slice(0, n).join(" ").toLowerCase();
                                    if (whQuestionKeys.has(phrase)) {
                                        const trans = dict.get(phrase);
                                        if (trans) {
                                            questionTranslation = trans;
                                        } else {
                                            const parts = phrase.split(" ");
                                            let transParts = [];
                                            for (const p of parts) {
                                                transParts.push(getTranslation(p));
                                            }
                                            questionTranslation = transParts.join(" ");
                                        }
                                        remainingTokens = tokens.slice(n);
                                        matched = true;
                                        break;
                                    }
                                }
                            }
                            if (!matched) {
                                // Sentence-initial "who" question form (not relative ꤕꤚꤟꤢꤧ꤬ꤘꤣ)
                                if (firstToken === "who") {
                                    questionTranslation = "ꤢꤨ꤭ꤕꤢꤩ꤭";
                                } else {
                                    questionTranslation = getTranslation(firstToken);
                                }
                                remainingTokens = tokens.slice(1);
                            }
                        }
                        // Override: sentence-initial who → question form
                        if (firstToken === "who" && questionTranslation === "ꤕꤚꤟꤢꤧ꤬ꤘꤣ") {
                            questionTranslation = "ꤢꤨ꤭ꤕꤢꤩ꤭";
                        }

                        let result = translatePhrase(remainingTokens, true, isHaveStart, isImperative, hasModalBeforeConjunction, modalType, false, null, null);
                        let finalResult = result.text;

                        if (finalResult.length > 0 && questionTranslation) {
                            finalResult += " " + questionTranslation;
                        } else if (questionTranslation) {
                            finalResult = questionTranslation;
                        }

                        if (trailingPunct) {
                            if (trailingPunct === "?") finalResult += "?";
                            else if (trailingPunct === "꤯") finalResult += "꤯";
                            else if (trailingPunct === "!") finalResult += "!";
                            else finalResult += trailingPunct;
                        }
                        return finalResult;
                    }

                    let result = translatePhrase(tokens, false, isHaveStart, isImperative, hasModalBeforeConjunction, modalType, false, null, null);
                    let finalResult = result.text;

                    if (result.modalInfo) {
                        // Full form only when modal starts the sentence
                        if (result.modalInfo.type === "will") {
                            finalResult += isWillStart ? " ꤕꤢ꤭ꤟꤟꤢꤧ꤭" : " ꤕꤢ꤭";
                        } else if (result.modalInfo.type === "should") {
                            finalResult += isShouldStart ? " ꤒꤥ꤭ꤊꤢꤪ꤬ꤟꤟꤢꤧ꤭" : " ꤒꤥ꤭ꤊꤢꤪ꤬";
                        } else if (result.modalInfo.type === "can" || result.modalInfo.type === "could" || result.modalInfo.type === "may") {
                            finalResult += (isCanStart || isCouldStart || isMayStart) ? " ꤢ꤬ꤔꤟꤤꤕꤚꤢꤧꤟꤟꤢꤧ꤭" : " ꤢ꤬ꤔꤟꤤꤕꤚꤢꤧ";
                        } else {
                            finalResult += " " + result.modalInfo.translation;
                        }
                    }

                    if (trailingPunct) {
                        if (trailingPunct === "?") finalResult += "?";
                        else if (trailingPunct === "꤯") finalResult += "꤯";
                        else if (trailingPunct === "!") finalResult += "!";
                        else finalResult += trailingPunct;
                    }
                    return finalResult;
                });

                return translatedSentences.join(" ");
            }

            // --------------------------------------------------------------
            //  Translate Kayah Li → English
            // --------------------------------------------------------------
            function translateToEnglish(text) {
                if (!text.trim()) return "";
                let normalized = text.replace(/꤯/g, ".");
                const tokens = normalized.split(/\s+/).filter(w => w.length > 0);
                const englishParts = tokens.map(token => {
                    let punct = "";
                    const match = token.match(/[.,;!?]+$/);
                    if (match) {
                        punct = match[0];
                        token = token.slice(0, -match[0].length);
                    }
                    let eng = reverseDict.get(token);
                    if (!eng) {
                        eng = token;
                    }
                    return eng + punct;
                });
                return englishParts.join(" ");
            }

            // --------------------------------------------------------------
            //  UI logic
            // --------------------------------------------------------------
            const inputEl = document.getElementById("inputText");
            const outputEl = document.getElementById("outputText");

            let currentDirection = "en2kayah";

            function updateTranslation() {
                const raw = inputEl.value;
                let result = "";
                if (currentDirection === "en2kayah") {
                    result = translateToKayah(raw);
                } else {
                    result = translateToEnglish(raw);
                }
                outputEl.textContent = result || " ";
            }

            inputEl.addEventListener("input", updateTranslation);

            currentDirection = "en2kayah";
            inputEl.placeholder = "Type English …";
            window.addEventListener("load", function() {
                updateTranslation();
            });

            window.translator = { translateToKayah, translateToEnglish };
        })();
    </script>
    </div>

                            const headRes = translatePhrase(head, false, false, true, false, null, false, null, null);
                            const tailRes = tail.length ? translatePhrase(tail, false, false, false, false, null, false, null, null) : { text: "" };
                            let r = (headRes.text || "").trim();
                            r = (r ? r + " " : "") + "ꤒꤢꤧ꤭ꤗꤟꤢꤩ";
                            if (tailRes.text) r += " " + tailRes.text.trim();
                            if (toIdx >= 0 && !r.includes("ꤔꤌꤣ꤬")) r += " ꤔꤌꤣ꤬";
                            r = r.replace(/\s+/g, " ").trim();
                            if (trailingPunct === "?") r += "?";
                            else if (trailingPunct === "꤯") r += "꤯";
                            else if (trailingPunct) r += trailingPunct;
                            return reorderWhBeforeTimeConj(r);
                        }
                            }
                    }

                    // without X: complement of without first, then without, then main clause, then can't
                    // I can't live without you → you without I live can't
                    // We can't do this without he comes → he comes without We do this can't
                    // I can't work without knife → knife without I work can't
                    {
                        const withoutIdx = tokens.findIndex(t => t.toLowerCase().replace(/[.,;!?]+$/, "") === "without");
                        if (withoutIdx > 0) {
                            const mainTokens = tokens.slice(0, withoutIdx);
                            const compTokens = tokens.slice(withoutIdx + 1).map(t => t.replace(/[.,;!?]+$/, "")).filter(t => t.length > 0);
                            if (compTokens.length > 0) {
                                const compRes = translatePhrase(compTokens, false, false, false, false, null, false, null, null);
                                const mainRes = translatePhrase(mainTokens, endsWithQuestion, isHaveStart, isImperative, hasModalBeforeConjunction, modalType, false, null, null);
                                let compText = (compRes.text || "").trim();
                                let mainText = (mainRes.text || "").trim();
                                mainText = appendModalFromResult(mainText, mainRes, mainTokens);
                                let r = "";
                                if (compText) r = compText;
                                r = (r ? r + " " : "") + "ꤥ꤬ꤒꤥ꤬";
                                if (mainText) r = r + " " + mainText;
                                r = r.replace(/\s+/g, " ").trim();
                                if (trailingPunct === "?") r += "?";
                                else if (trailingPunct === "꤯") r += "꤯";
                                else if (trailingPunct) r += trailingPunct;
                                return reorderWhBeforeTimeConj(r);
                            }
                        }
                    }

                    // although / even though / though / whereas
                    // Fronted: Although X, Y → Y ... ꤒꤢ꤬ꤘꤣ꤬ꤚꤢꤪ X  OR keep order with front form
                    // Mid: Y, although X → Y ꤗꤢ꤬ꤔꤢ X
                    // User examples:
                    // Although I love sweets, I am trying… → I love sweets ꤒꤢ꤬ꤘꤣ꤬ꤚꤢꤪ I am trying…
                    // We went…, although it was raining → We went… ꤗꤢ꤬ꤔꤢ was raining
                    {
                        const conjForms = {
                            "although": { mid: "ꤗꤢ꤬ꤔꤢ", front: "ꤒꤢ꤬ꤘꤣ꤬ꤚꤢꤪ" },
                            "even though": { mid: "ꤗꤢ꤬ꤔꤢ", front: "ꤒꤢ꤬ꤘꤣ꤬ꤚꤢꤪ" },
                            "though": { mid: "ꤗꤢ꤬ꤔꤢ", front: "ꤒꤢ꤬ꤘꤣ꤬" },
                            "whereas": { mid: "ꤔꤌꤣ꤬ꤚꤢꤪ", front: "ꤔꤌꤣ꤬ꤚꤢꤪ" }
                        };
                        let conjIdx = -1;
                        let conjKey = null;
                        let conjLen = 1;
                        for (let i = 0; i < tokens.length; i++) {
                            const tl = tokens[i].toLowerCase().replace(/[.,;!?]+$/, "");
                            if (conjForms[tl]) { conjIdx = i; conjKey = tl; conjLen = 1; break; }
                            if (tl === "even" && i + 1 < tokens.length && tokens[i+1].toLowerCase().replace(/[.,;!?]+$/, "") === "though") {
                                conjIdx = i; conjKey = "even though"; conjLen = 2; break;
                            }
                        }
                        if (conjIdx >= 0 && conjKey) {
                            const isFront = (conjIdx === 0);
                            const form = isFront ? conjForms[conjKey].front : conjForms[conjKey].mid;
                            let left = tokens.slice(0, conjIdx);
                            let right = tokens.slice(conjIdx + conjLen);
                            // strip empty
                            left = left.map(t => t.replace(/[.,;!?]+$/, "")).filter(t => t.length > 0);
                            right = right.map(t => t.replace(/[.,;!?]+$/, "")).filter(t => t.length > 0);
                            if (isFront) {
                                const clauseTokens = right;
                                const clauseRes = translatePhrase(clauseTokens, false, false, false, false, null, false, null, null);
                                let r = (clauseRes.text || "").trim();
                                // ", although it was raining" as its own sentence → mid form at START
                                // "Although I love sweets" → front form at END
                                const firstContent = clauseTokens.length ? clauseTokens[0].toLowerCase().replace(/[.,;!?]+$/, "") : "";
                                const looksLikeAfterCommaSub = (firstContent === "it" || firstContent === "there" || firstContent === "this" || firstContent === "that" || conjKey === "whereas");
                                if (looksLikeAfterCommaSub) {
                                    const midForm = conjForms[conjKey].mid;
                                    r = midForm + (r ? " " + r : "");
                                } else {
                                    r = (r ? r + " " : "") + form;
                                }
                                r = r.replace(/\s+/g, " ").trim();
                                if (trailingPunct === "?") r += "?";
                                else if (trailingPunct === "꤯") r += "꤯";
                                else if (trailingPunct) r += trailingPunct;
                                return reorderWhBeforeTimeConj(r);
                            } else {
                                // mid: main , although sub → main form sub
                                const mainRes = translatePhrase(left, endsWithQuestion, isHaveStart, isImperative, hasModalBeforeConjunction, modalType, false, null, null);
                                const subRes = translatePhrase(right, false, false, false, false, null, false, null, null);
                                let mainText = appendModalFromResult((mainRes.text || "").trim(), mainRes, left);
                                let subText = (subRes.text || "").trim();
                                let r = mainText;
                                r = (r ? r + " " : "") + form;
                                if (subText) r += " " + subText;
                                r = r.replace(/\s+/g, " ").trim();
                                if (trailingPunct === "?") r += "?";
                                else if (trailingPunct === "꤯") r += "꤯";
                                else if (trailingPunct) r += trailingPunct;
                                return reorderWhBeforeTimeConj(r);
                            }
                        }
                    }

                    // whether to X or Y → … X ꤟꤟꤢꤧ꤭ Y ꤟꤟꤢꤧ꤭ ꤔꤌꤣ꤬
                    // I don't know whether to laugh or cry → I know don't ꤗꤟꤢ laugh ꤟꤟꤢꤧ꤭ cry ꤟꤟꤢꤧ꤭ ꤔꤌꤣ꤬
                    {
                        const whetherIdx = tokens.findIndex(t => {
                            const tl = t.toLowerCase().replace(/[.,;!?]+$/, "");
                            return tl === "whether";
                        });
                        if (whetherIdx >= 0) {
                            const before = tokens.slice(0, whetherIdx);
                            const after = tokens.slice(whetherIdx + 1);
                            // drop leading "to" after whether
                            let rest = after.slice();
                            if (rest.length && rest[0].toLowerCase().replace(/[.,;!?]+$/, "") === "to") {
                                rest = rest.slice(1);
                            }
                            // split on "or"
                            let orIdx = rest.findIndex(t => t.toLowerCase().replace(/[.,;!?]+$/, "") === "or");
                            let leftAlt = orIdx >= 0 ? rest.slice(0, orIdx) : rest.slice();
                            let rightAlt = orIdx >= 0 ? rest.slice(orIdx + 1) : [];
                            leftAlt = leftAlt.map(t => t.replace(/[.,;!?]+$/, "")).filter(Boolean);
                            rightAlt = rightAlt.map(t => t.replace(/[.,;!?]+$/, "")).filter(Boolean);
                            const beforeRes = translatePhrase(before, false, false, false, false, null, false, null, null);
                            let beforeText = appendModalFromResult((beforeRes.text || "").trim(), beforeRes, before);
                            // User shows don't ꤗꤟꤢ - special negation form before alternatives?
                            // Keep standard don't for now; add ꤗꤟꤢ after don't if present
                            if (beforeText.includes("ꤒꤥ꤬") && !beforeText.includes("ꤗꤟꤢ")) {
                                beforeText = beforeText.replace("ꤒꤥ꤬", "ꤒꤥ꤬ ꤗꤟꤢ");
                            }
                            const leftRes = translatePhrase(leftAlt, false, false, false, false, null, false, null, null);
                            const rightRes = translatePhrase(rightAlt, false, false, false, false, null, false, null, null);
                            let r = beforeText;
                            if (leftRes.text) r += " " + leftRes.text.trim() + " ꤟꤟꤢꤧ꤭";
                            if (rightRes.text) r += " " + rightRes.text.trim() + " ꤟꤟꤢꤧ꤭";
                            r += " ꤔꤌꤣ꤬";
                            r = r.replace(/\s+/g, " ").trim();
                            if (trailingPunct === "?") r += "?";
                            else if (trailingPunct === "꤯") r += "꤯";
                            else if (trailingPunct) r += trailingPunct;
                            return reorderWhBeforeTimeConj(r);
                        }
                    }

                    // How many times did/do/will you eat → you eat (will) How many times
                    // How many times I told you → I told you How many times
                    {
                        const la = tokens.map(t => t.toLowerCase().replace(/[.,;!?]+$/, ""));
                        const isHMT = (la[0] === "how many times") || (la[0] === "how" && la[1] === "many" && la[2] === "times") || (la[0] === "how many" && la[1] === "times");
                        if (isHMT) {
                            const start = (la[0] === "how many times") ? 1 : (la[0] === "how many" ? 2 : 3);
                            // only when not "will be here" (handled above)
                            if (!(la.includes("will") && la.includes("be") && (la.includes("here") || la.includes("there")))) {
                                const subjSet = new Set(["i","you","we","they","he","she","it"]);
                                let subj = null, verb = null, obj = null;
                                let hasWill = false;
                                for (let i = start; i < tokens.length; i++) {
                                    const tl = la[i];
                                    if (tl === "will" || tl === "would") { hasWill = true; continue; }
                                    if (["do","does","did","can","could","a","an","the"].includes(tl)) continue;
                                    if (!subj && subjSet.has(tl)) { subj = tokens[i]; continue; }
                                    if (!verb && (isActionVerb(tokens[i]) || ["eat","eats","ate","go","goes","went","come","send","need","want","take","buy","told","tell","tells"].includes(tl))) {
                                        verb = tokens[i]; continue;
                                    }
                                    // object after verb (told you)
                                    if (verb && !obj && (subjSet.has(tl) || tl === "me" || tl === "him" || tl === "her" || tl === "us" || tl === "them" || tl === "it")) {
                                        obj = tokens[i]; continue;
                                    }
                                }
                                if (subj || verb) {
                                    const parts = [];
                                    if (subj) parts.push(getSubjectTranslation(subj) || getWordTranslation(subj) || subj);
                                    if (verb) {
                                        // told → same as tell form if needed
                                        let vt = getWordTranslation(verb) || dict.get(verb.toLowerCase());
                                        if (!vt && verb.toLowerCase() === "told") vt = getWordTranslation("tell") || dict.get("tell") || "ꤟꤢꤩꤏꤥ꤬";
                                        parts.push(vt || verb);
                                    }
                                    if (obj) parts.push(getWordTranslation(obj) || getSubjectTranslation(obj) || obj);
                                    if (hasWill) parts.push("ꤕꤢ꤭");
                                    parts.push("ꤙꤢꤟꤢꤦ꤬ꤒꤢꤩ꤭");
                                    let r = parts.filter(Boolean).join(" ").replace(/\s+/g, " ").trim();
                                    if (trailingPunct === "?") r += "?";
                                    else if (trailingPunct === "꤯") r += "꤯";
                                    else if (trailingPunct) r += trailingPunct;
                                    return reorderWhBeforeTimeConj(r);
                                }
                            }
                        }
                    }

                    // Don't make people sad → make sad people Don't
                    // You make me happy → You make happy me
                    // She will make them unhappy → She make unhappy them will
                    // I will make you feeling bad → I make feeling bad you will
                    // You made a bad feeling → You made feeling bad
                    {
                        const la = tokens.map(t => t.toLowerCase().replace(/[.,;!?]+$/, ""));
                        const makeIdx = la.findIndex(t => t === "make" || t === "makes" || t === "made");
                        const isDont = (la[0] === "don't" || la[0] === "dont" || la[0] === "do not");
                        if (makeIdx >= 0 && (isDont || makeIdx >= 0)) {
                            // only treat as make-causative when adj/feeling follows object-ish
                            const afterMake = tokens.slice(makeIdx + 1);
                            const afterL = afterMake.map(t => t.toLowerCase().replace(/[.,;!?]+$/, ""));
                            // collect objects and adj/feeling/bad
                            const objPron = new Set(["me","you","him","her","us","them","it","people"]);
                            let objs = [];
                            let adjParts = [];
                            let sawContent = false;
                            for (let i = 0; i < afterMake.length; i++) {
                                const tl = afterL[i];
                                if (tl === "a" || tl === "an" || tl === "the") continue;
                                if (tl === "will" || tl === "would") continue;
                                // feeling + optional adj
                                if (tl === "feeling" || tl === "feelings") {
                                    adjParts.push(getWordTranslation(afterMake[i]) || dict.get(tl) || afterMake[i]);
                                    continue;
                                }
                                if (["happy","unhappy","sad","bad","good"].includes(tl) || (typeof adjectiveMap !== "undefined" && adjectiveMap.has(tl)) || isAdjective(afterMake[i])) {
                                    adjParts.push(getWordTranslation(afterMake[i]) || (adjectiveMap.has(tl) ? adjectiveMap.get(tl) : null) || dict.get(tl) || afterMake[i]);
                                    continue;
                                }
                                if (objPron.has(tl) || isNoun(afterMake[i]) || isSubject(afterMake[i])) {
                                    objs.push(getWordTranslation(afterMake[i]) || getSubjectTranslation(afterMake[i]) || afterMake[i]);
                                    continue;
                                }
                            }
                            // feeling before other adjectives: bad feeling → feeling bad
                            if (adjParts.length > 1) {
                                const feelIdx = adjParts.findIndex(x => x === (dict.get("feeling") || "ꤒꤢ꤬ꤔꤟꤢꤩ꤬") || x.includes("ꤔꤟꤢꤩ꤬"));
                                if (feelIdx > 0) {
                                    const f = adjParts.splice(feelIdx, 1)[0];
                                    adjParts.unshift(f);
                                }
                            }
                            // need at least adj or feeling pattern
                            if (adjParts.length > 0 || objs.length > 0) {
                                // if only objs and no adj, might be normal make — require adj OR feeling in source
                                const hasAdjLike = afterL.some(t => ["happy","unhappy","sad","bad","good","feeling","feelings"].includes(t) || adjectiveMap.has(t));
                                if (hasAdjLike || isDont) {
                                    const parts = [];
                                    // subject before make (not Don't)
                                    if (!isDont && makeIdx > 0) {
                                        for (let i = 0; i < makeIdx; i++) {
                                            const tl = la[i];
                                            if (tl === "will" || tl === "would") continue;
                                            if (["i","you","we","they","he","she","it"].includes(tl)) {
                                                parts.push(getSubjectTranslation(tokens[i]) || getWordTranslation(tokens[i]) || tokens[i]);
                                            }
                                        }
                                    }
                                    parts.push(getWordTranslation(tokens[makeIdx]) || dict.get(la[makeIdx]) || "ꤗꤟꤢꤩ꤬");
                                    // adj/feeling before objects
                                    parts.push(...adjParts);
                                    parts.push(...objs);
                                    if (la.includes("will") || la.includes("would")) parts.push("ꤕꤢ꤭");
                                    if (isDont) parts.push("ꤒꤢꤧ꤭ꤗꤟꤢꤩ");
                                    let r = parts.filter(Boolean).join(" ").replace(/\s+/g, " ").trim();
                                    if (trailingPunct === "?") r += "?";
                                    else if (trailingPunct === "꤯") r += "꤯";
                                    else if (trailingPunct) r += trailingPunct;
                                    return reorderWhBeforeTimeConj(r);
                                }
                            }
                        }
                    }

                    // have + (num) + (adj) + noun → subject (num) noun adj have
                    // I have a bad thing → I thing bad have
                    // They have 5 bad books → They 5 books bad have
                    // I have a book → I book have
                    {
                        const la = tokens.map(t => t.toLowerCase().replace(/[.,;!?]+$/, ""));
                        const haveIdx = la.findIndex(t => t === "have" || t === "has" || t === "had" || t === "have a" || t === "has a" || t === "had a" || t === "have an" || t === "has an");
                        if (haveIdx > 0 && !la.includes("anymore") && !la.includes("any")) {
                            if (true) {
                                const before = tokens.slice(0, haveIdx);
                                const after = tokens.slice(haveIdx + 1);
                                const subjSet = new Set(["i","you","we","they","he","she","it"]);
                                let subj = null;
                                for (const t of before) {
                                    const tl = t.toLowerCase().replace(/[.,;!?]+$/, "");
                                    if (subjSet.has(tl)) { subj = t; break; }
                                }
                                let num = null;
                                let adjs = [];
                                let nouns = [];
                                for (const t of after) {
                                    const tl = t.toLowerCase().replace(/[.,;!?]+$/, "");
                                    if (tl === "a" || tl === "an" || tl === "the") continue;
                                    if (/^\\d+$/.test(tl) || ["one","two","three","four","five","5","6","7","8","9","10"].includes(tl)) {
                                        num = t; continue;
                                    }
                                    if (isAdjective(t) || adjectiveMap.has(tl) || ["bad","good","big","small","new","old"].includes(tl)) {
                                        adjs.push(getWordTranslation(t) || adjectiveMap.get(tl) || dict.get(tl) || t);
                                        continue;
                                    }
                                    if (isNoun(t) || ["book","books","thing","things","people","house"].includes(tl)) {
                                        nouns.push(getWordTranslation(t) || dict.get(tl) || t);
                                        continue;
                                    }
                                }
                                if (subj && (nouns.length || adjs.length)) {
                                    const parts = [];
                                    parts.push(getSubjectTranslation(subj) || getWordTranslation(subj) || subj);
                                    if (num) parts.push(getWordTranslation(num) || num);
                                    parts.push(...nouns);
                                    parts.push(...adjs);
                                    parts.push("ꤥ꤬"); // have
                                    let r = parts.filter(Boolean).join(" ").replace(/\s+/g, " ").trim();
                                    if (trailingPunct === "?") r += "?";
                                    else if (trailingPunct === "꤯") r += "꤯";
                                    else if (trailingPunct) r += trailingPunct;
                                    return reorderWhBeforeTimeConj(r);
                                }
                            }
                        }
                    }

                    // Let him go if you don't want him anymore
                    // → Let go him if you want anymore him don't ꤔꤌꤣ꤬
                    {
                        const la = tokens.map(t => t.toLowerCase().replace(/[.,;!?]+$/, ""));
                        if (la[0] === "let" && la.includes("if")) {
                            const ifIdx = la.indexOf("if");
                            const before = tokens.slice(1, ifIdx); // him go / him go ...
                            const after = tokens.slice(ifIdx + 1);
                            // before: him go → go him (verb then object)
                            let verbT = null;
                            const objs = [];
                            for (const t of before) {
                                const tl = t.toLowerCase().replace(/[.,;!?]+$/, "");
                                if (!tl) continue;
                                if (!verbT && (isActionVerb(t) || ["go","come","do","eat","call","stay"].includes(tl))) {
                                    verbT = getWordTranslation(t) || dict.get(tl) || t;
                                    continue;
                                }
                                objs.push(getWordTranslation(t) || getSubjectTranslation(t) || t);
                            }
                            // after: you don't want him anymore → you want anymore him don't
                            let subj = null, verb2 = null, obj2 = null, anymore = false, neg = false;
                            for (const t of after) {
                                const tl = t.toLowerCase().replace(/[.,;!?]+$/, "");
                                if (["don't","doesn't","didn't","do not","not"].includes(tl)) { neg = true; continue; }
                                if (tl === "anymore" || tl === "any more") { anymore = true; continue; }
                                if (!subj && ["i","you","we","they","he","she","it"].includes(tl)) {
                                    subj = t; continue;
                                }
                                if (!verb2 && (isActionVerb(t) || ["want","wants","need","go","like"].includes(tl))) {
                                    verb2 = t; continue;
                                }
                                if (verb2 && !obj2) {
                                    obj2 = t; continue;
                                }
                            }
                            const parts = ["ꤘꤛꤢꤩ"]; // let
                            if (verbT) parts.push(verbT);
                            parts.push(...objs);
                            parts.push(getWordTranslation("if") || dict.get("if") || "ꤊꤤ꤬");
                            if (subj) parts.push(getSubjectTranslation(subj) || getWordTranslation(subj) || subj);
                            if (verb2) parts.push(getWordTranslation(verb2) || dict.get(verb2.toLowerCase()) || verb2);
                            if (anymore) parts.push("ꤕꤟꤥꤕꤢ꤭");
                            if (obj2) parts.push(getWordTranslation(obj2) || getSubjectTranslation(obj2) || obj2);
                            if (neg) parts.push("ꤒꤥ꤬");
                            parts.push("ꤔꤌꤣ꤬");
                            let r = parts.filter(Boolean).join(" ").replace(/\s+/g, " ").trim();
                            if (trailingPunct === "?") r += "?";
                            else if (trailingPunct === "꤯") r += "꤯";
                            else if (trailingPunct) r += trailingPunct;
                            return reorderWhBeforeTimeConj(r);
                        }
                    }

                    // I don't have anymore / any books
                    // I don't have anymore → I have anymore don't
                    // I don't have any books → I books have any don't
                    // Do you have anymore books → you books have anymore ꤟꤟꤢꤧ꤭
                    {
                        const la = tokens.map(t => t.toLowerCase().replace(/[.,;!?]+$/, ""));
                        const hasAnymore = la.includes("anymore") || (la.includes("any") && la.includes("more"));
                        const hasAny = la.includes("any") && !hasAnymore;
                        const hasHave = la.includes("have") || la.includes("has") || la.includes("had");
                        if (hasHave && (hasAnymore || hasAny)) {
                            const isDoQ = ["do","does","did"].includes(la[0]);
                            const subjSet = new Set(["i","you","we","they","he","she","it"]);
                            let subj = null, noun = null, neg = false;
                            for (let i = 0; i < tokens.length; i++) {
                                const tl = la[i];
                                if (["do","does","did","have","has","had","a","an","the","more"].includes(tl)) continue;
                                if (tl === "anymore" || tl === "any") continue;
                                if (["don't","doesn't","didn't","do not","not"].includes(tl)) { neg = true; continue; }
                                if (!subj && subjSet.has(tl)) { subj = tokens[i]; continue; }
                                if (isNoun(tokens[i]) || ["books","book","people","money"].includes(tl)) {
                                    noun = tokens[i]; continue;
                                }
                            }
                            const parts = [];
                            if (subj) parts.push(getSubjectTranslation(subj) || getWordTranslation(subj) || subj);
                            if (noun) parts.push(getWordTranslation(noun) || dict.get(noun.toLowerCase()) || noun);
                            parts.push("ꤥ꤬"); // have
                            parts.push("ꤕꤟꤥꤕꤢ꤭"); // anymore or any
                            if (neg) parts.push("ꤒꤥ꤬");
                            if (isDoQ) parts.push("ꤟꤟꤢꤧ꤭");

                    // as much as → ꤢꤧꤢꤧꤖꤢꤨ … ꤙꤢꤒꤢꤩ꤭ ꤔꤌꤣ꤬

                            if (!verbTrans && (tl === "want" || tl === "wants" || tl === "need" || tl === "needs") && i + 1 < tokens.length) {
                                const n1 = tokens[i + 1].toLowerCase().replace(/[.,;!?]+$/, "");
                                if (n1 === "to" && i + 2 < tokens.length) {
                                    const v2 = tokens[i + 2].toLowerCase().replace(/[.,;!?]+$/, "");
                                    const wantToTrans = getWordTranslation(tl.startsWith("want") ? "want to" : "need to") ||
                                        (tl.startsWith("want") ? "ꤞꤢꤧꤐꤟꤢꤦ" : "ꤜꤥ꤬");
                                    const vTrans = getWordTranslation(v2) || getWordTranslation(tokens[i + 2]) || tokens[i + 2];
                                    verbTrans = wantToTrans + " " + vTrans;
                                    tokens[i + 1] = "";
                                    tokens[i + 2] = "";
                                    continue;
                                }
                            }
                            if (!verbTrans && (isActionVerb(tokens[i]) || ["want","needs","need","go","come","comes","goes","wants","like","likes","liked","take","takes","took","love","loves","send","sends","sent","eat","eats","ate","buy","buys","bought"].includes(tl))) {
                                const vKey = (tl === "wants") ? "want" : (tl === "likes" || tl === "liked") ? "like" : tl;
                                if (vKey === "like") {
                                    verbTrans = "ꤞꤢꤧꤕꤜꤢꤪ꤬ꤥ꤬";
                                } else {
                                    verbTrans = getWordTranslation(vKey) || getWordTranslation(tokens[i]) || tokens[i];
                                }
                                continue;
                            }
                            if (!tl) continue;
                            if (tl === "is" || tl === "are" || tl === "was" || tl === "were" || tl === "am") continue;
                            // prepositions + following nouns for whose book is on the table
                            if (["on","in","at","under","over","by","near"].includes(tl)) {
                                // collect prep object
                                let objParts = [];
                                for (let j = i + 1; j < tokens.length; j++) {
                                    const jl = tokens[j].toLowerCase().replace(/[.,;!?]+$/, "");
                                    if (skipAux.has(jl)) continue;
                                    if (isSubject(tokens[j])) break;
                                    objParts.push(getWordTranslation(tokens[j]) || tokens[j]);
                                }
                                const prepTrans = getWordTranslation(tokens[i]) || dict.get(tl) || tl;
                                // order: object then prep then ꤔꤌꤣ꤬
                                if (objParts.length) prepBits.push(...objParts);
                                prepBits.push(prepTrans);
                                prepBits.push("ꤔꤌꤣ꤬");
                                break;
                            }
                        }

                        // Build: subject verb modal noun WH  [ꤕꤢꤩ꤭ for whose]
                        // Whose + prep: prepBits first then Who noun ꤕꤢꤩ꤭
                        let parts = [];
                        if (isWhose && prepBits.length) {
                            parts.push(...prepBits);
                            parts.push(whTrans);
                            if (nounTrans) parts.push(nounTrans);
                            parts.push("ꤕꤢꤩ꤭");
                        } else if (isWhose) {
                            // you go will Who house ꤕꤢꤩ꤭
                            if (subjectTrans) parts.push(subjectTrans);
                            if (verbTrans) parts.push(verbTrans);
                            if (modalShort) parts.push(modalShort);
                            parts.push(whTrans);
                            if (nounTrans) parts.push(nounTrans);
                            parts.push("ꤕꤢꤩ꤭");
                        } else if (haveTrans) {
                            // you books have How many
                            if (subjectTrans) parts.push(subjectTrans);
                            if (nounTrans) parts.push(nounTrans);
                            parts.push(haveTrans);
                            if (verbTrans) parts.push(verbTrans);
                            if (modalShort) parts.push(modalShort);
                            parts.push(whTrans);
                        } else if (whKey === "which" || (whKey === "what" && tokens.some(t => t.toLowerCase().replace(/[.,;!?]+$/,"") === "from"))) {
                            // What country do you come from → country What you come ꤟꤟꤢꤧ꤭
                            // Which book will you take → book Which you take …
                            if (nounTrans) parts.push(nounTrans);
                            parts.push(whTrans);
                            if (subjectTrans) parts.push(subjectTrans);
                            // come from → come (drop from)
                            let hasCome = false;
                            for (let ti = 0; ti < tokens.length; ti++) {
                                const tl = tokens[ti].toLowerCase().replace(/[.,;!?]+$/, "");
                                if (tl === "come" || tl === "comes" || tl === "came") {
                                    parts.push(getWordTranslation(tl) || dict.get("come") || "ꤟꤛꤢ꤭");
                                    hasCome = true;
                                }
                                if (tl === "first") {
                                    parts.push(getWordTranslation("first") || dict.get("first") || "ꤚꤟꤢꤩ");
                                }
                            }
                            if (!hasCome && verbTrans) parts.push(verbTrans);
                            if (modalShort) parts.push(modalShort);
                            parts.push("ꤟꤟꤢꤧ꤭");
                        } else {
                            if (subjectTrans) parts.push(subjectTrans);
                            if (verbTrans) parts.push(verbTrans);
                            if (modalShort) parts.push(modalShort);
                            if (nounTrans) parts.push(nounTrans);
                            parts.push(whTrans);
                        }

                        let result = parts.filter(Boolean).join(" ").replace(/\s+/g, " ").trim();
                        if (trailingPunct) {
                            if (trailingPunct === "?") result += "?";
                            else if (trailingPunct === "꤯") result += "꤯";
                            else if (trailingPunct === "!") result += "!";
                            else result += trailingPunct;
                        }
                        return result;
                    }

                    // Special handling: "not only ... but also ..."
                    {
                        let notOnlyIndex = -1;
                        let notOnlySkip = 0;
                        let butAlsoIndex = -1;
                        let butAlsoSkip = 0;

                        for (let i = 0; i < tokens.length; i++) {
                            const lower = tokens[i].toLowerCase().replace(/[.,;!?]+$/, "");
                            if (lower === "not only") {
                                notOnlyIndex = i;
                                notOnlySkip = 1;
                            } else if (lower === "but also") {
                                butAlsoIndex = i;
                                butAlsoSkip = 1;
                            }
                            if (i + 1 < tokens.length) {
                                const two = (tokens[i] + " " + tokens[i + 1]).toLowerCase().replace(/[.,;!?]+$/g, "");
                                if (two === "not only") {
                                    notOnlyIndex = i;
                                    notOnlySkip = 2;
                                }
                                if (two === "but also") {
                                    butAlsoIndex = i;
                                    butAlsoSkip = 2;
                                }
                            }
                        }

                        if (notOnlyIndex >= 0 && butAlsoIndex > notOnlyIndex) {
                            const before = tokens.slice(0, notOnlyIndex);
                            const middle = tokens.slice(notOnlyIndex + notOnlySkip, butAlsoIndex);
                            const after = tokens.slice(butAlsoIndex + butAlsoSkip);

                            let beforeResult = translatePhrase(before, false, false, false, false, null, false, null, null);
                            let middleResult = translatePhrase(middle, false, false, false, false, null, false, null, null);
                            let afterResult = translatePhrase(after, false, false, false, false, null, false, null, null);

                            let result = "";
                            if (beforeResult.text) result += beforeResult.text + " ";
                            if (middleResult.text) result += middleResult.text + " ";
                            result += "ꤒꤢꤦꤗꤟꤢꤒꤥ꤬ ";
                            if (afterResult.text) result += afterResult.text + " ";
                            result += "ꤕꤢ꤭ꤕꤢ꤭";

                            result = result.replace(/\s+/g, " ").trim();
                            if (trailingPunct) {
                                if (trailingPunct === "?") result += "?";
                                else if (trailingPunct === "꤯") result += "꤯";
                                else if (trailingPunct === "!") result += "!";
                                else result += trailingPunct;
                            }
                            return result;
                        }
                    }

                    let hasBut = false;
                    let butIndex = -1;
                    for (let i = 0; i < tokens.length; i++) {
                        if (tokens[i].toLowerCase().replace(/[.,;!?]+$/, "") === "but") {
                            hasBut = true;
                            butIndex = i;
                            break;
                        }
                    }
                    if (hasBut && butIndex >= 0) {
                        let mainTokens = [];
                        let butTokens = [];
                        for (let i = 0; i < butIndex; i++) mainTokens.push(tokens[i]);
                        for (let i = butIndex + 1; i < tokens.length; i++) butTokens.push(tokens[i]);

                        // Recurse so nested when/negatives/modals apply on each side
                        let mainText = mainTokens.join(" ").replace(/\s+/g, " ").trim();
                        let butText = butTokens.join(" ").replace(/\s+/g, " ").trim();
                        let mainOut = mainText ? translateToKayah(mainText) : "";
                        let butOut = butText ? translateToKayah(butText) : "";

                        let result = mainOut || "";
                        result = (result ? result + " " : "") + "ꤗꤢ꤬ꤔꤢ";
                        if (butOut) result += " " + butOut;
                        result = result.replace(/\s+/g, " ").trim();
                        if (trailingPunct) {
                            if (trailingPunct === "?") result += "?";
                            else if (trailingPunct === "꤯") result += "꤯";
                            else if (trailingPunct === "!") result += "!";
                            else result += trailingPunct;
                        }
                        return result;
                    }


                    let timeConjIndex = -1;
                    let timeConjType = null;
                    let timeConjSkip = 1;

                    for (let i = 0; i < tokens.length; i++) {
                        if (i + 2 < tokens.length) {
                            const threeWord = (tokens[i] + " " + tokens[i + 1] + " " + tokens[i + 2]).toLowerCase().replace(/[.,;!?]+$/g, "");
                            if (timeConjunctions.has(threeWord)) {
                                timeConjIndex = i;
                                timeConjType = threeWord;
                                timeConjSkip = 3;
                                break;
                            }
                        }
                        if (i + 1 < tokens.length) {
                            const twoWord = (tokens[i] + " " + tokens[i + 1]).toLowerCase().replace(/[.,;!?]+$/g, "");
                            if (timeConjunctions.has(twoWord)) {
                                timeConjIndex = i;
                                timeConjType = twoWord;
                                timeConjSkip = 2;
                                break;
                            }
                        }
                        const lower = tokens[i].toLowerCase().replace(/[.,;!?]+$/, "");
                        if (timeConjunctions.has(lower)) {
                            timeConjIndex = i;
                            timeConjType = lower;
                            timeConjSkip = 1;
                            break;
                        }
                    }

                    if (timeConjIndex >= 0 && timeConjIndex < tokens.length - 1) {
                        let mainTokens = [];
                        let timeTokens = [];
                        for (let i = 0; i < timeConjIndex; i++) {
                            mainTokens.push(tokens[i]);
                        }
                        for (let i = timeConjIndex + timeConjSkip; i < tokens.length; i++) {
                            timeTokens.push(tokens[i]);
                        }

                        // Sentence-initial "When/Before/After X, Y" → X + conj , Y
                        // when/before at END of first clause, before comma (or before period if no comma)
                        // When the train arrived, we boarded → train arrived when , we boarded
                        // When the train arrived. → train arrived when .
                        let frontedTimeConj = false;
                        if (timeConjIndex === 0 && mainTokens.length === 0) {
                            let commaIdx = -1;
                            for (let i = 0; i < timeTokens.length; i++) {
                                if (/,$/.test(timeTokens[i]) || timeTokens[i] === ",") {
                                    commaIdx = i;
                                    break;
                                }
                            }
                            // tokens may have lost trailing commas — recover from cleanSentence
                            if (commaIdx < 0 && typeof cleanSentence === "string" && cleanSentence.indexOf(",") >= 0) {
                                const left = cleanSentence.split(",")[0];
                                // count words in left after stripping the leading conj
                                const leftWords = left.trim().split(/\s+/).filter(function (w) { return w.length > 0; });
                                // leftWords includes "When"/"Before"/… as first word(s)
                                const conjWordCount = timeConjSkip; // already matched at start
                                const subWordCount = Math.max(0, leftWords.length - conjWordCount);
                                if (subWordCount > 0 && subWordCount < timeTokens.length) {
                                    commaIdx = subWordCount - 1;
                                }
                            }
                            if (commaIdx >= 0) {
                                mainTokens = timeTokens.slice(commaIdx + 1);
                                timeTokens = timeTokens.slice(0, commaIdx + 1).map(function (t) {
                                    return t.replace(/,$/, "");
                                }).filter(function (t) { return t.length > 0; });
                                frontedTimeConj = true;
                            }
                        }

                        // Fronted: sub-clause + conj + comma + main
                        if (frontedTimeConj) {
                            let timeTranslationFront = timeConjunctions.get(timeConjType);
                            if (timeTranslationFront === "WHEN_PLACEHOLDER") timeTranslationFront = "ꤢ꤬ꤋꤢꤧ꤭";
                            const subRes = translatePhrase(timeTokens, false, false, false, false, null, false, null, null);
                            // Prefer original text after first comma so nested before/when keep commas
                            let mainText = mainTokens.join(" ").replace(/\s+/g, " ").trim();
                            if (typeof cleanSentence === "string" && cleanSentence.indexOf(",") >= 0) {
                                const afterComma = cleanSentence.split(",").slice(1).join(",").trim();
                                if (afterComma) mainText = afterComma;
                            }
                            let mainOut = mainText ? translateToKayah(mainText) : "";
                            // X when , Y   (conj at end of first clause, before comma)
                            let result = (subRes.text ? subRes.text + " " : "") + (timeTranslationFront || "");
                            result += " ,";
                            if (mainOut) result += " " + mainOut;
                            result = result.replace(/\s+/g, " ").trim();
                            result = result.replace(/\s*,\s*,/g, " ,");
                            if (trailingPunct) {
                                if (trailingPunct === "?") result += "?";
                                else if (trailingPunct === "꤯") result += "꤯";
                                else if (trailingPunct === "!") result += "!";
                                else if (trailingPunct !== ",") result += trailingPunct;
                            }
                            return result;
                        }

                        // Pure adverbial clause: "when times were tough" (no main clause)
                        // → times were tough when + ꤔꤌꤣ꤬
                        if (timeConjIndex === 0 && mainTokens.length === 0 && timeTokens.length > 0 && !frontedTimeConj) {
                            let timeTranslationOnly = timeConjunctions.get(timeConjType);
                            if (timeTranslationOnly === "WHEN_PLACEHOLDER") timeTranslationOnly = "ꤢ꤬ꤋꤢꤧ꤭";
                            const subOnly = translatePhrase(timeTokens, false, false, false, false, null, false, null, null);
                            let result = (subOnly.text ? subOnly.text + " " : "") + (timeTranslationOnly || "");
                            result = result.replace(/\s+/g, " ").trim();
                            if (!result.includes("ꤔꤌꤣ꤬")) result += " ꤔꤌꤣ꤬";
                            result = result.replace(/\s+/g, " ").trim();
                            if (trailingPunct) {
                                if (trailingPunct === "?") result += "?";
                                else if (trailingPunct === "꤯") result += "꤯";
                                else if (trailingPunct === "!") result += "!";
                                else result += trailingPunct;
                            }
                            return result;
                        }

                        let whCanExtract = extractLeadingWhCan(mainTokens);
                        mainTokens = whCanExtract.tokens;
                        let leadingWhCanPhrase = whCanExtract.phrase;

                        let mainResult = translatePhrase(mainTokens, endsWithQuestion || isToBeQuestion || isWhQuestion, isHaveStart, isImperative, hasModalBeforeConjunction, modalType, false, null, null);
                        if (leadingWhCanPhrase) {
                            mainResult.text = (mainResult.text ? mainResult.text + " " : "") + leadingWhCanPhrase;
                        }

                        // Are you fine after I go → you fine ꤟꤟꤢꤧ꤭ | I go after
                        if (isToBeQuestion) {
                            let mt = mainTokens.slice();
                            if (mt.length > 0 && isToBeQuestionStart(mt[0])) {
                                mt = mt.slice(1);
                            }
                            mainResult = translatePhrase(mt, true, false, isImperative, hasModalBeforeConjunction, modalType, false, null, null);
                            if (leadingWhCanPhrase) {
                                mainResult.text = (mainResult.text ? mainResult.text + " " : "") + leadingWhCanPhrase;
                            }
                            mainResult.text = (mainResult.text ? mainResult.text + " " : "") + "ꤟꤟꤢꤧ꤭";
                        }

                        const secondaryConjunctions = {
                            "because": "ꤗꤟꤢꤩ꤬ꤒꤢꤩ꤭ꤚꤢꤪ",
                            "and": "ꤓꤌꤣ꤭ꤕꤢ꤭",
                            "nor": "ꤒꤥ꤬ꤒꤥ꤬",
                            "but": "ꤗꤢ꤬ꤔꤢ",
                            "or": "ꤒꤥ꤬ꤗꤢ꤬",
                            "yet": "ꤟꤤ",
                            "so": "ꤚꤢꤪ",
                            "either": "ꤒꤣ꤬ꤊꤟꤊꤣ꤬ꤊꤟꤊꤣ꤬",
                            "neither": "ꤜꤟꤢꤪ꤭ꤟꤤ꤭ꤥ꤬",
                            "both": "ꤜꤟꤢꤪ꤭ꤜꤟꤢꤪ꤭",
                            "since": "ꤔꤌꤣ꤬ꤕꤢ꤭",
                            "while": "ꤢ꤬ꤋꤢꤧ꤭",
                            "before": "ꤟꤤꤒꤥ꤬ꤢ꤬ꤋꤢꤧ꤭",
                            "after": "ꤋꤛꤢꤩ꤭",
                            "if": "ꤊꤤ꤬",
                            "not only": "ꤒꤢꤦꤗꤟꤢꤒꤥ꤬",
                            "but also": "ꤕꤢ꤭ꤕꤢ꤭",
                            "as soon as": "ꤙꤤꤋꤢꤧ꤭ꤒꤢꤩ꤭ꤔꤌꤣ꤬",
                            "although": "ꤒꤢ꤬ꤘꤣ꤬",
                            "whether": "ꤒꤣ꤬ꤊꤟꤊꤣ꤬ꤊꤟꤊꤣ꤬",
                            "once": "ꤒꤣ꤬ꤖꤟꤌꤣꤒꤌꤣ꤭",
                            "inasmuch as": "ꤢ꤬ꤗꤟꤢꤩ꤬ꤒꤢꤩ꤭ꤔꤌꤣ꤬"
                        };

                        let secondaryIndex = -1;
                        let secondaryType = null;
                        let secondarySkip = 1;

                        for (let i = 0; i < timeTokens.length; i++) {
                            if (i + 1 < timeTokens.length) {
                                const twoWord = (timeTokens[i] + " " + timeTokens[i + 1]).toLowerCase().replace(/[.,;!?]+$/g, "");
                                if (secondaryConjunctions.hasOwnProperty(twoWord)) {
                                    secondaryIndex = i;
                                    secondaryType = twoWord;
                                    secondarySkip = 2;
                                    break;
                                }
                            }
                        }

                        if (secondaryIndex === -1) {
                            for (let i = 0; i < timeTokens.length; i++) {
                                const lower = timeTokens[i].toLowerCase().replace(/[.,;!?]+$/, "");
                                if (secondaryConjunctions.hasOwnProperty(lower)) {
                                    secondaryIndex = i;
                                    secondaryType = lower;
                                    secondarySkip = 1;
                                    break;
                                }
                            }
                        }

                        let timeTranslation = timeConjunctions.get(timeConjType);
                        if (timeTranslation === "WHEN_PLACEHOLDER") {
                            timeTranslation = "ꤢ꤬ꤋꤢꤧ꤭";
                        }
                        // when/while already have concrete translations in timeConjunctions

                        // Modal/aux form goes at end of main clause, BEFORE the time conjunction
                        // Full form (…ꤟꤟꤢꤧ꤭) only when modal starts the sentence; otherwise short form
                        let modalEndForm = null;
                        if (mainResult.modalInfo) {
                            if (mainResult.modalInfo.type === "will" || mainResult.modalInfo.type === "would") {
                                modalEndForm = isWillStart ? "ꤕꤢ꤭ꤟꤟꤢꤧ꤭" : "ꤕꤢ꤭";
                            } else if (mainResult.modalInfo.type === "can" || mainResult.modalInfo.type === "could" || mainResult.modalInfo.type === "may") {
                                modalEndForm = mainResult.modalInfo.type === "may"
                                    ? (isMayStart ? "ꤢ꤬ꤔꤟꤤꤏꤢꤜꤟꤢꤩꤟꤟꤢꤧ꤭" : "ꤢ꤬ꤔꤟꤤꤏꤢꤜꤟꤢꤩ")
                                    : (isCanStart || isCouldStart) ? "ꤢ꤬ꤔꤟꤤꤕꤚꤢꤧꤟꤟꤢꤧ꤭" : "ꤢ꤬ꤔꤟꤤꤕꤚꤢꤧ";
                            } else {
                                modalEndForm = mainResult.modalInfo.translation;
                            }
                        } else {
                            for (let i = 0; i < mainTokens.length; i++) {
                                const lower = mainTokens[i].toLowerCase().replace(/[.,;!?]+$/, "");
                                if (lower === "will" || lower === "would") { modalEndForm = isWillStart ? "ꤕꤢ꤭ꤟꤟꤢꤧ꤭" : "ꤕꤢ꤭"; break; }
                                if (isDoStart && (lower === "do" || lower === "does" || lower === "did")) { modalEndForm = "ꤟꤟꤢꤧ꤭"; break; }
                            }
                        }

                        let result = mainResult.text;
                        // when-clause: will after subject before main verb (I will eat when…)
                        // other time conj: will at end of main before sub
                        if (modalEndForm) {
                            if (timeConjType === "when" && (modalEndForm === "ꤕꤢ꤭" || modalEndForm === "ꤕꤢ꤭ꤟꤟꤢꤧ꤭")) {
                                const subjForms = new Set(["ꤠꤢ꤭", "ꤢꤧ꤬", "ꤕꤟꤢꤧ꤬", "ꤢꤧ꤬ꤞꤤ꤭", "ꤔꤟꤢꤧ꤬"]);
                                let words = (result || "").split(" ").filter(Boolean);
                                let inserted = false;
                                let out = [];
                                for (let wi = 0; wi < words.length; wi++) {
                                    out.push(words[wi]);
                                    if (!inserted && subjForms.has(words[wi])) {
                                        out.push(modalEndForm === "ꤕꤢ꤭ꤟꤟꤢꤧ꤭" ? "ꤕꤢ꤭" : modalEndForm);
                                        inserted = true;
                                    }
                                }
                                if (!inserted) out.unshift(modalEndForm);
                                result = out.join(" ");
                            } else {
                                result = (result ? result + " " : "") + modalEndForm;
                            }
                        }
                        if (isShouldStart) {
                            result = (result ? result + " " : "") + "ꤟꤟꤢꤧ꤭";
                        }

                        // Order: main + will + subordinate + conjunction(at end)
                        // e.g. I will eat after you go → I eat will you go after
                        // Conjunctions at end of sub clause: after, before, when, unless,
                        // even if, while, during, as soon as, although, even though, though
                        // when (and similar) after the subordinate verb/content
                        // e.g. … when they talk → … they talk ꤢ꤬ꤋꤢꤧ꤭
                        const conjAtEndOfSub = new Set([
                            "after", "before", "when", "unless", "even if", "while",
                            "during", "as soon as", "although", "even though", "though",
                            "since"
                        ]);
                        const putConjAtEnd = conjAtEndOfSub.has(timeConjType);

                        if (secondaryIndex >= 0) {
                            let beforeSecondary = timeTokens.slice(0, secondaryIndex);
                            let afterSecondary = timeTokens.slice(secondaryIndex + secondarySkip);

                            // If beforeSecondary has a comma (doors closed, which was lucky because …)
                            // keep only up to comma as time-sub; before/when right after closed, before comma
                            let midAfterComma = [];
                            if (putConjAtEnd) {
                                let cIdx = -1;
                                for (let i = 0; i < beforeSecondary.length; i++) {
                                    if (/,$/.test(beforeSecondary[i]) || beforeSecondary[i] === ",") {
                                        cIdx = i;
                                        break;
                                    }
                                }
                                // recover comma lost in tokenization
                                if (cIdx < 0 && typeof cleanSentence === "string" && cleanSentence.indexOf(",") >= 0) {
                                    const conjRe = new RegExp("\\b" + String(timeConjType).replace(/\s+/g, "\\s+") + "\\b", "i");
                                    const cm = cleanSentence.match(conjRe);
                                    if (cm) {
                                        const afterConj = cleanSentence.slice(cm.index + cm[0].length);
                                        const commaPos = afterConj.indexOf(",");
                                        if (commaPos >= 0) {
                                            const leftPart = afterConj.slice(0, commaPos).trim();
                                            const leftWords = leftPart.split(/\s+/).filter(function (w) { return w.length > 0; });
                                            // only words that belong to beforeSecondary
                                            if (leftWords.length > 0 && leftWords.length <= beforeSecondary.length) {
                                                cIdx = leftWords.length - 1;
                                            }
                                        }
                                    }
                                }
                                if (cIdx >= 0) {
                                    midAfterComma = beforeSecondary.slice(cIdx + 1);
                                    beforeSecondary = beforeSecondary.slice(0, cIdx + 1).map(function (t) {
                                        return t.replace(/,$/, "");
                                    }).filter(function (t) { return t.length > 0; });
                                }
                            }

                            let beforeResult = translatePhrase(beforeSecondary, false, false, false, false, null, false, null, null);
                            let afterResult = translatePhrase(afterSecondary, false, false, false, false, null, false, null, null);

                            if (beforeResult.text.length > 0) {
                                result += " " + beforeResult.text;
                            }
                            if (putConjAtEnd) {
                                // doors closed + before
                                result += " " + timeTranslation;
                                // material between comma and secondary conj (e.g. which was lucky)
                                if (midAfterComma.length > 0) {
                                    const midRes = translatePhrase(midAfterComma, false, false, false, false, null, false, null, null);
                                    if (midRes.text) result += " " + midRes.text;
                                }
                                result += " " + secondaryConjunctions[secondaryType];
                                if (afterResult.text.length > 0) {
                                    result += " " + afterResult.text;
                                }
                            } else {
                                result += " " + timeTranslation;
                                result += " " + secondaryConjunctions[secondaryType];
                                if (afterResult.text.length > 0) {
                                    result += " " + afterResult.text;
                                }
                            }
                        } else {
                            // Split at comma so "before the doors closed, which …"
                            // → doors closed + before | which …
                            // before/when at end of that clause, before the comma
                            let timeSubTokens = timeTokens;
                            let afterCommaTokens = [];
                            if (putConjAtEnd) {
                                let cIdx = -1;
                                for (let i = 0; i < timeTokens.length; i++) {
                                    if (/,$/.test(timeTokens[i]) || timeTokens[i] === ",") {
                                        cIdx = i;
                                        break;
                                    }
                                }
                                // tokens may have lost trailing commas — recover from cleanSentence
                                if (cIdx < 0 && typeof cleanSentence === "string" && cleanSentence.indexOf(",") >= 0) {
                                    // find text after the time conj word in cleanSentence
                                    const conjRe = new RegExp("\\b" + timeConjType.replace(/\s+/g, "\\s+") + "\\b", "i");
                                    const cm = cleanSentence.match(conjRe);
                                    if (cm) {
                                        const afterConj = cleanSentence.slice(cm.index + cm[0].length);
                                        const commaPos = afterConj.indexOf(",");
                                        if (commaPos >= 0) {
                                            const leftPart = afterConj.slice(0, commaPos).trim();
                                            const leftWords = leftPart.split(/\s+/).filter(function (w) { return w.length > 0; });
                                            if (leftWords.length > 0 && leftWords.length <= timeTokens.length) {
                                                cIdx = leftWords.length - 1;
                                            }
                                        }
                                    }
                                }
                                if (cIdx >= 0) {
                                    timeSubTokens = timeTokens.slice(0, cIdx + 1).map(function (t) {
                                        return t.replace(/,$/, "");
                                    }).filter(function (t) { return t.length > 0; });
                                    afterCommaTokens = timeTokens.slice(cIdx + 1);
                                }
                            }
                            let timeResult = translatePhrase(timeSubTokens, false, false, false, false, null, false, null, null);
                            // he will be here → he be will here
                            {
                                const hasWill = timeSubTokens.some(t => {
                                    const tl = t.toLowerCase().replace(/[.,;!?]+$/, "");
                                    return tl === "will" || tl === "would";
                                });
                                if (hasWill && timeResult.text) {
                                    let tw = timeResult.text.replace(/\s+/g, " ").trim().split(" ").filter(Boolean);
                                    const beI = tw.indexOf("ꤥ꤬");
                                    const hereI = tw.findIndex(w => w === "ꤙꤤꤛꤢꤩ꤭" || w === "ꤙꤤꤔꤌꤣ꤬");
                                    const willI = tw.indexOf("ꤕꤢ꤭");
                                    if (beI >= 0 && hereI > beI) {
                                        if (willI >= 0) tw.splice(willI, 1);
                                        tw.splice(beI + 1, 0, "ꤕꤢ꤭");
                                        timeResult = Object.assign({}, timeResult, { text: tw.join(" ") });
                                    } else if (willI < 0 && (timeResult.modalInfo && (timeResult.modalInfo.type === "will" || timeResult.modalInfo.type === "would"))) {
                                        if (beI >= 0) tw.splice(beI + 1, 0, "ꤕꤢ꤭");
                                        else tw.push("ꤕꤢ꤭");
                                        timeResult = Object.assign({}, timeResult, { text: tw.join(" "), modalInfo: null });
                                    } else if (willI < 0) {
                                        // will was deferred out of sub — put after be
                                        if (beI >= 0 && hereI > beI) {
                                            tw.splice(beI + 1, 0, "ꤕꤢ꤭");
                                            timeResult = Object.assign({}, timeResult, { text: tw.join(" ") });
                                        }
                                    }
                                }
                            }

                            if (putConjAtEnd) {
                                if (timeResult.text.length > 0) {
                                    result += " " + timeResult.text;
                                }
                                result += " " + timeTranslation;
                            } else {
                                result += " " + timeTranslation;
                                if (timeResult.text.length > 0) {
                                    result += " " + timeResult.text;
                                }
                            }
                            if (afterCommaTokens.length > 0) {
                                const afterStr = afterCommaTokens.join(" ").replace(/\s+/g, " ").trim();
                                if (afterStr) {
                                    const afterOut = translateToKayah(afterStr);
                                    if (afterOut) result += " " + afterOut;
                                }
                            }
                        }

                        // ꤟꤟꤢꤧ꤭ already attached to main when isToBeQuestion (after adj/noun)

                        result = result.replace(/\s+/g, " ").trim();
                        // subordinate time clause always ends with ꤔꤌꤣ꤬
                        if (result && !result.includes("ꤔꤌꤣ꤬")) {
                            result = result + " ꤔꤌꤣ꤬";
                        }
                        result = result.replace(/\s+/g, " ").trim();
                        if (trailingPunct) {
                            if (trailingPunct === "?") result += "?";
                            else if (trailingPunct === "꤯") result += "꤯";
                            else if (trailingPunct === "!") result += "!";
                            else result += trailingPunct;
                        }
                        return result;
                    }

                    // Coordinating "but" — modal (will) goes at end of main clause, BEFORE ꤗꤢ꤬ꤔꤢ
                    let hasIf = false;
                    let ifIndex = -1;
                    for (let i = 0; i < tokens.length; i++) {
                        if (tokens[i].toLowerCase() === "if") {
                            hasIf = true;
                            ifIndex = i;
                            break;
                        }
                    }

                    if (hasIf && ifIndex >= 0) {
                        let mainTokens = [];
                        let ifTokens = [];
                        for (let i = 0; i < ifIndex; i++) {
                            mainTokens.push(tokens[i]);
                        }
                        for (let i = ifIndex + 1; i < tokens.length; i++) {
                            ifTokens.push(tokens[i]);
                        }
                        // "if not, …" → if + not stay together; not is not deferred to end
                        let ifNotPrefix = "";
                        if (ifTokens.length > 0 && ifTokens[0].toLowerCase().replace(/[.,;!?]+$/, "") === "not") {
                            ifNotPrefix = "ꤒꤥ꤬";
                            ifTokens = ifTokens.slice(1);
                            // drop bare comma token after not
                            if (ifTokens.length > 0 && ifTokens[0].replace(/[.,;!?]+$/, "") === "") {
                                ifTokens = ifTokens.slice(1);
                            }
                            while (ifTokens.length > 0 && ifTokens[0] === ",") {
                                ifTokens = ifTokens.slice(1);
                            }
                        }

                        // Sentence-initial If X, Y → if + X + Y(with will at end)
                        // If you come, I will go → if you come I go will
                        if (ifIndex === 0) {
                            let commaIdx = -1;
                            for (let i = 0; i < ifTokens.length; i++) {
                                if (/,$/.test(ifTokens[i]) || ifTokens[i] === ",") {
                                    commaIdx = i;
                                    break;
                                }
                            }
                            let ifClause = ifTokens;
                            let mainClause = [];
                            if (commaIdx >= 0) {
                                ifClause = ifTokens.slice(0, commaIdx + 1).map(t => t.replace(/,$/, "")).filter(t => t.length > 0);
                                mainClause = ifTokens.slice(commaIdx + 1);
                            } else {
                                // no comma: treat all as if-clause content after if (keep simple)
                                ifClause = ifTokens;
                                mainClause = [];
                            }
                            let ifRes = translatePhrase(ifClause, false, false, false, false, null, false, null, null);
                            let mainText = mainClause.join(" ").replace(/\s+/g, " ").trim();
                            let mainOut = mainText ? translateToKayah(mainText) : "";
                            let result = "ꤊꤤ꤬";
                            if (ifNotPrefix) result += " " + ifNotPrefix;
                            if (ifRes.text) result += " " + ifRes.text;
                            // can/will/could/would inside if-clause → end of if-clause
                            if (ifRes.modalInfo) {
                                let ifModal = ifRes.modalInfo.translation;
                                if (ifRes.modalInfo.type === "will" || ifRes.modalInfo.type === "would") ifModal = "ꤕꤢ꤭";
                                else if (ifRes.modalInfo.type === "may") ifModal = "ꤢ꤬ꤔꤟꤤꤏꤢꤜꤟꤢꤩ";
                                else if (ifRes.modalInfo.type === "can" || ifRes.modalInfo.type === "could") ifModal = "ꤢ꤬ꤔꤟꤤꤕꤚꤢꤧ";
                                result += " " + ifModal;
                            }
                            if (mainOut) result += " " + mainOut;
                            result = result.replace(/\s+/g, " ").trim();
                            if (trailingPunct) {
                                if (trailingPunct === "?") result += "?";
                                else if (trailingPunct === "꤯") result += "꤯";
                                else if (trailingPunct === "!") result += "!";
                                else result += trailingPunct;
                            }
                            return result;
                        }

                        let mainResult = translatePhrase(mainTokens, endsWithQuestion || isToBeQuestion || isWhQuestion, isHaveStart, isImperative, hasModalBeforeConjunction, modalType, false, null, null);
                        let ifResult = translatePhrase(ifTokens, false, false, false, false, null, false, null, null);

                        // Modal/aux form goes at end of main clause, BEFORE the conjunction
                        // Full form only when modal starts the sentence; otherwise short form
                        let modalEndForm = null;
                        if (mainResult.modalInfo) {
                            if (mainResult.modalInfo.type === "will" || mainResult.modalInfo.type === "would") {
                                modalEndForm = isWillStart ? "ꤕꤢ꤭ꤟꤟꤢꤧ꤭" : "ꤕꤢ꤭";
                            } else if (mainResult.modalInfo.type === "can" || mainResult.modalInfo.type === "could" || mainResult.modalInfo.type === "may") {
                                modalEndForm = mainResult.modalInfo.type === "may"
                                    ? (isMayStart ? "ꤢ꤬ꤔꤟꤤꤏꤢꤜꤟꤢꤩꤟꤟꤢꤧ꤭" : "ꤢ꤬ꤔꤟꤤꤏꤢꤜꤟꤢꤩ")
                                    : (isCanStart || isCouldStart) ? "ꤢ꤬ꤔꤟꤤꤕꤚꤢꤧꤟꤟꤢꤧ꤭" : "ꤢ꤬ꤔꤟꤤꤕꤚꤢꤧ";
                            } else {
                                modalEndForm = mainResult.modalInfo.translation;
                            }
                        } else {
                            for (let i = 0; i < mainTokens.length; i++) {
                                const lower = mainTokens[i].toLowerCase().replace(/[.,;!?]+$/, "");
                                if (lower === "will" || lower === "would") { modalEndForm = isWillStart ? "ꤕꤢ꤭ꤟꤟꤢꤧ꤭" : "ꤕꤢ꤭"; break; }
                                if (isDoStart && (lower === "do" || lower === "does" || lower === "did")) { modalEndForm = "ꤟꤟꤢꤧ꤭"; break; }
                            }
                        }

                        // Are you fine if I go → you fine ꤟꤟꤢꤧ꤭ if I go
                        if (isToBeQuestion) {
                            let mt = mainTokens.slice();
                            if (mt.length > 0 && isToBeQuestionStart(mt[0])) {
                                mt = mt.slice(1);
                            }
                            let headRes = translatePhrase(mt, true, false, isImperative, hasModalBeforeConjunction, modalType, false, null, null);
                            let result = headRes.text || "";
                            result = (result ? result + " " : "") + "ꤟꤟꤢꤧ꤭";
                            result += " ꤊꤤ꤬";
                            if (ifResult.text) result += " " + ifResult.text;
                            if (ifResult.modalInfo) {
                                let ifModal = ifResult.modalInfo.translation;
                                if (ifResult.modalInfo.type === "will" || ifResult.modalInfo.type === "would") ifModal = "ꤕꤢ꤭";
                                else if (ifResult.modalInfo.type === "may") ifModal = "ꤢ꤬ꤔꤟꤤꤏꤢꤜꤟꤢꤩ";
                                else if (ifResult.modalInfo.type === "can" || ifResult.modalInfo.type === "could") ifModal = "ꤢ꤬ꤔꤟꤤꤕꤚꤢꤧ";
                                result += " " + ifModal;
                            }
                            result = result.replace(/\s+/g, " ").trim();
                            if (trailingPunct) {
                                if (trailingPunct === "?") result += "?";
                                else if (trailingPunct === "꤯") result += "꤯";
                                else if (trailingPunct === "!") result += "!";
                                else result += trailingPunct;
                            }
                            return result;
                        }

                        let result = mainResult.text;
                        if (modalEndForm) {
                            result = (result ? result + " " : "") + modalEndForm;
                        }
                        if (result.length > 0) {
                            result += " ꤊꤤ꤬";
                        } else {
                            result = "ꤊꤤ꤬";
                        }
                        if (ifNotPrefix) result += " " + ifNotPrefix;
                        if (ifResult.text.length > 0) {
                            result += " " + ifResult.text;
                        }
                        // can/will/could/would inside if-clause → end of if-clause
                        if (ifResult.modalInfo) {
                            let ifModal = ifResult.modalInfo.translation;
                            if (ifResult.modalInfo.type === "will" || ifResult.modalInfo.type === "would") ifModal = "ꤕꤢ꤭";
                            else if (ifResult.modalInfo.type === "may") ifModal = "ꤢ꤬ꤔꤟꤤꤏꤢꤜꤟꤢꤩ";
                                else if (ifResult.modalInfo.type === "can" || ifResult.modalInfo.type === "could") ifModal = "ꤢ꤬ꤔꤟꤤꤕꤚꤢꤧ";
                            result += " " + ifModal;
                        }

                        result = result.replace(/\s+/g, " ").trim();
                        // if-clause ends with ꤔꤌꤣ꤬
                        if (result && !result.includes("ꤔꤌꤣ꤬")) {
                            result = result + " ꤔꤌꤣ꤬";
                        }
                        result = result.replace(/\s+/g, " ").trim();
                        if (trailingPunct) {
                            if (trailingPunct === "?") result += "?";
                            else if (trailingPunct === "꤯") result += "꤯";
                            else if (trailingPunct === "!") result += "!";
                            else result += trailingPunct;
                        }
                        return result;
                    }

                    let hasBecause = false;
                    let becauseIndex = -1;
                    for (let i = 0; i < tokens.length; i++) {
                        if (tokens[i].toLowerCase() === "because") {
                            hasBecause = true;
                            becauseIndex = i;
                            break;
                        }
                    }

                    if (hasBecause && becauseIndex >= 0) {
                        let mainTokens = [];
                        let becauseTokens = [];
                        for (let i = 0; i < becauseIndex; i++) {
                            mainTokens.push(tokens[i]);
                        }

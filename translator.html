                        for (let i = becauseIndex + 1; i < tokens.length; i++) {
                            becauseTokens.push(tokens[i]);
                        }

                        let mainResult = translatePhrase(mainTokens, endsWithQuestion || isToBeQuestion || isWhQuestion, isHaveStart, isImperative, hasModalBeforeConjunction, modalType, false, null, null);
                        let becauseResult = translatePhrase(becauseTokens, false, false, false, false, null, false, null, null);

                        // Modal/aux form goes at end of main clause, BEFORE the conjunction
                        // Full form only when modal starts the sentence; otherwise short form
                        let modalEndForm = null;
                        if (mainResult.modalInfo) {
                            if (mainResult.modalInfo.type === "will" || mainResult.modalInfo.type === "would") {
                                modalEndForm = isWillStart ? "ꤕꤢ꤭ꤟꤟꤢꤧ꤭" : "ꤕꤢ꤭";
                            } else if (mainResult.modalInfo.type === "can" || mainResult.modalInfo.type === "could" || mainResult.modalInfo.type === "may") {
                                modalEndForm = mainResult.modalInfo.type === "may"
                                    ? (isMayStart ? "ꤢ꤬ꤔꤟꤤꤏꤢꤜꤟꤢꤩꤟꤟꤢꤧ꤭" : "ꤢ꤬ꤔꤟꤤꤏꤢꤜꤟꤢꤩ")
                                    : (isCanStart || isCouldStart) ? "ꤢ꤬ꤔꤟꤤꤕꤚꤢꤧꤟꤟꤢꤧ꤭" : "ꤢ꤬ꤔꤟꤤꤕꤚꤢꤧ";
                            } else {
                                modalEndForm = mainResult.modalInfo.translation;
                            }
                        } else {
                            for (let i = 0; i < mainTokens.length; i++) {
                                const lower = mainTokens[i].toLowerCase().replace(/[.,;!?]+$/, "");
                                if (lower === "will" || lower === "would") { modalEndForm = isWillStart ? "ꤕꤢ꤭ꤟꤟꤢꤧ꤭" : "ꤕꤢ꤭"; break; }
                                if (isDoStart && (lower === "do" || lower === "does" || lower === "did")) { modalEndForm = "ꤟꤟꤢꤧ꤭"; break; }
                            }
                        }

                        let result = mainResult.text;
                        if (modalEndForm) {
                            result = (result ? result + " " : "") + modalEndForm;
                        }
                        if (isShouldStart) {
                            result = (result ? result + " " : "") + "ꤟꤟꤢꤧ꤭";
                        }
                        if (result.length > 0) {
                            result += " " + "ꤗꤟꤢꤩ꤬ꤒꤢꤩ꤭ꤚꤢꤪ";
                        } else {
                            result = "ꤗꤟꤢꤩ꤬ꤒꤢꤩ꤭ꤚꤢꤪ";
                        }
                        // will/can in because-clause at end of that clause
                        let becauseText = becauseResult.text;
                        if (becauseResult.modalInfo) {
                            let mf = becauseResult.modalInfo.translation;
                            if (becauseResult.modalInfo.type === "will" || becauseResult.modalInfo.type === "would") mf = "ꤕꤢ꤭";
                            else if (becauseResult.modalInfo.type === "may") mf = "ꤢ꤬ꤔꤟꤤꤏꤢꤜꤟꤢꤩ";
                            else if (becauseResult.modalInfo.type === "can" || becauseResult.modalInfo.type === "could") mf = "ꤢ꤬ꤔꤟꤤꤕꤚꤢꤧ";
                            becauseText = (becauseText ? becauseText + " " : "") + mf;
                        } else {
                            for (let bi = 0; bi < becauseTokens.length; bi++) {
                                const bl = becauseTokens[bi].toLowerCase().replace(/[.,;!?]+$/, "");
                                if (bl === "will" || bl === "would") { becauseText = (becauseText ? becauseText + " " : "") + "ꤕꤢ꤭"; break; }
                            }
                        }
                        if (becauseText.length > 0) {
                            result += " " + becauseText;
                        }

                        if (isToBeQuestion) {
                            result += " ꤟꤟꤢꤧ꤭";
                        }

                        result = result.replace(/\s+/g, " ").trim();
                        if (trailingPunct) {
                            if (trailingPunct === "?") result += "?";
                            else if (trailingPunct === "꤯") result += "꤯";
                            else if (trailingPunct === "!") result += "!";
                            else result += trailingPunct;
                        }
                        return result;
                    }

                    // Aren't/Weren't/Isn't/Wasn't SUBJECT … → SUBJECT … ꤒꤥ꤬ꤟꤟꤢꤧ꤭
                    // Aren't you going? → you going ꤒꤥ꤬ꤟꤟꤢꤧ꤭
                    // Isn't she eating food → she eating food ꤒꤥ꤬ꤟꤟꤢꤧ꤭
                    // Mid-sentence "aren't" stays regular ꤒꤥ꤬ (via negativeWords)
                    {
                        const negBeStarts = new Set(["aren't", "weren't", "isn't", "wasn't"]);
                        const t0neg = tokens[0].toLowerCase().replace(/[.,;!?]+$/, "");
                        if (negBeStarts.has(t0neg)) {
                            let remainingTokens = tokens.slice(1);
                            const subjSet = new Set(["i","you","we","they","he","she","it"]);
                            let splitAt = remainingTokens.length;
                            let seenSubj = false;
                            let seenMain = false;
                            for (let i = 0; i < remainingTokens.length; i++) {
                                const tl = remainingTokens[i].toLowerCase().replace(/[.,;!?]+$/, "");
                                if (!seenSubj && subjSet.has(tl)) { seenSubj = true; continue; }
                                if (seenSubj && !seenMain) {
                                    if (isAdjective(remainingTokens[i]) || adjectiveMap.has(tl) || isActionVerb(remainingTokens[i]) || isPastParticiple(remainingTokens[i]) ||
                                        tl.endsWith("ing") || tl === "going" || tl === "sure" || tl === "ready" || tl === "late") {
                                        seenMain = true;
                                        for (let j = i + 1; j < remainingTokens.length; j++) {
                                            const jl = remainingTokens[j].toLowerCase().replace(/[.,;!?]+$/, "");
                                            if (subjSet.has(jl)) { splitAt = i + 1; break; }
                                        }
                                        if (splitAt === remainingTokens.length) {
                                            splitAt = remainingTokens.length;
                                        }
                                        break;
                                    }
                                }
                            }
                            let head = remainingTokens.slice(0, splitAt);
                            let tail = remainingTokens.slice(splitAt);
                            let headRes = translatePhrase(head, true, false, false, hasModalBeforeConjunction, modalType, false, null, null);
                            let finalResult = headRes.text || "";
                            // strip any leaked negation from head (ain't/not/etc.)
                            finalResult = finalResult.split(" ").filter(w => {
                                const b = w.replace(/[.,;!?꤯]+$/, "");
                                return b !== "ꤒꤥ꤬" && b !== "ꤥ꤬ꤒꤥ꤬" && b !== "ꤒꤢꤧ꤭ꤗꤟꤢꤩ";
                            }).join(" ").replace(/\s+/g, " ").trim();
                            finalResult = (finalResult ? finalResult + " " : "") + "ꤒꤥ꤬ꤟꤟꤢꤧ꤭";
                            if (tail.length > 0) {
                                let tailRes = translatePhrase(tail, false, false, false, false, null, false, null, null);
                                let tailText = appendModalFromResult(tailRes.text || "", tailRes, tail);
                                if (tailText) finalResult += " " + tailText;
                            }
                            finalResult = finalResult.replace(/\s+/g, " ").trim();
                            if (trailingPunct) {
                                if (trailingPunct === "?") finalResult += "?";
                                else if (trailingPunct === "꤯") finalResult += "꤯";
                                else if (trailingPunct === "!") finalResult += "!";
                                else finalResult += trailingPunct;
                            }
                            return reorderWhBeforeTimeConj(finalResult);
                        }
                    }

                    // Are you still here → you ꤥ꤬ still-ꤒꤢꤪ꤭ꤕꤢ꤭ here ꤟꤟꤢꤧ꤭
                    // Are they still here for help → they ꤥ꤬ still help for ꤟꤟꤢꤧ꤭
                    {
                        const t0 = tokens[0].toLowerCase().replace(/[.,;!?]+$/, "");
                        if (["are","is","was","were","am"].includes(t0) && tokens.length >= 3) {
                            const hasStill = tokens.some(t => t.toLowerCase().replace(/[.,;!?]+$/, "") === "still");
                            const hasHere = tokens.some(t => {
                                const tl = t.toLowerCase().replace(/[.,;!?]+$/, "");
                                return tl === "here" || tl === "there";
                            });
                            if (hasStill && hasHere) {
                                const subjSet = new Set(["i","you","we","they","he","she","it"]);
                                let subj = null;
                                for (let i = 1; i < tokens.length; i++) {
                                    const tl = tokens[i].toLowerCase().replace(/[.,;!?]+$/, "");
                                    if (subjSet.has(tl)) { subj = tokens[i]; break; }
                                }
                                // for X after here
                                let forIdx = tokens.findIndex(t => t.toLowerCase().replace(/[.,;!?]+$/, "") === "for");
                                let forObjs = [];
                                if (forIdx >= 0) {
                                    for (let j = forIdx + 1; j < tokens.length; j++) {
                                        const tl = tokens[j].toLowerCase().replace(/[.,;!?]+$/, "");
                                        if (!tl) continue;
                                        forObjs.push(tokens[j]);
                                    }
                                }
                                let r = "";
                                if (subj) r += (getWordTranslation(subj) || getSubjectTranslation(subj) || subj);
                                r += (r ? " " : "") + "ꤥ꤬";
                                r += " ꤒꤢꤪ꤭ꤕꤢ꤭";
                                if (forObjs.length > 0) {
                                    // still here for help → still help for here
                                    for (const o of forObjs) {
                                        const ol = o.toLowerCase().replace(/[.,;!?]+$/, "");
                                        if (ol === "a" || ol === "an" || ol === "the") continue;
                                        r += " " + (getWordTranslation(o) || dict.get(ol) || o);
                                    }
                                    r += " ꤢ꤬ꤑꤢꤩ꤭";
                                }
                                for (let i = 1; i < tokens.length; i++) {
                                    const tl = tokens[i].toLowerCase().replace(/[.,;!?]+$/, "");
                                    if (tl === "here" || tl === "there") {
                                        r += " " + (getWordTranslation(tokens[i]) || dict.get(tl) || tokens[i]);
                                    }
                                }
                                r += " ꤟꤟꤢꤧ꤭";
                                r = r.replace(/\s+/g, " ").trim();
                                if (trailingPunct === "?") r += "?";
                                else if (trailingPunct === "꤯") r += "꤯";
                                else if (trailingPunct) r += trailingPunct;
                                return reorderWhBeforeTimeConj(r);
                            }
                        }
                    }

                    if (isToBeQuestion) {
                        // Are/Is/Was/Were/Am SUBJECT …
                        // Progressive (V-ing): you working ꤟꤟꤢꤧ꤭
                        // Noun/adj predicate: you ꤗꤢ꤬ teacher
                        let remainingTokens = tokens.slice(1);
                        const subjSet = new Set(["i","you","we","they","he","she","it"]);
                        let isProgressiveQ = false;
                        for (let i = 0; i < remainingTokens.length; i++) {
                            const tl = remainingTokens[i].toLowerCase().replace(/[.,;!?]+$/, "");
                            if (subjSet.has(tl)) continue;
                            if (tl === "a" || tl === "an" || tl === "the" || tl === "not") continue;
                            if (tl.endsWith("ing") && tl.length > 3) isProgressiveQ = true;
                            break;
                        }
                        let splitAt = remainingTokens.length;
                        let seenSubj = false;
                        let seenMain = false;
                        for (let i = 0; i < remainingTokens.length; i++) {
                            const tl = remainingTokens[i].toLowerCase().replace(/[.,;!?]+$/, "");
                            if (!seenSubj && subjSet.has(tl)) { seenSubj = true; continue; }
                            if (seenSubj && !seenMain) {
                                if (isAdjective(remainingTokens[i]) || adjectiveMap.has(tl) || isActionVerb(remainingTokens[i]) || isPastParticiple(remainingTokens[i]) ||
                                    tl.endsWith("ing") || tl === "going" || tl === "sure" || tl === "ready" || tl === "late" || isNoun(remainingTokens[i])) {
                                    seenMain = true;
                                    for (let j = i + 1; j < remainingTokens.length; j++) {
                                        const jl = remainingTokens[j].toLowerCase().replace(/[.,;!?]+$/, "");
                                        if (subjSet.has(jl)) { splitAt = i + 1; break; }
                                    }
                                    if (splitAt === remainingTokens.length) splitAt = remainingTokens.length;
                                    break;
                                }
                            }
                        }
                        let head = remainingTokens.slice(0, splitAt);
                        let tail = remainingTokens.slice(splitAt);
                        let headRes = translatePhrase(head, true, false, isImperative, hasModalBeforeConjunction, modalType, false, null, null);
                        let finalResult = headRes.text || "";
                        if (isProgressiveQ) {
                            finalResult = (finalResult ? finalResult + " " : "") + "ꤟꤟꤢꤧ꤭";
                        } else {
                            // insert ꤗꤢ꤬ after subject; still end with ꤟꤟꤢꤧ꤭
                            // Are you teacher? → you ꤗꤢ꤬ teacher ꤟꤟꤢꤧ꤭
                            const subjectForms = new Set(["ꤠꤢ꤭", "ꤢꤧ꤬", "ꤕꤟꤢꤧ꤬", "ꤢꤧ꤬ꤞꤤ꤭", "ꤔꤟꤢꤧ꤬"]);
                            const parts = finalResult.split(" ").filter(w => w.length > 0);
                            let rebuilt = [];
                            let inserted = false;
                            for (let pi = 0; pi < parts.length; pi++) {
                                rebuilt.push(parts[pi]);
                                if (!inserted && subjectForms.has(parts[pi])) {
                                    rebuilt.push("ꤗꤢ꤬");
                                    inserted = true;
                                }
                            }
                            if (!inserted) rebuilt.push("ꤗꤢ꤬");
                            finalResult = rebuilt.join(" ");
                            finalResult = (finalResult ? finalResult + " " : "") + "ꤟꤟꤢꤧ꤭";
                        }
                        if (tail.length > 0) {
                            let tailRes = translatePhrase(tail, false, false, false, false, null, false, null, null);
                            let tailText = appendModalFromResult(tailRes.text || "", tailRes, tail);
                            if (tailText) finalResult += " " + tailText;
                        }
                        finalResult = finalResult.replace(/\s+/g, " ").trim();
                        if (trailingPunct) {
                            if (trailingPunct === "?") finalResult += "?";
                            else if (trailingPunct === "꤯") finalResult += "꤯";
                            else if (trailingPunct === "!") finalResult += "!";
                            else finalResult += trailingPunct;
                        }
                        return reorderWhBeforeTimeConj(finalResult);
                    }

                    // Who am/is/are + pronoun (+ V-ing + to)?
                    // Who are you? → ꤔꤟꤢꤧ꤬ ꤗꤢ꤬ ꤗꤢꤨ꤭ꤕꤢꤩ꤭
                    // Who are you talking to? → ꤔꤟꤢꤧ꤬ ꤟꤢꤩꤙꤢꤧ꤬ ꤘꤣ ꤗꤢ꤬ ꤗꤢꤨ꤭ꤕꤢꤩ꤭
                    // Who is she listening to? → ꤢꤧ꤬ ꤔꤟꤤꤘꤢ꤭ ꤘꤣ ꤗꤢ꤬ ꤢꤨ꤭ꤕꤢꤩ꤭
                    {
                        let be = null;
                        let subjTokIdx = -1;
                        const ft = firstToken.replace(/[.,;!?]+$/, "");
                        let restStart = 0;
                        if (ft === "who" && tokens.length >= 3) {
                            be = tokens[1].toLowerCase().replace(/[.,;!?]+$/, "");
                            subjTokIdx = 2;
                            restStart = 3;
                        } else if (/^who\s+(am|is|are|was|were)$/.test(ft) && tokens.length >= 2) {
                            be = ft.split(/\s+/)[1];
                            subjTokIdx = 1;
                            restStart = 2;
                        }
                        if (be && ["am", "is", "are", "was", "were"].includes(be) && subjTokIdx >= 0) {
                            const subj = tokens[subjTokIdx].toLowerCase().replace(/[.,;!?]+$/, "");
                            const subjMap = {
                                "i": "ꤠꤢ꤭",
                                "you": "ꤔꤟꤢꤧ꤬",
                                "he": "ꤢꤧ꤬",
                                "she": "ꤢꤧ꤬",
                                "we": "ꤕꤟꤢꤧ꤬",
                                "they": "ꤢꤧ꤬ꤞꤤ꤭",
                                "it": ""
                            };
                            if (Object.prototype.hasOwnProperty.call(subjMap, subj)) {
                                const whoForm = (subj === "you") ? "ꤗꤢꤨ꤭ꤕꤢꤩ꤭" : "ꤢꤨ꤭ꤕꤢꤩ꤭";
                                // Collect remaining content words (talking to / listening to / …)
                                const restParts = [];
                                for (let ri = restStart; ri < tokens.length; ri++) {
                                    const rl = tokens[ri].toLowerCase().replace(/[.,;!?]+$/, "");
                                    if (!rl) continue;
                                    if (rl === "to") {
                                        restParts.push("ꤘꤣ");
                                        continue;
                                    }
                                    const rt = getWordTranslation(tokens[ri]) || dict.get(rl);
                                    if (rt && rt !== "") restParts.push(rt);
                                    else if (rt !== null && rt !== "") restParts.push(tokens[ri]);
                                }
                                let out = "";
                                if (subjMap[subj]) out += subjMap[subj] + " ";
                                if (restParts.length) out += restParts.join(" ") + " ";
                                out += "ꤗꤢ꤬ " + whoForm;
                                out = out.replace(/\s+/g, " ").trim();
                                if (trailingPunct === "?") out += "?";
                                else if (trailingPunct === "꤯") out += "꤯";
                                else if (trailingPunct === "!") out += "!";
                                else if (trailingPunct) out += trailingPunct;
                                return out;
                            }
                        }
                    }



                    // Fronted: In addition to / as well as / along with / together with / combined with X, MAIN
                    // → MAIN + connective + X
                    // In addition to wanting to go home, I really need to eat dinner
                    // → I need-to eat really dinner in-addition-to wanting-to go-home
                    // Mid-sentence: English order (dict only). No extra phrases.
                    {
                        const addWithMap = {
                            "in addition to": "ꤓꤌꤣ꤭ꤕꤢ꤭ꤔꤢ",
                            "as well as": "ꤓꤌꤣ꤭ꤕꤢ꤭",
                            "along with": "ꤒꤌꤣꤔꤢ",
                            "together with": "ꤚꤟꤥꤔꤢ",
                            "combined with": "ꤤ꤬ꤡꤢꤦ꤭ꤔꤢ"
                        };
                        let addKey = null;
                        let addSkip = 0;
                        const t0a = tokens[0].toLowerCase().replace(/[.,;!?]+$/, "");
                        if (addWithMap[t0a]) {
                            addKey = t0a;
                            addSkip = 1;
                        } else {
                            for (const n of [3, 2]) {
                                if (tokens.length >= n) {
                                    const ph = tokens.slice(0, n).map(t => t.toLowerCase().replace(/[.,;!?]+$/, "")).join(" ");
                                    if (addWithMap[ph]) {
                                        addKey = ph;
                                        addSkip = n;
                                        break;
                                    }
                                }
                            }
                        }
                        if (addKey && addSkip > 0 && tokens.length > addSkip) {
                            // Prefer cleanSentence comma split for accuracy
                            let subTokens = null;
                            let mainText = null;
                            if (typeof cleanSentence === "string" && cleanSentence.indexOf(",") >= 0) {
                                const parts = cleanSentence.split(",");
                                const left = (parts[0] || "").trim();
                                const right = parts.slice(1).join(",").trim();
                                // left starts with connective words
                                const leftToks = tokenizeEnglish(left);
                                // drop the connective from left → sub clause
                                if (leftToks.length > addSkip) {
                                    subTokens = leftToks.slice(addSkip);
                                } else {
                                    subTokens = [];
                                }
                                mainText = right;
                            } else {
                                // fallback: token comma
                                let after = tokens.slice(addSkip);
                                let commaIdx = -1;
                                for (let i = 0; i < after.length; i++) {
                                    if (/,$/.test(after[i]) || after[i] === ",") {
                                        commaIdx = i;
                                        break;
                                    }
                                }
                                if (commaIdx >= 0) {
                                    subTokens = after.slice(0, commaIdx + 1).map(t => t.replace(/,$/, "")).filter(t => t.length > 0);
                                    mainText = after.slice(commaIdx + 1).join(" ").replace(/\s+/g, " ").trim();
                                }
                            }
                            if (subTokens !== null && mainText !== null && mainText.length > 0) {
                                let mainOut = translateToKayah(mainText);
                                let subRes = translatePhrase(subTokens, false, false, false, false, null, false, null, null);
                                let subText = (subRes.text || "").replace(/\s+/g, " ").trim();
                                if (subRes.modalInfo) {
                                    let mf = subRes.modalInfo.translation;
                                    if (subRes.modalInfo.type === "will" || subRes.modalInfo.type === "would") mf = "ꤕꤢ꤭";
                                    else if (subRes.modalInfo.type === "may") mf = "ꤢ꤬ꤔꤟꤤꤏꤢꤜꤟꤢꤩ";
                                    else if (subRes.modalInfo.type === "can" || subRes.modalInfo.type === "could") mf = "ꤢ꤬ꤔꤟꤤꤕꤚꤢꤧ";
                                    subText = (subText ? subText + " " : "") + mf;
                                }
                                let conj = addWithMap[addKey];
                                let result = mainOut || "";
                                result = (result ? result + " " : "") + conj;
                                if (subText) result += " " + subText;
                                result = result.replace(/\s+/g, " ").trim();
                                // collapse accidental double really
                                const rf = "ꤔꤟꤤꤔꤛꤢ꤬";
                                result = result.replace(new RegExp(rf + "\\s+" + rf, "g"), rf);
                                if (trailingPunct) {
                                    if (trailingPunct === "?") result += "?";
                                    else if (trailingPunct === "꤯") result += "꤯";
                                    else if (trailingPunct === "!") result += "!";
                                    else if (trailingPunct !== ",") result += trailingPunct;
                                }
                                return result;
                            }
                        }
                    }

                    // Month "May" alone or with a date → ꤗꤟꤢꤩ꤬ꤜꤢꤧ꤭
                    // e.g. May | May 30 | May 30, 2026
                    {
                        const t0m = tokens[0].toLowerCase().replace(/[.,;!?]+$/, "");
                        if (t0m === "may") {
                            const isModalMay = tokens.length >= 2 && (() => {
                                const t1 = tokens[1].toLowerCase().replace(/[.,;!?]+$/, "");
                                // May I/you/he… or subject may verb → modal
                                if (["i","you","we","they","he","she","it"].includes(t1)) return true;
                                // bare "may" + verb (rare) still modal if second is action
                                if (isActionVerb(tokens[1]) || ["go","come","do","see","eat","leave","stay"].includes(t1)) return true;
                                return false;
                            })();
                            const restIsDate = tokens.length >= 2 && (() => {
                                // any token looks like a number/year/day
                                for (let k = 1; k < tokens.length; k++) {
                                    const tk = tokens[k].replace(/[.,;!?]+$/, "");
                                    if (/^\d/.test(tk) || /^(19|20)\d{2}$/.test(tk)) return true;
                                }
                                return false;
                            })();
                            if (tokens.length === 1 || restIsDate) {
                                // Month May (+ date digits kept as-is)
                                let out = "ꤗꤟꤢꤩ꤬ꤜꤢꤧ꤭";
                                for (let k = 1; k < tokens.length; k++) {
                                    out += " " + tokens[k];
                                }
                                out = out.replace(/\s+/g, " ").trim();
                                if (trailingPunct) {
                                    if (trailingPunct === "?") out += "?";
                                    else if (trailingPunct === "꤯") out += "꤯";
                                    else if (trailingPunct === "!") out += "!";
                                    else out += trailingPunct;
                                }
                                return out;
                            }
                            // else fall through as modal may
                        }
                    }

                    // Where is/are/am/was/were SUBJECT (V-ing)? — even without "?"
                    // Where is she → she where is
                    // Where is she going → she going where is
                    {
                        const whereBeMap = {
                            "where is": "ꤥ꤬ꤙꤤꤒꤢꤩ꤭",
                            "where are": "ꤥ꤬ꤙꤤꤒꤢꤩ꤭",
                            "where am": "ꤥ꤬ꤙꤤꤒꤢꤩ꤭",
                            "where was": "ꤥ꤬ꤙꤤꤒꤢꤩ꤭",
                            "where were": "ꤥ꤬ꤙꤤꤒꤢꤩ꤭"
                        };
                        let whereBeForm = null;
                        let restAfterWhereBe = null;
                        const t0w = tokens[0].toLowerCase().replace(/[.,;!?]+$/, "");
                        if (whereBeMap[t0w]) {
                            whereBeForm = whereBeMap[t0w];
                            restAfterWhereBe = tokens.slice(1);
                        } else if (t0w === "where" && tokens.length >= 2) {
                            const t1w = tokens[1].toLowerCase().replace(/[.,;!?]+$/, "");
                            const two = "where " + t1w;
                            if (whereBeMap[two]) {
                                whereBeForm = whereBeMap[two];
                                restAfterWhereBe = tokens.slice(2);
                            }
                        }
                        if (whereBeForm && restAfterWhereBe && restAfterWhereBe.length > 0) {
                            const restRes = translatePhrase(restAfterWhereBe, false, false, false, false, null, false, null, null);
                            let body = (restRes.text || "").replace(/\s+/g, " ").trim();
                            body = body.split(" ").filter(w => {
                                const b = w.replace(/[.,;!?꤯]+$/, "");
                                return b !== whereBeForm && b !== "ꤥ꤬";
                            }).join(" ").replace(/\s+/g, " ").trim();
                            let out = body ? (body + " " + whereBeForm) : whereBeForm;
                            out = out.replace(/\s+/g, " ").trim();
                            if (trailingPunct) {
                                if (trailingPunct === "?") out += "?";
                                else if (trailingPunct === "꤯") out += "꤯";
                                else if (trailingPunct === "!") out += "!";
                                else out += trailingPunct;
                            }
                            return out;
                        }
                    }

                    if (isWhQuestion) {
                        let questionTranslation = null;
                        let remainingTokens = [];

                        if (isWillStart || isCanStart || isCouldStart || isMayStart) {
                            remainingTokens = tokens.slice(1);
                            if (isWillStart) {
                                questionTranslation = "ꤕꤢ꤭ꤟꤟꤢꤧ꤭";
                            } else if (isMayStart) {
                                questionTranslation = "ꤢ꤬ꤔꤟꤤꤏꤢꤜꤟꤢꤩꤟꤟꤢꤧ꤭";
                            } else {
                                questionTranslation = "ꤢ꤬ꤔꤟꤤꤕꤚꤢꤧꤟꤟꤢꤧ꤭";
                            }
                        } else if (isShouldStart) {
                            // tokens already inverted to SUBJECT should …
                            remainingTokens = tokens.slice(); // full inverted sentence
                            questionTranslation = "ꤟꤟꤢꤧ꤭";
                        } else if (isDoStart && doFollowedBySubject) {
                            questionTranslation = "ꤟꤟꤢꤧ꤭";
                            remainingTokens = tokens.slice(1);
                        } else if (isDoStart) {
                            // imperative Do … (Do as I do)
                            questionTranslation = null;
                            remainingTokens = tokens; // keep Do
                        } else {
                            let matched = false;
                            for (let n = 4; n >= 1; n--) {
                                if (tokens.length >= n) {
                                    const phrase = tokens.slice(0, n).join(" ").toLowerCase();
                                    if (whQuestionKeys.has(phrase)) {
                                        const trans = dict.get(phrase);
                                        if (trans) {
                                            questionTranslation = trans;
                                        } else {
                                            const parts = phrase.split(" ");
                                            let transParts = [];
                                            for (const p of parts) {
                                                transParts.push(getTranslation(p));
                                            }
                                            questionTranslation = transParts.join(" ");
                                        }
                                        remainingTokens = tokens.slice(n);
                                        matched = true;
                                        break;
                                    }
                                }
                            }
                            if (!matched) {
                                // Sentence-initial "who" question form (not relative ꤕꤚꤟꤢꤧ꤬ꤘꤣ)
                                if (firstToken === "who") {
                                    questionTranslation = "ꤢꤨ꤭ꤕꤢꤩ꤭";
                                } else {
                                    questionTranslation = getTranslation(firstToken);
                                }
                                remainingTokens = tokens.slice(1);
                            }
                        }
                        // Override: sentence-initial who → question form
                        // Who let you do it → ꤢꤨ꤭ꤕꤢꤩ꤭ let do you ꤕꤢꤩ꤭
                        // (Who form at START, ꤕꤢꤩ꤭ at END for bare who + let)
                        let bareWhoFront = null;
                        let bareWhoExtra = null;
                        if (firstToken === "who") {
                            const second = tokens.length > 1 ? tokens[1].toLowerCase().replace(/[.,;!?]+$/, "") : "";
                            // Sentence-initial interrogative who → ꤢꤨ꤭ꤕꤢꤩ꤭ … ꤕꤢꤩ꤭
                            // Who want to do / Who did this / Who ask …
                            if (!["is","was","are","were","am"].includes(second)) {
                                bareWhoFront = "ꤢꤨ꤭ꤕꤢꤩ꤭";
                                bareWhoExtra = "ꤕꤢꤩ꤭";
                                questionTranslation = null;
                            }
                        }

                        let finalResult = "";
                        if (isDoStart && questionTranslation === "ꤟꤟꤢꤧ꤭") {
                            // Do/Does/Did SUBJECT VERB … → SUBJECT VERB OBJ … ꤟꤟꤢꤧ꤭ (marker at very end)
                            let headRes = translatePhrase(remainingTokens, true, isHaveStart, isImperative, hasModalBeforeConjunction, modalType, false, null, null);
                            finalResult = (headRes.text || "").trim();
                            finalResult = (finalResult ? finalResult + " " : "") + "ꤟꤟꤢꤧ꤭";
                        } else {
                            let result = translatePhrase(remainingTokens, true, isHaveStart, isImperative, hasModalBeforeConjunction, modalType, false, null, null);
                            finalResult = result.text || "";
                            if (bareWhoFront) {
                                finalResult = bareWhoFront + (finalResult ? " " + finalResult : "");
                            } else if (finalResult.length > 0 && questionTranslation) {
                                finalResult += " " + questionTranslation;
                            } else if (questionTranslation) {
                                finalResult = questionTranslation;
                            }
                            if (bareWhoExtra) {
                                finalResult = (finalResult ? finalResult + " " : "") + bareWhoExtra;
                            }
                        }
                        finalResult = (finalResult || "").replace(/\s+/g, " ").trim();

                        if (trailingPunct) {
                            if (trailingPunct === "?") finalResult += "?";
                            else if (trailingPunct === "꤯") finalResult += "꤯";
                            else if (trailingPunct === "!") finalResult += "!";
                            else finalResult += trailingPunct;
                        }
                        return reorderWhBeforeTimeConj(finalResult);
                    }

                    let result = translatePhrase(tokens, false, isHaveStart, isImperative, hasModalBeforeConjunction, modalType, false, null, null);
                    let finalResult = result.text;

                    if (result.modalInfo) {
                        // Full form only when modal starts the sentence
                        let modalForm = result.modalInfo.translation;
                        if (result.modalInfo.type === "will" || result.modalInfo.type === "would") {
                            modalForm = isWillStart ? "ꤕꤢ꤭ꤟꤟꤢꤧ꤭" : "ꤕꤢ꤭";
                        } else if (result.modalInfo.type === "can" || result.modalInfo.type === "could" || result.modalInfo.type === "may") {
                            modalForm = result.modalInfo.type === "may"
                                ? (isMayStart ? "ꤢ꤬ꤔꤟꤤꤏꤢꤜꤟꤢꤩꤟꤟꤢꤧ꤭" : "ꤢ꤬ꤔꤟꤤꤏꤢꤜꤟꤢꤩ")
                                : (isCanStart || isCouldStart) ? "ꤢ꤬ꤔꤟꤤꤕꤚꤢꤧꤟꤟꤢꤧ꤭" : "ꤢ꤬ꤔꤟꤤꤕꤚꤢꤧ";
                        }
                        // will/can/should before infinitive "to" (ꤊꤟꤢꤦ)
                        // e.g. I will see … to prove → … ꤕꤢ꤭ ꤊꤟꤢꤦ prove …
                        const infTo = "ꤊꤟꤢꤦ";
                        if (modalForm && finalResult.includes(infTo)) {
                            const parts = finalResult.split(" ").filter(w => w.length > 0);
                            let newParts = [];
                            let inserted = false;
                            for (let i = 0; i < parts.length; i++) {
                                if (!inserted && parts[i] === infTo) {
                                    newParts.push(modalForm);
                                    inserted = true;
                                }
                                newParts.push(parts[i]);
                            }
                            if (!inserted) newParts.push(modalForm);
                            finalResult = newParts.join(" ");
                        } else {
                            finalResult += " " + modalForm;
                        }
                    }

                    if (endsWithQuestion) {
                        finalResult = attachConfirmQuestionMarker(finalResult, true, firstToken);
                    }
                    if (trailingPunct) {
                        if (trailingPunct === "?") finalResult += "?";
                        else if (trailingPunct === "꤯") finalResult += "꤯";
                        else if (trailingPunct === "!") finalResult += "!";
                        else finalResult += trailingPunct;
                    }
                    return reorderWhBeforeTimeConj(finalResult);
                });

                // Post-pass: confirmation questions on any early-return path too
                const withConfirm = translatedSentences.map(function (s, idx) {
                    const orig = (rawSentences[idx] || "").trim();
                    if (!orig.endsWith("?")) return s;
                    const cleaned = orig.slice(0, -1).trim();
                    const toks = tokenizeEnglish(cleaned);
                    const ft = toks.length ? toks[0].toLowerCase().replace(/[.,;!?]+$/, "") : "";
                    let body = (s || "").replace(/\s*[?？]+\s*$/, "").trim();
                    body = attachConfirmQuestionMarker(body, true, ft);
                    if (!body.endsWith("?")) body += "?";
                    return body;
                });

                return dedupeWillAfterNever(withConfirm.join(" "));
            }

            // --------------------------------------------------------------
            //  Translate Kayah Li → English
            // --------------------------------------------------------------
            function translateToEnglish(text) {
                if (!text.trim()) return "";
                let normalized = text.replace(/꤯/g, ".");
                const tokens = normalized.split(/\s+/).filter(w => w.length > 0);
                const englishParts = tokens.map(token => {
                    let punct = "";
                    const match = token.match(/[.,;!?]+$/);
                    if (match) {
                        punct = match[0];
                        token = token.slice(0, -match[0].length);
                    }
                    let eng = reverseDict.get(token);
                    if (!eng) {
                        eng = token;
                    }
                    return eng + punct;
                });
                return englishParts.join(" ");
            }

            // --------------------------------------------------------------
            //  UI logic
            // --------------------------------------------------------------
            const inputEl = document.getElementById("inputText");
            const outputEl = document.getElementById("outputText");
            const copyEnglishBtn = document.getElementById("copyEnglishBtn");
            const clearEnglishBtn = document.getElementById("clearEnglishBtn");
            const copyKayahBtn = document.getElementById("copyKayahBtn");

            function flashCopied(btn) {
                if (!btn) return;
                btn.classList.add("copied");
                const prev = btn.textContent;
                btn.textContent = "✓";
                setTimeout(function () {
                    btn.classList.remove("copied");
                    btn.textContent = prev;
                }, 900);
            }

            async function copyText(value, btn, selectEl) {
                const textVal = (value || "");
                if (!textVal.trim()) return;
                try {
                    // Select / highlight text in the source box
                    if (selectEl) {
                        if (selectEl.tagName === "TEXTAREA" || selectEl.tagName === "INPUT") {
                            selectEl.focus();
                            selectEl.select();
                        } else {
                            const range = document.createRange();
                            range.selectNodeContents(selectEl);
                            const sel = window.getSelection();
                            sel.removeAllRanges();
                            sel.addRange(range);
                        }
                    }
                    if (navigator.clipboard && navigator.clipboard.writeText) {
                        await navigator.clipboard.writeText(textVal);
                    } else {
                        const ta = document.createElement("textarea");
                        ta.value = textVal;
                        ta.style.position = "fixed";
                        ta.style.left = "-9999px";
                        document.body.appendChild(ta);
                        ta.select();
                        document.execCommand("copy");
                        document.body.removeChild(ta);
                    }
                    flashCopied(btn);
                } catch (e) {
                    // Fallback: still try select + execCommand on a temp field
                    try {
                        const ta = document.createElement("textarea");
                        ta.value = textVal;
                        ta.style.position = "fixed";
                        ta.style.left = "-9999px";
                        document.body.appendChild(ta);
                        ta.focus();
                        ta.select();
                        document.execCommand("copy");
                        document.body.removeChild(ta);
                        flashCopied(btn);
                    } catch (e2) {
                        console.warn("Copy failed", e2);
                    }
                }
            }

            function updateClearButtonVisibility() {
                if (!clearEnglishBtn) return;
                if (inputEl.value && inputEl.value.length > 0) {
                    clearEnglishBtn.hidden = false;
                    clearEnglishBtn.removeAttribute("hidden");
                } else {
                    clearEnglishBtn.hidden = true;
                    clearEnglishBtn.setAttribute("hidden", "");
                }
            }

            if (copyEnglishBtn) {
                copyEnglishBtn.addEventListener("click", function () {
                    copyText(inputEl.value, copyEnglishBtn, inputEl);
                });
            }
            if (clearEnglishBtn) {
                clearEnglishBtn.addEventListener("click", function () {
                    inputEl.value = "";
                    updateTranslation();
                    updateClearButtonVisibility();
                    inputEl.focus();
                });
            }
            if (copyKayahBtn) {
                copyKayahBtn.addEventListener("click", function () {
                    copyText(outputEl.textContent || "", copyKayahBtn, outputEl);
                });
            }
            let currentDirection = "en2kayah";

            function updateTranslation() {
                const raw = inputEl.value;
                let result = "";
                if (currentDirection === "en2kayah") {
                    result = translateToKayah(raw);
                } else {
                    result = translateToEnglish(raw);
                }
                outputEl.textContent = result || " ";
            }

            inputEl.addEventListener("input", function () {
                updateTranslation();
                updateClearButtonVisibility();
            });

            currentDirection = "en2kayah";
            inputEl.placeholder = "Type English …";
            window.addEventListener("load", function() {
                updateTranslation();
            });

            window.translator = { translateToKayah, translateToEnglish };
        })();
    </script>
    </div>
</body>
</html>

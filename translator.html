        * {
            box-sizing: border-box;
            margin: 0;

        }
        body {
            background: #FFC0CB;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1.5rem;
        }
        .card {
            max-width: 960px;
            width: 100%;
            background: white;
            padding: 2.2rem 2rem;
            border-radius: 40px;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.08);
            border: 1px solid #f0f0f0;
        }
        .grid {
            display: flex;
            flex-direction: column;
            gap: 1.8rem;
        }
        .pair {
            display: flex;
            flex-wrap: wrap;
            gap: 1.2rem;
        }
        .pair > div {
            flex: 1 1 220px;
            min-width: 180px;
        }
        textarea,
        .output-box {
            width: 100%;
            padding: 1rem 1.2rem;
            font-size: 1.2rem;
            border-radius: 28px;
            border: 1px solid #e0e0e0;
            background: white;
            box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.02);
            transition: 0.15s;
            line-height: 1.6;
            min-height: 120px;
            resize: vertical;
        }
        textarea:focus {
            outline: 2px solid #b0b0b0;
            border-color: transparent;
            background: #ffffff;
        }
        .output-box {
            background: #fafafa;
            color: #1f1a14;
            white-space: pre-wrap;
            word-break: break-word;
            border: 1px solid #e0e0e0;
            overflow-y: auto;
        }
        @media (max-width: 500px) {
            .card {
                padding: 1.5rem;
            }
        }
    </style>
</head>

                                const two = (tokens[i] + " " + tokens[i + 1]).toLowerCase().replace(/[.,;!?]+$/g, "");
                                if (two === "not only") {
                                    notOnlyIndex = i;
                                    notOnlySkip = 2;
                                }
                                if (two === "but also") {
                                    butAlsoIndex = i;
                                    butAlsoSkip = 2;
                                }
                            }
                        }

                        if (notOnlyIndex >= 0 && butAlsoIndex > notOnlyIndex) {
                            // Parts: before "not only" | between "not only" and "but also" | after "but also"
                            const before = tokens.slice(0, notOnlyIndex);
                            const middle = tokens.slice(notOnlyIndex + notOnlySkip, butAlsoIndex);
                            const after = tokens.slice(butAlsoIndex + butAlsoSkip);

                            let beforeResult = translatePhrase(before, false, false, false);
                            let middleResult = translatePhrase(middle, false, false, false);
                            let afterResult = translatePhrase(after, false, false, false);

                            // Desired order: [before] [middle] ꤒꤢꤦꤗꤟꤢꤒꤥ꤬ [after] ꤕꤢ꤭ꤕꤢ꤭
                            // so that ꤕꤢ꤭ꤕꤢ꤭ appears at the very end after the second element
                            let result = "";
                            if (beforeResult.text) result += beforeResult.text + " ";
                            if (middleResult.text) result += middleResult.text + " ";
                            result += "ꤒꤢꤦꤗꤟꤢꤒꤥ꤬ ";
                            if (afterResult.text) result += afterResult.text + " ";
                            result += "ꤕꤢ꤭ꤕꤢ꤭";

                            result = result.replace(/\s+/g, " ").trim();
                            if (trailingPunct) {
                                if (trailingPunct === "?") result += "?";
                                else if (trailingPunct === "꤯") result += "꤯";
                                else if (trailingPunct === "!") result += "!";
                                else result += trailingPunct;
                            }
                            return result;
                        }
                    }

                    let timeConjIndex = -1;
                    let timeConjType = null;
                    let timeConjSkip = 1; // number of tokens the primary conjunction occupies

                    // Detect primary time conjunctions (supports multi-word)
                    for (let i = 0; i < tokens.length; i++) {
                        // Try 3-word first
                        if (i + 2 < tokens.length) {
                            const threeWord = (tokens[i] + " " + tokens[i + 1] + " " + tokens[i + 2]).toLowerCase().replace(/[.,;!?]+$/g, "");
                            if (timeConjunctions.has(threeWord)) {
                                timeConjIndex = i;
                                timeConjType = threeWord;
                                timeConjSkip = 3;
                                break;
                            }
                        }
                        // Try 2-word
                        if (i + 1 < tokens.length) {
                            const twoWord = (tokens[i] + " " + tokens[i + 1]).toLowerCase().replace(/[.,;!?]+$/g, "");
                            if (timeConjunctions.has(twoWord)) {
                                timeConjIndex = i;
                                timeConjType = twoWord;
                                timeConjSkip = 2;
                                break;
                            }
                        }
                        // Single word
                        const lower = tokens[i].toLowerCase().replace(/[.,;!?]+$/, "");
                        if (timeConjunctions.has(lower)) {
                            timeConjIndex = i;
                            timeConjType = lower;
                            timeConjSkip = 1;
                            break;
                        }
                    }

                    // Handle time conjunctions
                    if (timeConjIndex >= 0 && timeConjIndex < tokens.length - 1) {
                        let mainTokens = [];
                        let timeTokens = [];
                        for (let i = 0; i < timeConjIndex; i++) {
                            mainTokens.push(tokens[i]);
                        }
                        for (let i = timeConjIndex + timeConjSkip; i < tokens.length; i++) {
                            timeTokens.push(tokens[i]);
                        }

                        let mainResult = translatePhrase(mainTokens, endsWithQuestion || isToBeQuestion || isWhQuestion, isHaveStart, isImperative);

                        // Secondary conjunctions that should appear AFTER the primary "when" marker
                        // (ꤢ꤬ꤋꤢꤧ꤭ must show before all of these)
                        const secondaryConjunctions = {
                            "because": "ꤗꤟꤢꤩ꤬ꤒꤢꤩ꤭ꤚꤢꤪ",
                            "and": "ꤓꤌꤣ꤭ꤕꤢ꤭",
                            "nor": "ꤒꤥ꤬ꤒꤥ꤬",
                            "but": "ꤗꤢ꤬ꤔꤢ",
                            "or": "ꤒꤥ꤬ꤗꤢ꤬",
                            "yet": "ꤟꤤ",
                            "so": "ꤚꤢꤪ",
                            "either": "ꤒꤣ꤬ꤊꤟꤊꤣ꤬ꤊꤟꤊꤣ꤬",
                            "neither": "ꤜꤟꤢꤪ꤭ꤟꤤ꤭ꤥ꤬",
                            "both": "ꤜꤟꤢꤪ꤭ꤜꤟꤢꤪ꤭",
                            "since": "ꤔꤌꤣ꤬ꤕꤢ꤭",
                            "while": "ꤢ꤬ꤋꤢꤧ꤭",
                            "before": "ꤟꤤꤒꤥ꤬ꤢ꤬ꤋꤢꤧ꤭",
                            "after": "ꤋꤛꤢꤩ꤭",
                            "if": "ꤊꤤ꤬",
                            "not only": "ꤒꤢꤦꤗꤟꤢꤒꤥ꤬",
                            "but also": "ꤕꤢ꤭ꤕꤢ꤭",
                            "as soon as": "ꤙꤤꤋꤢꤧ꤭ꤒꤢꤩ꤭ꤔꤌꤣ꤬",
                            "although": "ꤒꤢ꤬ꤘꤣ꤬",
                            "whether": "ꤒꤣ꤬ꤊꤟꤊꤣ꤬ꤊꤟꤊꤣ꤬",
                            "once": "ꤒꤣ꤬ꤖꤟꤌꤣꤒꤌꤣ꤭",
                            "inasmuch as": "ꤢ꤬ꤗꤟꤢꤩ꤬ꤒꤢꤩ꤭ꤔꤌꤣ꤬"
                        };

                        let secondaryIndex = -1;
                        let secondaryType = null;
                        let secondarySkip = 1; // how many tokens the secondary conjunction occupies

                        // First try multi-word secondary conjunctions
                        for (let i = 0; i < timeTokens.length; i++) {
                            // Check 2-word phrases
                            if (i + 1 < timeTokens.length) {
                                const twoWord = (timeTokens[i] + " " + timeTokens[i + 1]).toLowerCase().replace(/[.,;!?]+$/g, "");
                                if (secondaryConjunctions.hasOwnProperty(twoWord)) {
                                    secondaryIndex = i;
                                    secondaryType = twoWord;
                                    secondarySkip = 2;
                                    break;
                                }
                            }
                        }

                        // Then single-word if no multi-word found
                        if (secondaryIndex === -1) {
                            for (let i = 0; i < timeTokens.length; i++) {
                                const lower = timeTokens[i].toLowerCase().replace(/[.,;!?]+$/, "");
                                if (secondaryConjunctions.hasOwnProperty(lower)) {
                                    secondaryIndex = i;
                                    secondaryType = lower;
                                    secondarySkip = 1;
                                    break;
                                }
                            }
                        }

                        let timeTranslation = timeConjunctions.get(timeConjType);
                        // Replace WHEN_PLACEHOLDER with the correct translation for "when"
                        if (timeTranslation === "WHEN_PLACEHOLDER") {
                            timeTranslation = "ꤢ꤬ꤋꤢꤧ꤭";
                        }

                        let result = mainResult.text;

                        if (secondaryIndex >= 0) {
                            // Split timeTokens around the secondary conjunction
                            // so that ꤢ꤬ꤋꤢꤧ꤭ appears BEFORE the secondary conjunction marker
                            let beforeSecondary = timeTokens.slice(0, secondaryIndex);
                            let afterSecondary = timeTokens.slice(secondaryIndex + secondarySkip);

                            let beforeResult = translatePhrase(beforeSecondary, false, false, false);
                            let afterResult = translatePhrase(afterSecondary, false, false, false);

                            if (beforeResult.text.length > 0) {
                                result += " " + beforeResult.text;
                            }
                            // Place primary "when" marker BEFORE the secondary conjunction
                            result += " " + timeTranslation;
                            result += " " + secondaryConjunctions[secondaryType];
                            if (afterResult.text.length > 0) {
                                result += " " + afterResult.text;
                            }
                        } else {
                            // Normal case: no secondary conjunction inside the time clause
                            let timeResult = translatePhrase(timeTokens, false, false, false);
                            if (timeResult.text.length > 0) {
                                result += " " + timeResult.text;
                            }
                            result += " " + timeTranslation;
                        }

                        if (mainResult.modalInfo) {
                            if (isWillStart || endsWithQuestion) {
                                if (mainResult.modalInfo.type === "will") {
                                    result += " ꤕꤢ꤭ꤟꤟꤢꤧ꤭";
                                } else {
                                    result += " ꤢ꤬ꤔꤟꤤꤕꤚꤢꤧꤟꤟꤢꤧ꤭";
                                }
                            } else {
                                if (mainResult.modalInfo.type === "will") {
                                    result += " ꤕꤢ꤭";
                                } else {
                                    result += " ꤢ꤬ꤔꤟꤤꤕꤚꤢꤧ";
                                }
                            }
                        }

                        if (isToBeQuestion) {
                            result += " ꤥ꤬ꤟꤟꤢꤧ꤭";
                        }

                        result = result.replace(/\s+/g, " ").trim();
                        if (trailingPunct) {
                            if (trailingPunct === "?") result += "?";
                            else if (trailingPunct === "꤯") result += "꤯";
                            else if (trailingPunct === "!") result += "!";
                            else result += trailingPunct;
                        }
                        return result;
                    }

                    // Handle "if"
                    let hasIf = false;
                    let ifIndex = -1;
                    for (let i = 0; i < tokens.length; i++) {
                        if (tokens[i].toLowerCase() === "if") {
                            hasIf = true;
                            ifIndex = i;
                            break;
                        }
                    }

                    if (hasIf && ifIndex >= 0) {
                        let mainTokens = [];
                        let ifTokens = [];
                        for (let i = 0; i < ifIndex; i++) {
                            mainTokens.push(tokens[i]);
                        }
                        for (let i = ifIndex + 1; i < tokens.length; i++) {
                            ifTokens.push(tokens[i]);
                        }

                        let mainResult = translatePhrase(mainTokens, endsWithQuestion || isToBeQuestion || isWhQuestion, isHaveStart, isImperative);
                        let ifResult = translatePhrase(ifTokens, false, false, false);

                        let result = mainResult.text;
                        if (result.length > 0) {
                            result += " ꤊꤤ꤬";
                        } else {
                            result = "ꤊꤤ꤬";
                        }
                        if (ifResult.text.length > 0) {
                            result += " " + ifResult.text;
                        }

                        if (mainResult.modalInfo) {
                            if (isWillStart || endsWithQuestion) {
                                if (mainResult.modalInfo.type === "will") {
                                    result += " ꤕꤢ꤭ꤟꤟꤢꤧ꤭";
                                } else {
                                    result += " ꤢ꤬ꤔꤟꤤꤕꤚꤢꤧꤟꤟꤢꤧ꤭";
                                }
                            } else {
                                if (mainResult.modalInfo.type === "will") {
                                    result += " ꤕꤢ꤭";
                                } else {
                                    result += " ꤢ꤬ꤔꤟꤤꤕꤚꤢꤧ";
                                }
                            }
                        }

                        if (isToBeQuestion) {
                            result += " ꤥ꤬ꤟꤟꤢꤧ꤭";
                        }

                        result = result.replace(/\s+/g, " ").trim();
                        if (trailingPunct) {
                            if (trailingPunct === "?") result += "?";
                            else if (trailingPunct === "꤯") result += "꤯";
                            else if (trailingPunct === "!") result += "!";
                            else result += trailingPunct;
                        }
                        return result;
                    }

                    // Handle "because"
                    let hasBecause = false;
                    let becauseIndex = -1;
                    for (let i = 0; i < tokens.length; i++) {
                        if (tokens[i].toLowerCase() === "because") {
                            hasBecause = true;
                            becauseIndex = i;
                            break;
                        }
                    }

                    if (hasBecause && becauseIndex >= 0) {
                        let mainTokens = [];
                        let becauseTokens = [];
                        for (let i = 0; i < becauseIndex; i++) {
                            mainTokens.push(tokens[i]);
                        }
                        for (let i = becauseIndex + 1; i < tokens.length; i++) {
                            becauseTokens.push(tokens[i]);
                        }

                        let mainResult = translatePhrase(mainTokens, endsWithQuestion || isToBeQuestion || isWhQuestion, isHaveStart, isImperative);
                        let becauseResult = translatePhrase(becauseTokens, false, false, false);

                        let result = mainResult.text;
                        if (result.length > 0) {
                            result += " " + "ꤗꤟꤢꤩ꤬ꤒꤢꤩ꤭ꤚꤢꤪ";
                        } else {
                            result = "ꤗꤟꤢꤩ꤬ꤒꤢꤩ꤭ꤚꤢꤪ";
                        }
                        if (becauseResult.text.length > 0) {
                            result += " " + becauseResult.text;
                        }

                        if (mainResult.modalInfo) {
                            if (isWillStart || endsWithQuestion) {
                                if (mainResult.modalInfo.type === "will") {
                                    result += " ꤕꤢ꤭ꤟꤟꤢꤧ꤭";
                                } else {
                                    result += " ꤢ꤬ꤔꤟꤤꤕꤚꤢꤧꤟꤟꤢꤧ꤭";
                                }
                            } else {
                                if (mainResult.modalInfo.type === "will") {
                                    result += " ꤕꤢ꤭";
                                } else {
                                    result += " ꤢ꤬ꤔꤟꤤꤕꤚꤢꤧ";
                                }
                            }
                        }

                        if (isToBeQuestion) {
                            result += " ꤥ꤬ꤟꤟꤢꤧ꤭";
                        }

                        result = result.replace(/\s+/g, " ").trim();
                        if (trailingPunct) {
                            if (trailingPunct === "?") result += "?";
                            else if (trailingPunct === "꤯") result += "꤯";
                            else if (trailingPunct === "!") result += "!";
                            else result += trailingPunct;
                        }
                        return result;
                    }

                    // Handle "to be" questions
                    if (isToBeQuestion) {
                        let remainingTokens = tokens.slice(1);
                        let result = translatePhrase(remainingTokens, true, false, isImperative);
                        let finalResult = result.text;

                        finalResult += " ꤥ꤬ꤟꤟꤢꤧ꤭";

                        if (trailingPunct) {
                            if (trailingPunct === "?") finalResult += "?";
                            else if (trailingPunct === "꤯") finalResult += "꤯";
                            else if (trailingPunct === "!") finalResult += "!";
                            else finalResult += trailingPunct;
                        }
                        return finalResult;
                    }

                    // Handle WH-questions
                    if (isWhQuestion) {
                        let questionTranslation = null;
                        let remainingTokens = [];

                        if (isWillStart || isCanStart || isCouldStart || isMayStart) {
                            remainingTokens = tokens.slice(1);
                            if (isWillStart) {
                                questionTranslation = "ꤕꤢ꤭ꤟꤟꤢꤧ꤭";
                            } else {
                                questionTranslation = "ꤢ꤬ꤔꤟꤤꤕꤚꤢꤧꤟꤟꤢꤧ꤭";
                            }
                        } else if (isShouldStart) {
                            questionTranslation = "ꤒꤥ꤭ꤊꤢꤪ꤬ꤟꤟꤢꤧ꤭";
                            remainingTokens = tokens.slice(1);
                        } else if (isDoStart) {
                            questionTranslation = "ꤟꤟꤢꤧ꤭";
                            remainingTokens = tokens.slice(1);
                        } else {
                            let matched = false;
                            for (let n = 4; n >= 1; n--) {
                                if (tokens.length >= n) {
                                    const phrase = tokens.slice(0, n).join(" ").toLowerCase();
                                    if (whQuestionKeys.has(phrase)) {
                                        const trans = dict.get(phrase);
                                        if (trans) {
                                            questionTranslation = trans;
                                        } else {
                                            const parts = phrase.split(" ");
                                            let transParts = [];
                                            for (const p of parts) {
                                                transParts.push(getTranslation(p));
                                            }
                                            questionTranslation = transParts.join(" ");
                                        }
                                        remainingTokens = tokens.slice(n);
                                        matched = true;
                                        break;
                                    }
                                }
                            }
                            if (!matched) {
                                questionTranslation = getTranslation(firstToken);
                                remainingTokens = tokens.slice(1);
                            }
                        }

                        let result = translatePhrase(remainingTokens, true, isHaveStart, isImperative);
                        let finalResult = result.text;

                        if (finalResult.length > 0 && questionTranslation) {
                            finalResult += " " + questionTranslation;
                        } else if (questionTranslation) {
                            finalResult = questionTranslation;
                        }

                        if (trailingPunct) {
                            if (trailingPunct === "?") finalResult += "?";
                            else if (trailingPunct === "꤯") finalResult += "꤯";
                            else if (trailingPunct === "!") finalResult += "!";
                            else finalResult += trailingPunct;
                        }
                        return finalResult;
                    }

                    // Simple sentence
                    let result = translatePhrase(tokens, false, isHaveStart, isImperative);
                    let finalResult = result.text;

                    if (result.modalInfo) {
                        if (result.modalInfo.type === "will") {
                            finalResult += " ꤕꤢ꤭";
                        } else {
                            finalResult += " ꤢ꤬ꤔꤟꤤꤕꤚꤢꤧ";
                        }
                    }

                    if (trailingPunct) {
                        if (trailingPunct === "?") finalResult += "?";
                        else if (trailingPunct === "꤯") finalResult += "꤯";
                        else if (trailingPunct === "!") finalResult += "!";
                        else finalResult += trailingPunct;
                    }
                    return finalResult;
                });

                return translatedSentences.join(" ");
            }

            // --------------------------------------------------------------
            //  Translate Kayah Li → English
            // --------------------------------------------------------------
            function translateToEnglish(text) {
                if (!text.trim()) return "";
                let normalized = text.replace(/꤯/g, ".");
                const tokens = normalized.split(/\s+/).filter(w => w.length > 0);
                const englishParts = tokens.map(token => {
                    let punct = "";
                    const match = token.match(/[.,;!?]+$/);
                    if (match) {
                        punct = match[0];
                        token = token.slice(0, -match[0].length);
                    }
                    let eng = reverseDict.get(token);
                    if (!eng) {
                        eng = token;
                    }
                    return eng + punct;
                });
                return englishParts.join(" ");
            }

            // --------------------------------------------------------------
            //  UI logic
            // --------------------------------------------------------------
            const inputEl = document.getElementById("inputText");
            const outputEl = document.getElementById("outputText");

            let currentDirection = "en2kayah";

            function updateTranslation() {
                const raw = inputEl.value;
                let result = "";
                if (currentDirection === "en2kayah") {
                    result = translateToKayah(raw);
                } else {
                    result = translateToEnglish(raw);
                }
                outputEl.textContent = result || " ";
            }

            inputEl.addEventListener("input", updateTranslation);

            currentDirection = "en2kayah";
            inputEl.placeholder = "Type English …";
            window.addEventListener("load", function() {
                updateTranslation();
            });

            window.translator = { translateToKayah, translateToEnglish };
        })();
    </script>

                    if (!inserted) newWords.push(freqAfterVerbTrans);
                    result = newWords.join(" ");
                }
                // never → after main verb + object noun
                // He never eats food → He eats food never
                // She never eats → She eats never
                // I never forget you → I forget you never
                if (neverTranslation) {
                    const afterNever = new Set([
                        "ꤢ꤬ꤋꤢꤧ꤭", "ꤟꤤꤒꤥ꤬ꤢ꤬ꤋꤢꤧ꤭", "ꤓꤌꤣ꤭ꤘꤣꤋꤛꤢꤩ꤭",
                        "ꤒꤢ꤬ꤘꤢꤦ꤬ꤒꤟꤌꤣ", "ꤔꤌꤣ꤬ꤕꤢ꤭", "ꤊꤤ꤬", "ꤗꤟꤢꤩ꤬ꤒꤢꤩ꤭ꤚꤢꤪ",
                        "ꤒꤥ꤬ꤟꤢꤩꤗꤢ꤬", "ꤒꤢ꤬ꤘꤣ꤬", "ꤗꤢ꤬ꤔꤢ", "ꤓꤌꤣ꤭ꤕꤢ꤭"
                    ]);
                    const words = result.split(" ").filter(w => w.length > 0);
                    let insertAt = words.length;
                    for (let wi = 0; wi < words.length; wi++) {
                        const bare = words[wi].replace(/[.,;!?꤯]+$/, "");
                        if (afterNever.has(bare)) {
                            insertAt = wi;
                            break;
                        }
                    }
                    const newWords = words.slice(0, insertAt).concat([neverTranslation], words.slice(insertAt));
                    result = newWords.join(" ");
                }
                // sentence-final adverbial before (no subordinate)
                // e.g. I never ever eat this before → … never ꤢ꤬ꤚꤟꤢꤩꤋꤢꤧ꤭
                if (beforeAdverbEnd) {
                    result = (result ? result + " " : "") + beforeAdverbEnd;
                }

                // Modal (will/can/should) on main clause before -ever words and before return
                // e.g. I will do whatever you want → … ꤕꤢ꤭ ꤒꤤ꤭… (will before whatever)
                let modalInfo = null;
                if (modalToken) {
                    const lowerModal = modalToken.toLowerCase();
                    const modalTrans = getModalTranslation(modalToken);
                    if (modalTrans) {
                        modalInfo = { type: lowerModal, translation: modalTrans, isQuestion: isQuestion };
                    }
                }

                // whatever / whoever / whomever / whichever → end of sentence
                // will/can/should goes right after the main verb:
                // e.g. I will do whatever you want
                // → ꤠꤢ꤭ ꤗꤟꤢꤩ꤬ ꤕꤢ꤭ ꤔꤟꤢꤧ꤬ ꤞꤢꤧꤐꤟꤢꤦ ꤒꤤ꤭…
                if (everWordTranslation) {
                    if (modalInfo && !isQuestion) {
                        const subjectForms = new Set(["ꤠꤢ꤭", "ꤢꤧ꤬", "ꤕꤟꤢꤧ꤬", "ꤢꤧ꤬ꤞꤤ꤭", "ꤔꤟꤢꤧ꤬"]);
                        const words = result.split(" ").filter(w => w.length > 0);
                        let inserted = false;
                        let newWords = [];
                        for (let wi = 0; wi < words.length; wi++) {
                            newWords.push(words[wi]);
                            // insert modal right after first non-subject (main verb)
                            if (!inserted && !subjectForms.has(words[wi])) {
                                newWords.push(modalInfo.translation);
                                inserted = true;
                            }
                        }
                        if (!inserted) newWords.push(modalInfo.translation);
                        result = newWords.join(" ");
                        modalInfo = null;
                        modalToken = null;
                    }
                    result = (result ? result + " " : "") + everWordTranslation;
                    result = reorderWhBeforeTimeConj(result);
                }

                return {
                    text: result,
                    hasNegation: hasNegation,
                    modalInfo: modalInfo,
                    toBeFound: toBeFound,
                    haveFound: haveFound,
                    haveTranslation: haveTranslation,
                    isHaveStart: isHaveStart || false,
                    nounTranslation: nounTranslation,
                    v3Translation: v3Translation,
                    isAuxiliaryHave: isAuxiliaryHave,
                    isMainVerbHave: isMainVerbHave,
                    isImperative: isImperative || false,
                    isDonStart: isDonStart || false
                };
            }

            // --------------------------------------------------------------
            //  Translate English → Kayah Li - Main function
            // --------------------------------------------------------------
            function translateToKayah(text) {
                if (!text.trim()) return "";

                // Enter / newline → separate sentences (keep line breaks in output)
                if (/\r?\n/.test(text)) {
                    const lines = text.split(/\r?\n/);
                    return lines.map(function (line) {
                        if (!line.trim()) return "";
                        return translateToKayah(line);
                    }).join("\n");
                }

                const trimmed = text.trim();
                const lowerTrimmed = trimmed.toLowerCase();

                if (lowerTrimmed === "to") {
                    return "ꤘꤣ";
                }

                if (lowerTrimmed === "when") {
                    return "ꤙꤤꤋꤢꤧ꤭ꤒꤢꤩ꤭";
                }

                // Single-word lookup for conjunctions / prepositions that might be skipped in phrase logic
                if (!lowerTrimmed.includes(" ") && dict.has(lowerTrimmed)) {
                    const single = dict.get(lowerTrimmed);
                    if (single && !single.includes("PLACEHOLDER") && !single.includes("|")) {
                        // Prefer question form for lone WH words already handled above; otherwise return dict value
                        return single;
                    }
                }

                for (const key of exactPhraseKeys) {
                    if (lowerTrimmed === key) {
                        const result = dict.get(key);
                        if (result) return result;
                    }
                }

                if (trimmed.endsWith("?")) {
                    const base = trimmed.slice(0, -1).trim();
                    const lowerBase = base.toLowerCase();
                    if (exactPhraseKeys.has(lowerBase)) {
                        const result = dict.get(lowerBase);
                        if (result) return result + "?";
                    }
                }

                // Split on sentence enders . ! ? (English punctuation kept in Kayah Li output).
                // Commas join clauses within a sentence; translate per sentence pause.
                const rawSentences = text.split(/(?<=[.!?])\s+/).filter(s => s.trim().length > 0);
                if (rawSentences.length === 0) return "";

                const translatedSentences = rawSentences.map(sentence => {
                    sentence = sentence.trim();
                    if (!sentence) return "";

                    const sentLower = sentence.toLowerCase();

                    const endsWithQuestion = sentence.endsWith("?");
                    const endsWithPeriod = sentence.endsWith(".");
                    const endsWithExclamation = sentence.endsWith("!");
                    const endsWithComma = sentence.endsWith(",");
                    const endsWithSemicolon = sentence.endsWith(";");

                    let cleanSentence = sentence;
                    let trailingPunct = "";
                    if (endsWithQuestion) {
                        cleanSentence = sentence.slice(0, -1);
                        trailingPunct = "?";
                    } else if (endsWithExclamation) {
                        cleanSentence = sentence.slice(0, -1);
                        trailingPunct = "!";
                    } else if (endsWithPeriod) {
                        cleanSentence = sentence.slice(0, -1);
                        trailingPunct = ".";
                    } else if (endsWithComma) {
                        cleanSentence = sentence.slice(0, -1);
                        trailingPunct = ",";
                    } else if (endsWithSemicolon) {
                        cleanSentence = sentence.slice(0, -1);
                        trailingPunct = ";";
                    }

                    let tokens = tokenizeEnglish(cleanSentence);
                    if (tokens.length === 0) return "";

                    // "How about …" → body first, then ꤜꤢꤩ꤭ ꤢ꤬ꤗꤟꤢꤩ꤬ꤒꤢꤩ꤭ at end
                    // How about → ꤜꤢꤩ꤭ ꤢ꤬ꤗꤟꤢꤩ꤬ꤒꤢꤩ꤭
                    // How about you → ꤔꤟꤢꤧ꤬ ꤜꤢꤩ꤭ ꤢ꤬ꤗꤟꤢꤩ꤬ꤒꤢꤩ꤭
                    // How about you do it for me → ꤔꤟꤢꤧ꤬ ꤗꤟꤢꤩ꤬ ꤠꤢ꤭ ꤢ꤬ꤑꤢꤩ꤭ ꤜꤢꤩ꤭ ꤢ꤬ꤗꤟꤢꤩ꤬ꤒꤢꤩ꤭
                    {
                        const t0 = tokens[0].toLowerCase().replace(/[.,;!?]+$/, "");
                        const t1 = tokens.length > 1 ? tokens[1].toLowerCase().replace(/[.,;!?]+$/, "") : "";
                        const isHowAboutPhrase = (t0 === "how about") || (t0 === "how" && t1 === "about");
                        if (isHowAboutPhrase) {
                            const howAboutEnd = "ꤜꤢꤩ꤭ ꤢ꤬ꤗꤟꤢꤩ꤬ꤒꤢꤩ꤭";
                            const rest = (t0 === "how about") ? tokens.slice(1) : tokens.slice(2);
                            if (rest.length === 0) {
                                let r = howAboutEnd;
                                if (trailingPunct === "?") r += "?";
                                else if (trailingPunct) r += trailingPunct;
                                return r;
                            }
                            const restResult = translatePhrase(rest, false, false, false, false, null, false, null, null);
                            let body = (restResult.text || "").replace(/\s+/g, " ").trim();
                            body = body.replace(/ꤚꤤ꤬ꤊꤛꤢ꤭/g, "").replace(/\s+/g, " ").trim();
                            let r = (body ? body + " " : "") + howAboutEnd;
                            r = r.replace(/\s+/g, " ").trim();
                            if (trailingPunct === "?") r += "?";
                            else if (trailingPunct) r += trailingPunct;
                            return r;
                        }
                    }

                    // WH-clause (not "WH to VERB"): I don't know what he does
                    // → I know don't he does what
                    // I can't eat how they eat → I eat can't they eat how
                    // I won't go where they go → I go won't they go where
                    // They don't know yet how I will come → They know yet don't I come will how
                    {
                        // Note: "when" is handled as time-subordinator (will before when-clause), not here
                        const whClauseWords = new Set(["what", "how", "where", "why", "which"]);
                        const whClauseTrans = {
                            "what": "ꤒꤤ꤭ꤒꤢꤩ꤭",
                            "how": "ꤖꤢꤨꤒꤢꤩ꤭",
                            "where": "ꤙꤤꤒꤢꤩ꤭",
                            "why": "ꤢ꤬ꤗꤟꤢꤩ꤬ꤒꤢꤩ꤭",
                            "which": "ꤒꤣ꤬ꤊꤟꤊꤣ꤬ꤒꤢꤩ꤭"
                        };
                        let whIdx = -1;
                        let whKey = null;
                        for (let i = 0; i < tokens.length; i++) {
                            const tl = tokens[i].toLowerCase().replace(/[.,;!?]+$/, "");
                            // skip "how about" and "how many"/"how much"
                            if (tl === "how about" || tl === "how many" || tl === "how much") continue;
                            if (whClauseWords.has(tl)) {
                                // not "WH to VERB"
                                const next = i + 1 < tokens.length ? tokens[i + 1].toLowerCase().replace(/[.,;!?]+$/, "") : "";
                                if (next === "to" || tl.endsWith(" to")) continue;
                                // next should look like a subject (clause)
                                if (next && (isSubject(tokens[i + 1]) || isNoun(tokens[i + 1]))) {
                                    whIdx = i;
                                    whKey = tl;
                                    break;
                                }
                            }
                        }
                        if (whIdx > 0 && whKey) {
                            // If a time-conjunction appears after WH, let time-conj path handle
                            // e.g. Please tell me what you need before we leave
                            const timeWords = new Set(["before","after","when","while","until","till","since","because","if","unless","although","though"]);
                            let hasTimeAfter = false;
                            for (let j = whIdx + 1; j < tokens.length; j++) {
                                const jl = tokens[j].toLowerCase().replace(/[.,;!?]+$/, "");
                                if (timeWords.has(jl)) { hasTimeAfter = true; break; }
                            }
                            if (hasTimeAfter) {
                                // fall through to time-conjunction handling
                            } else {
                            const mainTokens = tokens.slice(0, whIdx);
                            const subTokens = tokens.slice(whIdx + 1);
                            // Strip negations/modals from main for separate placement
                            // will → ꤕꤢ꤭ at end of MAIN clause (before subordinate / WH)
                            const negSet = new Set(["don't", "doesn't", "didn't", "do not", "does not", "did not",
                                "can't", "cannot", "won't", "will not", "haven't", "hasn't", "hadn't"]);
                            const mainClean = [];
                            let negTrans = null;
                            let yetTrans = null;
                            let mainWill = false;
                            for (let i = 0; i < mainTokens.length; i++) {
                                const tl = mainTokens[i].toLowerCase().replace(/[.,;!?]+$/, "");
                                if (tl === "will" || tl === "would") { mainWill = true; continue; }
                                if (negSet.has(tl) || negativeWords.has(tl)) {
                                    negTrans = getNegativeTranslation(mainTokens[i]);
                                    if (tl === "can't" || tl === "cannot") negTrans = "ꤢ꤬ꤔꤟꤤꤒꤥ꤬";
                                    else if (tl === "won't" || tl === "will not") negTrans = "ꤒꤥ꤬ꤕꤢ꤭";
                                    else if (tl === "haven't" || tl === "hasn't" || tl === "hadn't") negTrans = "ꤒꤥ꤬";
                                    else negTrans = "ꤒꤥ꤬";
                                    continue;
                                }
                                if (tl === "yet") {
                                    yetTrans = getWordTranslation("yet") || "ꤟꤤ";
                                    continue;
                                }
                                // skip auxiliary do/does/did in main
                                if (tl === "do" || tl === "does" || tl === "did") continue;
                                mainClean.push(mainTokens[i]);
                            }
                            const mainRes = translatePhrase(mainClean, false, false, false, false, null, false, null, null);
                            // Subordinate may contain will → short form on that clause
                            const subRes = translatePhrase(subTokens, false, false, false, false, null, false, null, null);
                            let subText = (subRes.text || "").replace(/\s+/g, " ").trim();
                            // If sub has will modalInfo, append ꤕꤢ꤭
                            if (subRes.modalInfo && (subRes.modalInfo.type === "will" || subRes.modalInfo.type === "would")) {
                                subText = (subText ? subText + " " : "") + "ꤕꤢ꤭";
                            }
                            let mainText = (mainRes.text || "").replace(/\s+/g, " ").trim();
                            // strip any WH/neg that leaked into main
                            if (whClauseTrans[whKey]) {
                                mainText = mainText.split(" ").filter(w => w !== whClauseTrans[whKey]).join(" ");
                            }
                            let r = mainText;
                            if (yetTrans) r = (r ? r + " " : "") + yetTrans;
                            if (negTrans) r = (r ? r + " " : "") + negTrans;
                            // will at end of main clause before subordinate
                            if (mainWill) r = (r ? r + " " : "") + "ꤕꤢ꤭";
                            if (subText) r = (r ? r + " " : "") + subText;
                            r = (r ? r + " " : "") + (whClauseTrans[whKey] || whKey);
                            r = r.replace(/\s+/g, " ").trim();
                            if (trailingPunct === "?") r += "?";
                            else if (trailingPunct) r += trailingPunct;
                            return r;
                            } // end else (no time conj after WH)
                        }
                    }

                    const firstToken = tokens.length > 0 ? tokens[0].toLowerCase() : "";
                    const isImperative = (firstToken !== "i" && firstToken !== "you" && firstToken !== "we" && firstToken !== "they" && firstToken !== "he" && firstToken !== "she" && firstToken !== "it" && firstToken !== "what" && firstToken !== "who" && firstToken !== "whose" && firstToken !== "when" && firstToken !== "why" && firstToken !== "where" && firstToken !== "how" && firstToken !== "will" && firstToken !== "would" && firstToken !== "let's" && firstToken !== "can" && firstToken !== "could" && firstToken !== "may" && firstToken !== "should" && firstToken !== "do" && firstToken !== "does" && firstToken !== "did" && firstToken !== "am" && firstToken !== "is" && firstToken !== "are" && firstToken !== "was" && firstToken !== "were" && firstToken !== "have" && firstToken !== "has" && firstToken !== "had" && firstToken !== "aren't" && firstToken !== "weren't" && firstToken !== "isn't" && firstToken !== "wasn't") || firstToken === "don't";

                    const isToBeQuestion = isToBeQuestionStart(firstToken);
                    const isHaveStart = isHaveVerb(firstToken);

                    const isWillStart = firstToken === "will" || firstToken === "would";
                    const isCanStart = firstToken === "can";
                    const isCouldStart = firstToken === "could";
                    const isMayStart = firstToken === "may";
                    const isShouldStart = firstToken === "should";
                    const isDoStart = firstToken === "do" || firstToken === "does" || firstToken === "did";

                    // Invert "Should SUBJECT …" → "SUBJECT should …" and mark for ꤟꤟꤢꤧ꤭ at end of main
                    if (isShouldStart && tokens.length >= 2) {
                        const rest = tokens.slice(1);
                        const r0 = rest[0].toLowerCase().replace(/[.,;!?]+$/, "");
                        const subjSet = new Set(["i","you","we","they","he","she","it"]);
                        if (subjSet.has(r0)) {
                            tokens = [rest[0], "should"].concat(rest.slice(1));
                        }
                    }

                    // Check if the sentence starts with a WH word followed by a noun
                    let isWhNounQuestion = false;
                    let whNounWord = null;
                    let whNounSubject = null;
                    let whNounVerb = null;
                    let whNounModal = null;

                    if (tokens.length >= 2) {
                        const first = tokens[0].toLowerCase().replace(/[.,;!?]+$/, "");
                        const second = tokens[1].toLowerCase().replace(/[.,;!?]+$/, "");
                        // Detect WH + (optional adj) + noun
                        // Skip when/where/why/… used as adverbial clause starters without "?"
                        const advStarters = new Set(["when", "where", "why", "before", "after", "while", "since", "until", "till", "although", "though", "if", "unless", "because"]);
                        let nounIdx = -1;
                        if (!(advStarters.has(first) && !endsWithQuestion) && (whQuestionWords.has(first) || first === "whose")) {
                            for (let j = 1; j < Math.min(tokens.length, 4); j++) {
                                const tl = tokens[j].toLowerCase().replace(/[.,;!?]+$/, "");
                                if (isNoun(tokens[j]) || tl === "house" || tl === "book" || tl === "books" || tl === "money" || tl === "country" || tl === "girl" || tl === "box" || tl === "table" || tl === "hotel" || tl === "school" || tl === "room") {
                                    nounIdx = j;
                                    break;
                                }
                                if (!isAdjective(tokens[j]) && tl !== "the" && tl !== "a" && tl !== "an") break;
                            }
                        }
                        if (nounIdx !== -1) {
                            isWhNounQuestion = true;
                            whNounWord = first;
                            whNounSubject = tokens[nounIdx];
                            // Find the verb
                            for (let i = nounIdx + 1; i < tokens.length; i++) {
                                const lower = tokens[i].toLowerCase().replace(/[.,;!?]+$/, "");
                                if (isActionVerb(tokens[i]) || lower === "want" || lower === "need" || lower === "go" || lower === "come") {
                                    whNounVerb = tokens[i];
                                    break;
                                }
                                if (lower === "will" || lower === "would" || lower === "can" || lower === "could" || lower === "may") {
                                    whNounModal = tokens[i];
                                }
                            }
                        } else if (whQuestionWords.has(first) && (isNoun(tokens[1]) || second === "house" || second === "book" || second === "books" || second === "money" || second === "country")) {
                            isWhNounQuestion = true;
                            whNounWord = first;
                            whNounSubject = tokens[1];
                            // Find the verb
                            for (let i = 2; i < tokens.length; i++) {
                                const lower = tokens[i].toLowerCase().replace(/[.,;!?]+$/, "");
                                if (isActionVerb(tokens[i]) || lower === "want" || lower === "need" || lower === "go" || lower === "come") {
                                    whNounVerb = tokens[i];
                                    break;
                                }
                                if (lower === "will" || lower === "would" || lower === "can" || lower === "could" || lower === "may") {
                                    whNounModal = tokens[i];
                                }
                            }
                        }
                    }

                    // Sentence-initial "when/before/after/while/…" without "?" = adverbial clause, not WH-question
                    const adverbialClauseStarters = new Set(["when", "before", "after", "while", "since", "until", "till", "although", "though", "if", "unless", "because"]);
                    const isAdverbialStart = adverbialClauseStarters.has(firstToken) && !endsWithQuestion;
                    let isWhQuestion = !isAdverbialStart && (
                        whQuestionKeys.has(firstToken) ||
                        ["what", "who", "whose", "when", "why", "which", "where", "how", "how many", "how much"].includes(firstToken) ||
                        isDoStart || isWillStart || isCanStart || isCouldStart || isMayStart || isShouldStart
                    );

                    // Check for modal before conjunction
                    let hasModalBeforeConjunction = false;
                    let modalType = null;
                    for (let i = 0; i < tokens.length; i++) {
                        const lower = tokens[i].toLowerCase().replace(/[.,;!?]+$/, "");
                        if ((lower === "will" || lower === "would" || lower === "can" || lower === "could" || lower === "may") && i + 1 < tokens.length) {
                            const nextLower = tokens[i + 1].toLowerCase().replace(/[.,;!?]+$/, "");
                            if (modalBeforeConjunctions.has(nextLower) || 
                                (i + 2 < tokens.length && modalBeforeConjunctions.has(tokens[i + 1] + " " + tokens[i + 2]))) {
                                hasModalBeforeConjunction = true;
                                modalType = lower;
                                break;
                            }
                        }
                    }

                    // Handle WH + Noun + Verb + Subject pattern (e.g., "What house do you want")
                    if (isWhNounQuestion && whNounWord && whNounSubject) {
                        let whTrans = getWordTranslation(whNounWord);
                        let nounTrans = getWordTranslation(whNounSubject);
                        let subjectTrans = null;
                        let verbTrans = null;
                        let modalTrans = null;
                        let questionMarker = "ꤟꤟꤢꤧ꤭";

                        // Find the subject and verb - skip "do", "does", "did"
                        let foundSubject = false;
                        let foundVerb = false;
                        for (let i = 2; i < tokens.length; i++) {
                            const lower = tokens[i].toLowerCase().replace(/[.,;!?]+$/, "");
                            // Skip "do", "does", "did" as they are auxiliary verbs
                            if (lower === "do" || lower === "does" || lower === "did") {
                                continue;
                            }
                            if (!foundSubject && isSubject(tokens[i])) {
                                subjectTrans = getSubjectTranslation(tokens[i]);
                                foundSubject = true;
                            }
                            if (!foundVerb && (isActionVerb(tokens[i]) || lower === "want" || lower === "need" || lower === "go" || lower === "come")) {
                                verbTrans = getWordTranslation(tokens[i]);
                                foundVerb = true;
                            }
                            if (lower === "will" || lower === "would" || lower === "can" || lower === "could" || lower === "may") {
                                modalTrans = getModalTranslation(tokens[i]);
                            }
                        }

                        // Build result: noun + whWord + subject + verb + (modal form at end)
                        // WH+noun patterns are questions → use full form (…ꤟꤟꤢꤧ꤭)
                        // Statement "will" after subject → short form ꤕꤢ꤭ (handled outside this block)
                        let endModalMarker = questionMarker; // default ꤟꤟꤢꤧ꤭ (do)
                        let foundWill = false;
                        let foundShould = false;
                        let foundCan = false;
                        let foundMay = false;
                        for (let i = 0; i < tokens.length; i++) {
                            const lower = tokens[i].toLowerCase().replace(/[.,;!?]+$/, "");
                            if (lower === "will" || lower === "would") foundWill = true;
                            if (lower === "should") foundShould = true;
                            if (lower === "may") foundMay = true;
                            if (lower === "can" || lower === "could") foundCan = true;
                        }
                        if (foundWill) {
                            endModalMarker = "ꤕꤢ꤭ꤟꤟꤢꤧ꤭"; // question → full form
                        } else if (foundShould) {
                            endModalMarker = "ꤒꤥ꤭ꤊꤢꤪ꤬ꤟꤟꤢꤧ꤭";
                        } else if (foundMay) {
                            endModalMarker = "ꤢ꤬ꤔꤟꤤꤏꤢꤜꤟꤢꤩꤟꤟꤢꤧ꤭";
                        } else if (foundCan) {
                            endModalMarker = "ꤢ꤬ꤔꤟꤤꤕꤚꤢꤧꤟꤟꤢꤧ꤭";
                        }

                        // Special: "whose" at START of sentence → whose + noun + (adj/predicate) + ꤟꤟꤢꤧ꤭
                        // e.g. Whose book is good? → ꤢꤨ꤭ꤕꤢꤩ꤭ ꤜꤤ꤬ꤢꤨ ꤚꤛꤢ ꤟꤟꤢꤧ꤭
                        // Mid-sentence "whose" is handled elsewhere (noun then whose, no question marker)
                        if (whNounWord === "whose") {
                            let whoseTrans = getWordTranslation("whose") || "ꤢꤨ꤭ꤕꤢꤩ꤭";
                            let adjBeforeNoun = null;
                            let realNounTrans = null;
                            let predicateParts = [];
                            let nounIdxLocal = -1;
                            for (let i = 1; i < tokens.length; i++) {
                                const tl = tokens[i].toLowerCase().replace(/[.,;!?]+$/, "");
                                if (tl === "the" || tl === "a" || tl === "an") continue;
                                if (isToBeVerb(tokens[i])) continue; // skip is/are/was/were
                                if (!realNounTrans && isAdjective(tokens[i])) {
                                    // adjective before noun (Whose big book)
                                    adjBeforeNoun = getWordTranslation(tokens[i]);
                                    continue;
                                }
                                if (!realNounTrans && (isNoun(tokens[i]) || tl === "house" || tl === "book" || tl === "car" || tl === "money" || tl === "books")) {
                                    realNounTrans = getWordTranslation(tokens[i]);
                                    nounIdxLocal = i;
                                    continue;
                                }
                                // after noun: adjectives/predicates (Whose book is good)
                                if (realNounTrans) {
                                    if (isAdjective(tokens[i]) || adjectiveMap.has(tl)) {
                                        predicateParts.push(getWordTranslation(tokens[i]));
                                    } else if (isActionVerb(tokens[i]) || isSubject(tokens[i])) {
                                        const vt = getWordTranslation(tokens[i]);
                                        if (vt && vt !== tokens[i]) predicateParts.push(vt);
                                        else if (isSubject(tokens[i])) {
                                            const st = getSubjectTranslation(tokens[i]);
                                            if (st) predicateParts.push(st);
                                        }
                                    }
                                }
                            }
                            if (!realNounTrans && nounTrans) realNounTrans = nounTrans;
                            let result = whoseTrans + " ";
                            if (realNounTrans) result += realNounTrans + " ";
                            if (adjBeforeNoun) result += adjBeforeNoun + " ";
                            for (const p of predicateParts) result += p + " ";
                            if (subjectTrans) result += subjectTrans + " ";
                            if (verbTrans) result += verbTrans + " ";
                            // whose at sentence start → always add question marker
                            result += (foundWill ? "ꤕꤢ꤭ꤟꤟꤢꤧ꤭" : foundShould ? "ꤒꤥ꤭ꤊꤢꤪ꤬ꤟꤟꤢꤧ꤭" : foundMay ? "ꤢ꤬ꤔꤟꤤꤏꤢꤜꤟꤢꤩꤟꤟꤢꤧ꤭" : foundCan ? "ꤢ꤬ꤔꤟꤤꤕꤚꤢꤧꤟꤟꤢꤧ꤭" : "ꤟꤟꤢꤧ꤭");
                            result = result.replace(/\s+/g, " ").trim();
                            if (trailingPunct) {
                                if (trailingPunct === "?") result += "?";
                                else if (trailingPunct === "꤯") result += "꤯";
                                else if (trailingPunct === "!") result += "!";
                                else result += trailingPunct;
                            }
                            return result;
                        }

                        // Detect have/has/had in WH+noun questions → ꤥ꤬ after subject
                        let hasHaveMain = false;
                        for (let i = 0; i < tokens.length; i++) {
                            const lower = tokens[i].toLowerCase().replace(/[.,;!?]+$/, "");
                            if (lower === "have" || lower === "has" || lower === "had") {
                                hasHaveMain = true;
                                break;
                            }
                        }

                        let result = "";
                        if (nounTrans) result += nounTrans + " ";
                        if (whTrans) result += whTrans + " ";
                        if (subjectTrans) result += subjectTrans + " ";
                        // have after subject pronouns: books how-many she ꤥ꤬ does
                        if (hasHaveMain) result += "ꤥ꤬ ";
                        if (verbTrans) result += verbTrans + " ";
                        result += endModalMarker;

                        // If the verb is "want", use the specific translation
                        if (whNounVerb && whNounVerb.toLowerCase() === "want") {
                            result = (nounTrans ? nounTrans + " " : "") + (whTrans ? whTrans + " " : "") + (subjectTrans ? subjectTrans + " " : "") + (hasHaveMain ? "ꤥ꤬ " : "") + "ꤞꤢꤧꤐꤟꤢꤦ" + " " + endModalMarker;
                        }
                        // If the verb is "come", use the specific translation
                        if (whNounVerb && whNounVerb.toLowerCase() === "come") {
                            result = (nounTrans ? nounTrans + " " : "") + (whTrans ? whTrans + " " : "") + (subjectTrans ? subjectTrans + " " : "") + (hasHaveMain ? "ꤥ꤬ " : "") + "ꤟꤛꤢ꤭" + " " + endModalMarker;
                        }

                        result = result.replace(/\s+/g, " ").trim();
                        if (trailingPunct) {
                            if (trailingPunct === "?") result += "?";
                            else if (trailingPunct === "꤯") result += "꤯";
                            else if (trailingPunct === "!") result += "!";
                            else result += trailingPunct;
                        }
                        return result;
                    }

                    // Special handling: "not only ... but also ..."
                    {
                        let notOnlyIndex = -1;
                        let notOnlySkip = 0;
                        let butAlsoIndex = -1;
                        let butAlsoSkip = 0;

                        for (let i = 0; i < tokens.length; i++) {
                            const lower = tokens[i].toLowerCase().replace(/[.,;!?]+$/, "");
                            if (lower === "not only") {
                                notOnlyIndex = i;
                                notOnlySkip = 1;
                            } else if (lower === "but also") {
                                butAlsoIndex = i;
                                butAlsoSkip = 1;
                            }
                            if (i + 1 < tokens.length) {
                                const two = (tokens[i] + " " + tokens[i + 1]).toLowerCase().replace(/[.,;!?]+$/g, "");
                                if (two === "not only") {
                                    notOnlyIndex = i;
                                    notOnlySkip = 2;
                                }
                                if (two === "but also") {
                                    butAlsoIndex = i;
                                    butAlsoSkip = 2;
                                }
                            }
                        }

                        if (notOnlyIndex >= 0 && butAlsoIndex > notOnlyIndex) {
                            const before = tokens.slice(0, notOnlyIndex);
                            const middle = tokens.slice(notOnlyIndex + notOnlySkip, butAlsoIndex);
                            const after = tokens.slice(butAlsoIndex + butAlsoSkip);

                            let beforeResult = translatePhrase(before, false, false, false, false, null, false, null, null);
                            let middleResult = translatePhrase(middle, false, false, false, false, null, false, null, null);
                            let afterResult = translatePhrase(after, false, false, false, false, null, false, null, null);

                            let result = "";
                            if (beforeResult.text) result += beforeResult.text + " ";
                            if (middleResult.text) result += middleResult.text + " ";
                            result += "ꤒꤢꤦꤗꤟꤢꤒꤥ꤬ ";
                            if (afterResult.text) result += afterResult.text + " ";
                            result += "ꤕꤢ꤭ꤕꤢ꤭";

                            result = result.replace(/\s+/g, " ").trim();
                            if (trailingPunct) {
                                if (trailingPunct === "?") result += "?";
                                else if (trailingPunct === "꤯") result += "꤯";
                                else if (trailingPunct === "!") result += "!";
                                else result += trailingPunct;
                            }
                            return result;
                        }
                    }

                    let hasBut = false;
                    let butIndex = -1;
                    for (let i = 0; i < tokens.length; i++) {
                        if (tokens[i].toLowerCase().replace(/[.,;!?]+$/, "") === "but") {
                            hasBut = true;
                            butIndex = i;
                            break;
                        }
                    }
                    if (hasBut && butIndex >= 0) {
                        let mainTokens = [];
                        let butTokens = [];
                        for (let i = 0; i < butIndex; i++) mainTokens.push(tokens[i]);
                        for (let i = butIndex + 1; i < tokens.length; i++) butTokens.push(tokens[i]);

                        // Recurse so nested when/negatives/modals apply on each side
                        let mainText = mainTokens.join(" ").replace(/\s+/g, " ").trim();
                        let butText = butTokens.join(" ").replace(/\s+/g, " ").trim();
                        let mainOut = mainText ? translateToKayah(mainText) : "";
                        let butOut = butText ? translateToKayah(butText) : "";

                        let result = mainOut || "";
                        result = (result ? result + " " : "") + "ꤗꤢ꤬ꤔꤢ";
                        if (butOut) result += " " + butOut;
                        result = result.replace(/\s+/g, " ").trim();
                        if (trailingPunct) {
                            if (trailingPunct === "?") result += "?";
                            else if (trailingPunct === "꤯") result += "꤯";
                            else if (trailingPunct === "!") result += "!";
                            else result += trailingPunct;
                        }
                        return result;
                    }


                    let timeConjIndex = -1;
                    let timeConjType = null;
                    let timeConjSkip = 1;

                    for (let i = 0; i < tokens.length; i++) {
                        if (i + 2 < tokens.length) {
                            const threeWord = (tokens[i] + " " + tokens[i + 1] + " " + tokens[i + 2]).toLowerCase().replace(/[.,;!?]+$/g, "");
                            if (timeConjunctions.has(threeWord)) {
                                timeConjIndex = i;
                                timeConjType = threeWord;
                                timeConjSkip = 3;
                                break;
                            }
                        }
                        if (i + 1 < tokens.length) {
                            const twoWord = (tokens[i] + " " + tokens[i + 1]).toLowerCase().replace(/[.,;!?]+$/g, "");
                            if (timeConjunctions.has(twoWord)) {
                                timeConjIndex = i;
                                timeConjType = twoWord;
                                timeConjSkip = 2;
                                break;
                            }
                        }
                        const lower = tokens[i].toLowerCase().replace(/[.,;!?]+$/, "");
                        if (timeConjunctions.has(lower)) {
                            timeConjIndex = i;
                            timeConjType = lower;
                            timeConjSkip = 1;
                            break;
                        }
                    }

                    if (timeConjIndex >= 0 && timeConjIndex < tokens.length - 1) {
                        let mainTokens = [];
                        let timeTokens = [];
                        for (let i = 0; i < timeConjIndex; i++) {
                            mainTokens.push(tokens[i]);
                        }
                        for (let i = timeConjIndex + timeConjSkip; i < tokens.length; i++) {
                            timeTokens.push(tokens[i]);
                        }

                        // Sentence-initial "When/Before/After X, Y" → X + conj , Y
                        // when/before at END of first clause, before comma (or before period if no comma)
                        // When the train arrived, we boarded → train arrived when , we boarded
                        // When the train arrived. → train arrived when .
                        let frontedTimeConj = false;
                        if (timeConjIndex === 0 && mainTokens.length === 0) {
                            let commaIdx = -1;
                            for (let i = 0; i < timeTokens.length; i++) {
                                if (/,$/.test(timeTokens[i]) || timeTokens[i] === ",") {
                                    commaIdx = i;
                                    break;
                                }
                            }
                            // tokens may have lost trailing commas — recover from cleanSentence
                            if (commaIdx < 0 && typeof cleanSentence === "string" && cleanSentence.indexOf(",") >= 0) {
                                const left = cleanSentence.split(",")[0];
                                // count words in left after stripping the leading conj
                                const leftWords = left.trim().split(/\s+/).filter(function (w) { return w.length > 0; });
                                // leftWords includes "When"/"Before"/… as first word(s)
                                const conjWordCount = timeConjSkip; // already matched at start
                                const subWordCount = Math.max(0, leftWords.length - conjWordCount);
                                if (subWordCount > 0 && subWordCount < timeTokens.length) {
                                    commaIdx = subWordCount - 1;
                                }
                            }
                            if (commaIdx >= 0) {
                                mainTokens = timeTokens.slice(commaIdx + 1);
                                timeTokens = timeTokens.slice(0, commaIdx + 1).map(function (t) {
                                    return t.replace(/,$/, "");
                                }).filter(function (t) { return t.length > 0; });
                                frontedTimeConj = true;
                            }
                        }

                        // Fronted: sub-clause + conj + comma + main
                        if (frontedTimeConj) {
                            let timeTranslationFront = timeConjunctions.get(timeConjType);
                            if (timeTranslationFront === "WHEN_PLACEHOLDER") timeTranslationFront = "ꤢ꤬ꤋꤢꤧ꤭";
                            const subRes = translatePhrase(timeTokens, false, false, false, false, null, false, null, null);
                            // Prefer original text after first comma so nested before/when keep commas
                            let mainText = mainTokens.join(" ").replace(/\s+/g, " ").trim();
                            if (typeof cleanSentence === "string" && cleanSentence.indexOf(",") >= 0) {
                                const afterComma = cleanSentence.split(",").slice(1).join(",").trim();
                                if (afterComma) mainText = afterComma;
                            }
                            let mainOut = mainText ? translateToKayah(mainText) : "";
                            // X when , Y   (conj at end of first clause, before comma)
                            let result = (subRes.text ? subRes.text + " " : "") + (timeTranslationFront || "");
                            result += " ,";
                            if (mainOut) result += " " + mainOut;
                            result = result.replace(/\s+/g, " ").trim();
                            result = result.replace(/\s*,\s*,/g, " ,");
                            if (trailingPunct) {
                                if (trailingPunct === "?") result += "?";
                                else if (trailingPunct === "꤯") result += "꤯";
                                else if (trailingPunct === "!") result += "!";
                                else if (trailingPunct !== ",") result += trailingPunct;
                            }
                            return result;
                        }

                        let whCanExtract = extractLeadingWhCan(mainTokens);
                        mainTokens = whCanExtract.tokens;
                        let leadingWhCanPhrase = whCanExtract.phrase;

                        let mainResult = translatePhrase(mainTokens, endsWithQuestion || isToBeQuestion || isWhQuestion, isHaveStart, isImperative, hasModalBeforeConjunction, modalType, false, null, null);
                        if (leadingWhCanPhrase) {
                            mainResult.text = (mainResult.text ? mainResult.text + " " : "") + leadingWhCanPhrase;
                        }

                        // Are you fine after I go → you fine ꤟꤟꤢꤧ꤭ | I go after
                        if (isToBeQuestion) {
                            let mt = mainTokens.slice();
                            if (mt.length > 0 && isToBeQuestionStart(mt[0])) {
                                mt = mt.slice(1);
                            }
                            mainResult = translatePhrase(mt, true, false, isImperative, hasModalBeforeConjunction, modalType, false, null, null);
                            if (leadingWhCanPhrase) {
                                mainResult.text = (mainResult.text ? mainResult.text + " " : "") + leadingWhCanPhrase;
                            }
                            mainResult.text = (mainResult.text ? mainResult.text + " " : "") + "ꤟꤟꤢꤧ꤭";
                        }

                        const secondaryConjunctions = {
                            "because": "ꤗꤟꤢꤩ꤬ꤒꤢꤩ꤭ꤚꤢꤪ",
                            "and": "ꤓꤌꤣ꤭ꤕꤢ꤭",
                            "nor": "ꤒꤥ꤬ꤒꤥ꤬",
                            "but": "ꤗꤢ꤬ꤔꤢ",
                            "or": "ꤒꤥ꤬ꤗꤢ꤬",
                            "yet": "ꤟꤤ",
                            "so": "ꤚꤢꤪ",
                            "either": "ꤒꤣ꤬ꤊꤟꤊꤣ꤬ꤊꤟꤊꤣ꤬",
                            "neither": "ꤜꤟꤢꤪ꤭ꤟꤤ꤭ꤥ꤬",
                            "both": "ꤜꤟꤢꤪ꤭ꤜꤟꤢꤪ꤭",
                            "since": "ꤔꤌꤣ꤬ꤕꤢ꤭",
                            "while": "ꤢ꤬ꤋꤢꤧ꤭",
                            "before": "ꤟꤤꤒꤥ꤬ꤢ꤬ꤋꤢꤧ꤭",
                            "after": "ꤋꤛꤢꤩ꤭",
                            "if": "ꤊꤤ꤬",
                            "not only": "ꤒꤢꤦꤗꤟꤢꤒꤥ꤬",
                            "but also": "ꤕꤢ꤭ꤕꤢ꤭",
                            "as soon as": "ꤙꤤꤋꤢꤧ꤭ꤒꤢꤩ꤭ꤔꤌꤣ꤬",
                            "although": "ꤒꤢ꤬ꤘꤣ꤬",
                            "whether": "ꤒꤣ꤬ꤊꤟꤊꤣ꤬ꤊꤟꤊꤣ꤬",
                            "once": "ꤒꤣ꤬ꤖꤟꤌꤣꤒꤌꤣ꤭",
                            "inasmuch as": "ꤢ꤬ꤗꤟꤢꤩ꤬ꤒꤢꤩ꤭ꤔꤌꤣ꤬"
                        };

                        let secondaryIndex = -1;
                        let secondaryType = null;
                        let secondarySkip = 1;

                        for (let i = 0; i < timeTokens.length; i++) {
                            if (i + 1 < timeTokens.length) {
                                const twoWord = (timeTokens[i] + " " + timeTokens[i + 1]).toLowerCase().replace(/[.,;!?]+$/g, "");
                                if (secondaryConjunctions.hasOwnProperty(twoWord)) {
                                    secondaryIndex = i;
                                    secondaryType = twoWord;
                                    secondarySkip = 2;
                                    break;
                                }
                            }
                        }

                        if (secondaryIndex === -1) {
                            for (let i = 0; i < timeTokens.length; i++) {
                                const lower = timeTokens[i].toLowerCase().replace(/[.,;!?]+$/, "");
                                if (secondaryConjunctions.hasOwnProperty(lower)) {
                                    secondaryIndex = i;
                                    secondaryType = lower;
                                    secondarySkip = 1;
                                    break;
                                }
                            }
                        }

                        let timeTranslation = timeConjunctions.get(timeConjType);
                        if (timeTranslation === "WHEN_PLACEHOLDER") {
                            timeTranslation = "ꤢ꤬ꤋꤢꤧ꤭";
                        }
                        // when/while already have concrete translations in timeConjunctions

                        // Modal/aux form goes at end of main clause, BEFORE the time conjunction
                        // Full form (…ꤟꤟꤢꤧ꤭) only when modal starts the sentence; otherwise short form
                        let modalEndForm = null;
                        if (mainResult.modalInfo) {
                            if (mainResult.modalInfo.type === "will" || mainResult.modalInfo.type === "would") {
                                modalEndForm = isWillStart ? "ꤕꤢ꤭ꤟꤟꤢꤧ꤭" : "ꤕꤢ꤭";
                            } else if (mainResult.modalInfo.type === "can" || mainResult.modalInfo.type === "could" || mainResult.modalInfo.type === "may") {
                                modalEndForm = mainResult.modalInfo.type === "may"
                                    ? (isMayStart ? "ꤢ꤬ꤔꤟꤤꤏꤢꤜꤟꤢꤩꤟꤟꤢꤧ꤭" : "ꤢ꤬ꤔꤟꤤꤏꤢꤜꤟꤢꤩ")
                                    : (isCanStart || isCouldStart) ? "ꤢ꤬ꤔꤟꤤꤕꤚꤢꤧꤟꤟꤢꤧ꤭" : "ꤢ꤬ꤔꤟꤤꤕꤚꤢꤧ";
                            } else {
                                modalEndForm = mainResult.modalInfo.translation;
                            }
                        } else {
                            for (let i = 0; i < mainTokens.length; i++) {
                                const lower = mainTokens[i].toLowerCase().replace(/[.,;!?]+$/, "");
                                if (lower === "will" || lower === "would") { modalEndForm = isWillStart ? "ꤕꤢ꤭ꤟꤟꤢꤧ꤭" : "ꤕꤢ꤭"; break; }
                                if (isDoStart && (lower === "do" || lower === "does" || lower === "did")) { modalEndForm = "ꤟꤟꤢꤧ꤭"; break; }
                            }
                        }

                        let result = mainResult.text;
                        if (modalEndForm) {
                            result = (result ? result + " " : "") + modalEndForm;
                        }
                        if (isShouldStart) {
                            result = (result ? result + " " : "") + "ꤟꤟꤢꤧ꤭";
                        }

                        // Order: main + will + subordinate + conjunction(at end)
                        // e.g. I will eat after you go → I eat will you go after
                        // Conjunctions at end of sub clause: after, before, when, unless,
                        // even if, while, during, as soon as, although, even though, though
                        // when (and similar) after the subordinate verb/content
                        // e.g. … when they talk → … they talk ꤢ꤬ꤋꤢꤧ꤭
                        const conjAtEndOfSub = new Set([
                            "after", "before", "when", "unless", "even if", "while",
                            "during", "as soon as", "although", "even though", "though",
                            "since"
                        ]);
                        const putConjAtEnd = conjAtEndOfSub.has(timeConjType);

                        if (secondaryIndex >= 0) {
                            let beforeSecondary = timeTokens.slice(0, secondaryIndex);
                            let afterSecondary = timeTokens.slice(secondaryIndex + secondarySkip);

                            // If beforeSecondary has a comma (doors closed, which was lucky because …)
                            // keep only up to comma as time-sub; before/when right after closed, before comma
                            let midAfterComma = [];
                            if (putConjAtEnd) {
                                let cIdx = -1;
                                for (let i = 0; i < beforeSecondary.length; i++) {
                                    if (/,$/.test(beforeSecondary[i]) || beforeSecondary[i] === ",") {
                                        cIdx = i;
                                        break;
                                    }
                                }
                                // recover comma lost in tokenization
                                if (cIdx < 0 && typeof cleanSentence === "string" && cleanSentence.indexOf(",") >= 0) {
                                    const conjRe = new RegExp("\\b" + String(timeConjType).replace(/\s+/g, "\\s+") + "\\b", "i");
                                    const cm = cleanSentence.match(conjRe);
                                    if (cm) {
                                        const afterConj = cleanSentence.slice(cm.index + cm[0].length);
                                        const commaPos = afterConj.indexOf(",");
                                        if (commaPos >= 0) {
                                            const leftPart = afterConj.slice(0, commaPos).trim();
                                            const leftWords = leftPart.split(/\s+/).filter(function (w) { return w.length > 0; });
                                            // only words that belong to beforeSecondary
                                            if (leftWords.length > 0 && leftWords.length <= beforeSecondary.length) {
                                                cIdx = leftWords.length - 1;
                                            }
                                        }
                                    }
                                }
                                if (cIdx >= 0) {
                                    midAfterComma = beforeSecondary.slice(cIdx + 1);
                                    beforeSecondary = beforeSecondary.slice(0, cIdx + 1).map(function (t) {
                                        return t.replace(/,$/, "");
                                    }).filter(function (t) { return t.length > 0; });
                                }
                            }

                            let beforeResult = translatePhrase(beforeSecondary, false, false, false, false, null, false, null, null);
                            let afterResult = translatePhrase(afterSecondary, false, false, false, false, null, false, null, null);

                            if (beforeResult.text.length > 0) {
                                result += " " + beforeResult.text;
                            }
                            if (putConjAtEnd) {
                                // doors closed + before
                                result += " " + timeTranslation;
                                // material between comma and secondary conj (e.g. which was lucky)
                                if (midAfterComma.length > 0) {
                                    const midRes = translatePhrase(midAfterComma, false, false, false, false, null, false, null, null);
                                    if (midRes.text) result += " " + midRes.text;
                                }
                                result += " " + secondaryConjunctions[secondaryType];
                                if (afterResult.text.length > 0) {
                                    result += " " + afterResult.text;
                                }
                            } else {
                                result += " " + timeTranslation;
                                result += " " + secondaryConjunctions[secondaryType];
                                if (afterResult.text.length > 0) {
                                    result += " " + afterResult.text;
                                }
                            }
                        } else {
                            // Split at comma so "before the doors closed, which …"
                            // → doors closed + before | which …
                            // before/when at end of that clause, before the comma
                            let timeSubTokens = timeTokens;
                            let afterCommaTokens = [];
                            if (putConjAtEnd) {
                                let cIdx = -1;
                                for (let i = 0; i < timeTokens.length; i++) {
                                    if (/,$/.test(timeTokens[i]) || timeTokens[i] === ",") {
                                        cIdx = i;
                                        break;
                                    }
                                }
                                // tokens may have lost trailing commas — recover from cleanSentence
                                if (cIdx < 0 && typeof cleanSentence === "string" && cleanSentence.indexOf(",") >= 0) {
                                    // find text after the time conj word in cleanSentence
                                    const conjRe = new RegExp("\\b" + timeConjType.replace(/\s+/g, "\\s+") + "\\b", "i");
                                    const cm = cleanSentence.match(conjRe);
                                    if (cm) {
                                        const afterConj = cleanSentence.slice(cm.index + cm[0].length);

                                            const leftWords = leftPart.split(/\s+/).filter(function (w) { return w.length > 0; });
                                            if (leftWords.length > 0 && leftWords.length <= timeTokens.length) {
                                                cIdx = leftWords.length - 1;
                                            }
                                        }
                                    }
                                }
                                if (cIdx >= 0) {
                                    timeSubTokens = timeTokens.slice(0, cIdx + 1).map(function (t) {
                                        return t.replace(/,$/, "");
                                    }).filter(function (t) { return t.length > 0; });
                                    afterCommaTokens = timeTokens.slice(cIdx + 1);
                                }
                            }
                            let timeResult = translatePhrase(timeSubTokens, false, false, false, false, null, false, null, null);
                            if (putConjAtEnd) {
                                if (timeResult.text.length > 0) {
                                    result += " " + timeResult.text;

                                result += " " + timeTranslation;
                            } else {
                                result += " " + timeTranslation;

                            }
                            if (afterCommaTokens.length > 0) {
                                const afterStr = afterCommaTokens.join(" ").replace(/\s+/g, " ").trim();

                        }

                        // ꤟꤟꤢꤧ꤭ already attached to main when isToBeQuestion (after adj/noun)

                        result = result.replace(/\s+/g, " ").trim();
                        if (trailingPunct) {
                            if (trailingPunct === "?") result += "?";

                    }

                    // Coordinating "but" — modal (will) goes at end of main clause, BEFORE ꤗꤢ꤬ꤔꤢ
                    let hasIf = false;
                    let ifIndex = -1;
                    for (let i = 0; i < tokens.length; i++) {

                    }

                    if (hasIf && ifIndex >= 0) {
                        let mainTokens = [];
                        let ifTokens = [];
                        for (let i = 0; i < ifIndex; i++) {
                            mainTokens.push(tokens[i]);
                        }
                        for (let i = ifIndex + 1; i < tokens.length; i++) {
                            ifTokens.push(tokens[i]);
                        }
                        // "if not, …" → if + not stay together; not is not deferred to end
                        let ifNotPrefix = "";
                        if (ifTokens.length > 0 && ifTokens[0].toLowerCase().replace(/[.,;!?]+$/, "") === "not") {
                            ifNotPrefix = "ꤒꤥ꤬";
                            ifTokens = ifTokens.slice(1);
                            // drop bare comma token after not
                            if (ifTokens.length > 0 && ifTokens[0].replace(/[.,;!?]+$/, "") === "") {
                                ifTokens = ifTokens.slice(1);
                            }
                            while (ifTokens.length > 0 && ifTokens[0] === ",") {
                                ifTokens = ifTokens.slice(1);
                            }
                        }

                        // Sentence-initial If X, Y → if + X + Y(with will at end)
                        // If you come, I will go → if you come I go will
                        if (ifIndex === 0) {
                            let commaIdx = -1;
                            for (let i = 0; i < ifTokens.length; i++) {
                                if (/,$/.test(ifTokens[i]) || ifTokens[i] === ",") {
                                    commaIdx = i;
                                    break;
                                }
                            }
                            let ifClause = ifTokens;
                            let mainClause = [];
                            if (commaIdx >= 0) {
                                ifClause = ifTokens.slice(0, commaIdx + 1).map(t => t.replace(/,$/, "")).filter(t => t.length > 0);
                                mainClause = ifTokens.slice(commaIdx + 1);
                            } else {
                                // no comma: treat all as if-clause content after if (keep simple)
                                ifClause = ifTokens;
                                mainClause = [];
                            }
                            let ifRes = translatePhrase(ifClause, false, false, false, false, null, false, null, null);
                            let mainText = mainClause.join(" ").replace(/\s+/g, " ").trim();
                            let mainOut = mainText ? translateToKayah(mainText) : "";
                            let result = "ꤊꤤ꤬";
                            if (ifNotPrefix) result += " " + ifNotPrefix;
                            if (ifRes.text) result += " " + ifRes.text;
                            // can/will/could/would inside if-clause → end of if-clause
                            if (ifRes.modalInfo) {
                                let ifModal = ifRes.modalInfo.translation;
                                if (ifRes.modalInfo.type === "will" || ifRes.modalInfo.type === "would") ifModal = "ꤕꤢ꤭";
                                else if (ifRes.modalInfo.type === "may") ifModal = "ꤢ꤬ꤔꤟꤤꤏꤢꤜꤟꤢꤩ";
                                else if (ifRes.modalInfo.type === "can" || ifRes.modalInfo.type === "could") ifModal = "ꤢ꤬ꤔꤟꤤꤕꤚꤢꤧ";
                                result += " " + ifModal;
                            }
                            if (mainOut) result += " " + mainOut;
                            result = result.replace(/\s+/g, " ").trim();
                            if (trailingPunct) {
                                if (trailingPunct === "?") result += "?";
                                else if (trailingPunct === "꤯") result += "꤯";

                        }

                        let mainResult = translatePhrase(mainTokens, endsWithQuestion || isToBeQuestion || isWhQuestion, isHaveStart, isImperative, hasModalBeforeConjunction, modalType, false, null, null);
                        let ifResult = translatePhrase(ifTokens, false, false, false, false, null, false, null, null);

                        // Modal/aux form goes at end of main clause, BEFORE the conjunction
                        // Full form only when modal starts the sentence; otherwise short form
                        let modalEndForm = null;
                        if (mainResult.modalInfo) {
                            if (mainResult.modalInfo.type === "will" || mainResult.modalInfo.type === "would") {

                            } else if (mainResult.modalInfo.type === "can" || mainResult.modalInfo.type === "could" || mainResult.modalInfo.type === "may") {
                                modalEndForm = mainResult.modalInfo.type === "may"
                                    ? (isMayStart ? "ꤢ꤬ꤔꤟꤤꤏꤢꤜꤟꤢꤩꤟꤟꤢꤧ꤭" : "ꤢ꤬ꤔꤟꤤꤏꤢꤜꤟꤢꤩ")
                                    : (isCanStart || isCouldStart) ? "ꤢ꤬ꤔꤟꤤꤕꤚꤢꤧꤟꤟꤢꤧ꤭" : "ꤢ꤬ꤔꤟꤤꤕꤚꤢꤧ";
                            } else {
                                modalEndForm = mainResult.modalInfo.translation;
                            }
                        } else {
                            for (let i = 0; i < mainTokens.length; i++) {
                                const lower = mainTokens[i].toLowerCase().replace(/[.,;!?]+$/, "");
                                if (lower === "will" || lower === "would") { modalEndForm = isWillStart ? "ꤕꤢ꤭ꤟꤟꤢꤧ꤭" : "ꤕꤢ꤭"; break; }
                                if (isDoStart && (lower === "do" || lower === "does" || lower === "did")) { modalEndForm = "ꤟꤟꤢꤧ꤭"; break; }
                            }

                        // Are you fine if I go → you fine ꤟꤟꤢꤧ꤭ if I go

                            let mt = mainTokens.slice();
                            if (mt.length > 0 && isToBeQuestionStart(mt[0])) {

                            }

                            result = (result ? result + " " : "") + "ꤟꤟꤢꤧ꤭";

                            if (trailingPunct) {

                        let result = mainResult.text;

                        if (result.length > 0) {
                            result += " ꤊꤤ꤬";
                        } else {
                            result = "ꤊꤤ꤬";
                        }
                        if (ifNotPrefix) result += " " + ifNotPrefix;
                        if (ifResult.text.length > 0) {
                            result += " " + ifResult.text;
                        }
                        // can/will/could/would inside if-clause → end of if-clause
                        if (ifResult.modalInfo) {
                            let ifModal = ifResult.modalInfo.translation;
                            if (ifResult.modalInfo.type === "will" || ifResult.modalInfo.type === "would") ifModal = "ꤕꤢ꤭";
                            else if (ifResult.modalInfo.type === "may") ifModal = "ꤢ꤬ꤔꤟꤤꤏꤢꤜꤟꤢꤩ";
                                else if (ifResult.modalInfo.type === "can" || ifResult.modalInfo.type === "could") ifModal = "ꤢ꤬ꤔꤟꤤꤕꤚꤢꤧ";
                            result += " " + ifModal;
                        }

                        result = result.replace(/\s+/g, " ").trim();
                        if (trailingPunct) {
                            if (trailingPunct === "?") result += "?";
                            else if (trailingPunct === "꤯") result += "꤯";
                            else if (trailingPunct === "!") result += "!";
                            else result += trailingPunct;

                    }

                    let hasBecause = false;
                    let becauseIndex = -1;
                    for (let i = 0; i < tokens.length; i++) {
                        if (tokens[i].toLowerCase() === "because") {

                            becauseIndex = i;
                            break;
                        }
                    }

                    if (hasBecause && becauseIndex >= 0) {
                        let mainTokens = [];
                        let becauseTokens = [];
                        for (let i = 0; i < becauseIndex; i++) {
                            mainTokens.push(tokens[i]);
                        }
                        for (let i = becauseIndex + 1; i < tokens.length; i++) {
                            becauseTokens.push(tokens[i]);
                        }

                        let mainResult = translatePhrase(mainTokens, endsWithQuestion || isToBeQuestion || isWhQuestion, isHaveStart, isImperative, hasModalBeforeConjunction, modalType, false, null, null);
                        let becauseResult = translatePhrase(becauseTokens, false, false, false, false, null, false, null, null);

                        // Modal/aux form goes at end of main clause, BEFORE the conjunction
                        // Full form only when modal starts the sentence; otherwise short form
                        let modalEndForm = null;
                        if (mainResult.modalInfo) {
                            if (mainResult.modalInfo.type === "will" || mainResult.modalInfo.type === "would") {

                            } else if (mainResult.modalInfo.type === "can" || mainResult.modalInfo.type === "could" || mainResult.modalInfo.type === "may") {

                                    : (isCanStart || isCouldStart) ? "ꤢ꤬ꤔꤟꤤꤕꤚꤢꤧꤟꤟꤢꤧ꤭" : "ꤢ꤬ꤔꤟꤤꤕꤚꤢꤧ";
                            } else {
                                modalEndForm = mainResult.modalInfo.translation;

                        } else {
                            for (let i = 0; i < mainTokens.length; i++) {

                                if (lower === "will" || lower === "would") { modalEndForm = isWillStart ? "ꤕꤢ꤭ꤟꤟꤢꤧ꤭" : "ꤕꤢ꤭"; break; }
                                if (isDoStart && (lower === "do" || lower === "does" || lower === "did")) { modalEndForm = "ꤟꤟꤢꤧ꤭"; break; }
                            }
                        }

                        let result = mainResult.text;
                        if (modalEndForm) {
                            result = (result ? result + " " : "") + modalEndForm;
                        }
                        if (isShouldStart) {
                            result = (result ? result + " " : "") + "ꤟꤟꤢꤧ꤭";
                        }
                        if (result.length > 0) {
                            result += " " + "ꤗꤟꤢꤩ꤬ꤒꤢꤩ꤭ꤚꤢꤪ";
                        } else {
                            result = "ꤗꤟꤢꤩ꤬ꤒꤢꤩ꤭ꤚꤢꤪ";

                        // will/can in because-clause at end of that clause
                        let becauseText = becauseResult.text;
                        if (becauseResult.modalInfo) {
                            let mf = becauseResult.modalInfo.translation;
                            if (becauseResult.modalInfo.type === "will" || becauseResult.modalInfo.type === "would") mf = "ꤕꤢ꤭";
                            else if (becauseResult.modalInfo.type === "may") mf = "ꤢ꤬ꤔꤟꤤꤏꤢꤜꤟꤢꤩ";
                            else if (becauseResult.modalInfo.type === "can" || becauseResult.modalInfo.type === "could") mf = "ꤢ꤬ꤔꤟꤤꤕꤚꤢꤧ";
                            becauseText = (becauseText ? becauseText + " " : "") + mf;
                        } else {
                            for (let bi = 0; bi < becauseTokens.length; bi++) {
                                const bl = becauseTokens[bi].toLowerCase().replace(/[.,;!?]+$/, "");
                                if (bl === "will" || bl === "would") { becauseText = (becauseText ? becauseText + " " : "") + "ꤕꤢ꤭"; break; }

                            result += " " + becauseText;
                        }

                            if (trailingPunct === "?") result += "?";
                            else if (trailingPunct === "꤯") result += "꤯";
                            else if (trailingPunct === "!") result += "!";
                            else result += trailingPunct;
                        }
                        return result;
                    }

                    // Aren't/Weren't/Isn't/Wasn't SUBJECT … → SUBJECT … ꤒꤥ꤬ꤟꤟꤢꤧ꤭
                    // Aren't you going? → you going ꤒꤥ꤬ꤟꤟꤢꤧ꤭
                    // Isn't she eating food → she eating food ꤒꤥ꤬ꤟꤟꤢꤧ꤭
                    // Mid-sentence "aren't" stays regular ꤒꤥ꤬ (via negativeWords)
                    {
                        const negBeStarts = new Set(["aren't", "weren't", "isn't", "wasn't"]);
                        const t0neg = tokens[0].toLowerCase().replace(/[.,;!?]+$/, "");
                        if (negBeStarts.has(t0neg)) {
                            let remainingTokens = tokens.slice(1);
                            const subjSet = new Set(["i","you","we","they","he","she","it"]);
                            let splitAt = remainingTokens.length;
                            let seenSubj = false;
                            let seenMain = false;
                            for (let i = 0; i < remainingTokens.length; i++) {
                                const tl = remainingTokens[i].toLowerCase().replace(/[.,;!?]+$/, "");
                                if (!seenSubj && subjSet.has(tl)) { seenSubj = true; continue; }
                                if (seenSubj && !seenMain) {
                                    if (isAdjective(remainingTokens[i]) || adjectiveMap.has(tl) || isActionVerb(remainingTokens[i]) || isPastParticiple(remainingTokens[i]) ||
                                        tl.endsWith("ing") || tl === "going" || tl === "sure" || tl === "ready" || tl === "late") {
                                        seenMain = true;
                                        for (let j = i + 1; j < remainingTokens.length; j++) {

                            let headRes = translatePhrase(head, true, false, false, hasModalBeforeConjunction, modalType, false, null, null);
                            let finalResult = headRes.text || "";
                            // strip any leaked negation from head (ain't/not/etc.)
                            finalResult = finalResult.split(" ").filter(w => {
                                const b = w.replace(/[.,;!?꤯]+$/, "");
                                return b !== "ꤒꤥ꤬" && b !== "ꤥ꤬ꤒꤥ꤬" && b !== "ꤒꤢꤧ꤭ꤗꤟꤢꤩ";
                            }).join(" ").replace(/\s+/g, " ").trim();
                            finalResult = (finalResult ? finalResult + " " : "") + "ꤒꤥ꤬ꤟꤟꤢꤧ꤭";
                            if (tail.length > 0) {
                                let tailRes = translatePhrase(tail, false, false, false, false, null, false, null, null);
                                let tailText = appendModalFromResult(tailRes.text || "", tailRes, tail);
                                if (tailText) finalResult += " " + tailText;
                            }
                            finalResult = finalResult.replace(/\s+/g, " ").trim();
                            if (trailingPunct) {
                                if (trailingPunct === "?") finalResult += "?";
                                else if (trailingPunct === "꤯") finalResult += "꤯";
                                else if (trailingPunct === "!") finalResult += "!";
                                else finalResult += trailingPunct;
                            }
                            return reorderWhBeforeTimeConj(finalResult);
                        }
                    }

                    if (isToBeQuestion) {
                        // Are/Is/Was/Were/Am SUBJECT … → SUBJECT … ꤟꤟꤢꤧ꤭
                        // after main verb or adjective (not ꤥ꤬ꤟꤟꤢꤧ꤭)
                        // Are you sure you going… → you sure ꤟꤟꤢꤧ꤭ you going…
                        // Are you going now → you going now ꤟꤟꤢꤧ꤭
                        let remainingTokens = tokens.slice(1);
                        const subjSet = new Set(["i","you","we","they","he","she","it"]);
                        let splitAt = remainingTokens.length; // default: marker at end
                        let seenSubj = false;
                        let seenMain = false;
                        for (let i = 0; i < remainingTokens.length; i++) {
                            const tl = remainingTokens[i].toLowerCase().replace(/[.,;!?]+$/, "");
                            if (!seenSubj && subjSet.has(tl)) { seenSubj = true; continue; }
                            if (seenSubj && !seenMain) {
                                if (isAdjective(remainingTokens[i]) || adjectiveMap.has(tl) || isActionVerb(remainingTokens[i]) || isPastParticiple(remainingTokens[i]) ||
                                    tl.endsWith("ing") || tl === "going" || tl === "sure" || tl === "ready" || tl === "late") {
                                    seenMain = true;
                                    // if another subject follows, split after this main word
                                    for (let j = i + 1; j < remainingTokens.length; j++) {
                                        const jl = remainingTokens[j].toLowerCase().replace(/[.,;!?]+$/, "");
                                        if (subjSet.has(jl)) { splitAt = i + 1; break; }
                                    }
                                    if (splitAt === remainingTokens.length) {
                                        // no second clause — marker after whole (end)
                                        splitAt = remainingTokens.length;
                                    }
                                    break;
                                }
                            }
                        }
                        let head = remainingTokens.slice(0, splitAt);
                        let tail = remainingTokens.slice(splitAt);
                        let headRes = translatePhrase(head, true, false, isImperative, hasModalBeforeConjunction, modalType, false, null, null);
                        let finalResult = headRes.text || "";
                        finalResult = (finalResult ? finalResult + " " : "") + "ꤟꤟꤢꤧ꤭";
                        if (tail.length > 0) {
                            let tailRes = translatePhrase(tail, false, false, false, false, null, false, null, null);
                            let tailText = appendModalFromResult(tailRes.text || "", tailRes, tail);
                            if (tailText) finalResult += " " + tailText;
                        }

                        if (trailingPunct) {

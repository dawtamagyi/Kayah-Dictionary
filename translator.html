<!DOCTYPE html>
<html lang="en">
<head>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kay+Pho+Du:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            font-family: "Kay Pho Du", serif;
        }
        body {
            background: #FFC0CB;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1.5rem;
            font-family: "Kay Pho Du", serif;
            font-weight: 400;
        }
        .card {
            max-width: 960px;
            width: 100%;
            background: white;
            padding: 2.2rem 2rem;
            border-radius: 40px;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.08);
            border: 1px solid #f0f0f0;
        }
        .grid {
            display: flex;
            flex-direction: column;
            gap: 1.8rem;
        }
        .pair {
            display: flex;
            flex-wrap: wrap;
            gap: 1.2rem;
        }
        .pair > div {
            flex: 1 1 220px;
            min-width: 180px;
        }
        textarea,
        .output-box {
            width: 100%;
            padding: 1rem 1.2rem;
            font-size: 1.2rem;
            border-radius: 28px;
            border: 1px solid #e0e0e0;
            background: white;
            box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.02);
            transition: 0.15s;
            line-height: 1.6;
            min-height: 120px;
            resize: vertical;
            font-family: "Kay Pho Du", serif;
            font-weight: 400;
        }
        textarea:focus {
            outline: 2px solid #b0b0b0;
            border-color: transparent;
            background: #ffffff;
        }
        .output-box {
            background: #fafafa;
            color: #1f1a14;
            white-space: pre-wrap;
            word-break: break-word;
            border: 1px solid #e0e0e0;
            overflow-y: auto;
            font-family: "Kay Pho Du", serif;
            font-weight: 400;
        }
        h1 {
            font-family: "Kay Pho Du", serif;
            font-weight: 700;
        }
        label {
            font-family: "Kay Pho Du", serif;
            font-weight: 600;
        }
        .kay-pho-du-regular {
            font-family: "Kay Pho Du", serif;
            font-weight: 400;
            font-style: normal;
        }
        .kay-pho-du-medium {
            font-family: "Kay Pho Du", serif;
            font-weight: 500;
            font-style: normal;
        }
        .kay-pho-du-semibold {
            font-family: "Kay Pho Du", serif;
            font-weight: 600;
            font-style: normal;
        }
        .kay-pho-du-bold {
            font-family: "Kay Pho Du", serif;
            font-weight: 700;
            font-style: normal;
        }
        .field-label-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.5rem;
            margin: 0 0 0.4rem 0.3rem;
        }
        .field-label-row label {
            margin: 0;
            font-size: 0.95rem;
            color: #444;
            font-weight: 600;
        }
        .field-actions {
            display: flex;
            align-items: center;
            gap: 0.35rem;
        }
        .icon-btn {
            appearance: none;
            border: 1px solid #e0e0e0;
            background: #fff;
            color: #444;
            border-radius: 999px;
            width: 1.4rem;
            height: 1.4rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 0.7rem;
            line-height: 1;
            box-shadow: 0 1px 2px rgba(0,0,0,0.06);
            transition: background 0.15s, border-color 0.15s, transform 0.1s;
            padding: 0;
        }
        .icon-btn:hover {
            background: #f5f5f5;
            border-color: #ccc;
        }
        .icon-btn:active {
            transform: scale(0.96);
        }
        .icon-btn[hidden] {
            display: none !important;
        }
        .icon-btn.copied {
            background: #e8f5e9;
            border-color: #a5d6a7;
            color: #2e7d32;
        }
        @media (max-width: 500px) {
            .card {
                padding: 1.5rem;
            }
        }
    </style>
</head>

                    .replace(/\s+/g, " ")
                    .trim();
                const tokens = [];
                const words = prepared.split(/\s+/).filter(w => w.length > 0);
                let i = 0;
                while (i < words.length) {
                    const rawWord = words[i];
                    // Pure punctuation token
                    // pure double-quote / sentence punct only (keep apostrophe words intact)
                    if (/^[.,;:!?“”"]+$/.test(rawWord)) {
                        tokens.push(rawWord);
                        i++;
                        continue;
                    }
                    const lowerWord = rawWord.toLowerCase().replace(/[.,;:!?“”"]+/g, "");
                    if (lowerWord === "a" || lowerWord === "an") {
                        // Keep "a/an" when part of "have a" / "has a" / "had a"
                        if (tokens.length > 0) {
                            const prev = String(tokens[tokens.length - 1]).toLowerCase().replace(/[.,;!?]+$/, "");
                            if (prev === "have" || prev === "has" || prev === "had") {
                                tokens[tokens.length - 1] = prev + " a";
                                i++;
                                continue;
                            }
                        }
                        i++;
                        continue;
                    }
                    let matched = false;
                    for (let n = 4; n >= 2; n--) {
                        if (i + n <= words.length) {
                            // stop if any part is pure punct
                            let ok = true;
                            const parts = [];
                            for (let k = 0; k < n; k++) {
                                if (/^[.,;:!?“”"‘’']+$/.test(words[i + k])) { ok = false; break; }
                                parts.push(words[i + k].replace(/[.,;:!?“”"]+/g, ""));
                            }
                            if (!ok) continue;
                            const phrase = parts.join(" ");
                            if (dict.has(phrase.toLowerCase())) {
                                tokens.push(phrase);
                                i += n;
                                matched = true;
                                break;
                            }
                        }
                    }
                    if (!matched) {
                        // strip any leftover punct on the word itself
                        const core = rawWord.replace(/^[.,;:!?“”"]+/, "").replace(/[.,;:!?“”"]+$/, "");
                        if (core) tokens.push(core);
                        i++;
                    }
                }
                return tokens.filter(t => t && t.length > 0);
            }

            function isNegativeWord(token) {
                const lower = token.toLowerCase().replace(/[.,;!?]+$/, "");
                return negativeWords.has(lower);
            }

            function getNegativeTranslation(token) {
                const lower = token.toLowerCase().replace(/[.,;!?]+$/, "");
                return negativeTranslations.get(lower) || "ꤒꤥ꤬";
            }

            function isAdjective(token) {
                const lower = token.toLowerCase().replace(/[.,;!?]+$/, "");
                return adjectiveMap.has(lower);
            }

            function isModalAtEnd(token) {
                const lower = token.toLowerCase().replace(/[.,;!?]+$/, "");
                return modalVerbsAtEnd.has(lower);
            }

            function getModalTranslation(token) {
                const lower = token.toLowerCase().replace(/[.,;!?]+$/, "");
                return modalTranslations.get(lower) || null;
            }

            function isTimeConjunction(token) {
                const lower = token.toLowerCase().replace(/[.,;!?]+$/, "");
                return timeConjunctions.has(lower);
            }

            function isToBeVerb(token) {
                const lower = token.toLowerCase().replace(/[.,;!?]+$/, "");
                return lower === "am" || lower === "is" || lower === "are" || lower === "was" || lower === "were" || lower ===
                    "be";
            }

            function isToBeQuestionStart(token) {
                const lower = token.toLowerCase().replace(/[.,;!?]+$/, "");
                return toBeQuestionVerbs.has(lower);
            }

            function isPrepositionAfter(token) {
                const lower = token.toLowerCase().replace(/[.,;!?]+$/, "");
                return prepositionsAfter.has(lower);
            }

            // Only these prepositions move to end of clause in Kayah Li:
            // in, on, under, across, over, after, before, during, since, for,
            // in front of, instead of, next to
            const endPlacementPreps = new Set([
                "in", "on", "under", "across", "over", "after", "before",
                "during", "since", "in front of", "instead of", "next to"
                // "for" is special: after its object NP (NOUN+NOUN+ADJ), before subordinates
            ]);
            const multiWordPreps = [
                "in front of", "instead of", "next to"
            ];
            function matchMultiWordPrep(tokens, i) {
                for (const mw of multiWordPreps) {
                    const parts = mw.split(" ");
                    if (i + parts.length <= tokens.length) {
                        let ok = true;
                        for (let k = 0; k < parts.length; k++) {
                            const tl = tokens[i + k].toLowerCase().replace(/[.,;!?]+$/, "");
                            if (tl !== parts[k]) { ok = false; break; }
                        }
                        if (ok) return { phrase: mw, len: parts.length, trans: prepositionsAfter.get(mw) || dict.get(mw) };
                    }
                }
                return null;
            }

            function getPrepositionTranslation(token) {
                const lower = token.toLowerCase().replace(/[.,;!?]+$/, "");
                return prepositionsAfter.get(lower) || null;
            }

            function isHaveVerb(token) {
                const lower = token.toLowerCase().replace(/[.,;!?]+$/, "");
                return lower === "have" || lower === "has" || lower === "had";
            }

            function isPastParticiple(token) {
                const lower = token.toLowerCase().replace(/[.,;!?]+$/, "");
                return pastParticipleWords.has(lower);
            }

            function isArticle(token) {
                const lower = token.toLowerCase().replace(/[.,;!?]+$/, "");
                return lower === "a" || lower === "an";
            }

            function isSubject(token) {
                const lower = token.toLowerCase().replace(/[.,;!?]+$/, "");
                return lower === "i" || lower === "he" || lower === "she" || lower === "we" || lower === "they" || lower ===
                    "you" || lower === "it";
            }

            function isStillWord(token) {
                const lower = token.toLowerCase().replace(/[.,;!?]+$/, "");
                return lower === "still";
            }

            function isActionVerb(token) {
                const lower = token.toLowerCase().replace(/[.,;!?]+$/, "");
                return actionVerbs.has(lower);
            }

            function isGoingToPhrase(tokens, index) {
                if (index + 1 < tokens.length) {
                    const current = tokens[index].toLowerCase().replace(/[.,;!?]+$/, "");
                    const next = tokens[index + 1].toLowerCase().replace(/[.,;!?]+$/, "");
                    if (current === "going" && next === "to") {
                        return true;
                    }
                    if (current === "about" && next === "to") {
                        return true;
                    }
                }
                return false;
            }

            function isWantToPhrase(tokens, index) {
                if (index + 1 < tokens.length) {
                    const current = tokens[index].toLowerCase().replace(/[.,;!?]+$/, "");
                    const next = tokens[index + 1].toLowerCase().replace(/[.,;!?]+$/, "");
                    // want/wanting to, need/needing to, love/loving to (no fixed phrases)
                    if ((current === "want" || current === "wanting") && next === "to") {
                        return true;
                    }
                    if (index + 2 < tokens.length) {
                        const next2 = tokens[index + 2].toLowerCase().replace(/[.,;!?]+$/, "");
                        if (current === "would" && next === "like" && next2 === "to") {
                            return true;
                        }
                    }
                    if ((current === "need" || current === "needing") && next === "to") {
                        return true;
                    }
                    if ((current === "love" || current === "loving") && next === "to") {
                        return true;
                    }
                }
                return false;
            }

            function isNoun(token) {
                const lower = token.toLowerCase().replace(/[.,;!?]+$/, "");
                // Adjectives, WH words, subjects, modals, conjunctions are never nouns
                if (adjectiveMap.has(lower)) {
                    return false;
                }
                // demonstratives / relative that — not nouns (prevents kind family that → family that kind)
                if (lower === "that" || lower === "this" || lower === "these" || lower === "those") {
                    return false;
                }
                // time adverbs are not nouns (late tomorrow must not become tomorrow late)
                if (lower === "tomorrow" || lower === "yesterday" || lower === "today" || lower === "tonight" || lower === "later") {
                    return false;
                }
                if (whQuestionWords.has(lower) || lower === "whose" || lower === "what" || lower === "who" || lower === "when" || lower === "where" || lower === "why" || lower === "how" || lower === "which") {
                    return false;
                }
                if (isSubject(token) || isModalAtEnd(token) || isToBeVerb(token) || isNegativeWord(token)) {
                    return false;
                }
                // conjunctions / connectors — not nouns
                if (["and", "or", "but", "so", "yet", "nor", "because", "if", "than", "as", "while", "although", "though", "unless", "whether"].includes(lower)) {
                    return false;
                }
                // prepositions — not nouns (fixes "this for you" treating for as noun)
                if (["for", "to", "from", "with", "without", "about", "of", "at", "by", "in", "on", "under", "over", "into", "onto", "near", "after", "before", "during", "since", "until", "till", "across", "around", "through", "toward", "towards"].includes(lower)) {
                    return false;
                }
                if (dict.has(lower)) {
                    const val = dict.get(lower);
                    if (val && val !== "HAVE_PLACEHOLDER" && val !== "DONE_PLACEHOLDER" && val !== "STILL_PLACEHOLDER" && val !== "GOING_TO_PLACEHOLDER" && val !== "TO_PLACEHOLDER" && val !== "WHEN_PLACEHOLDER" && !val.includes("|")) {
                        if (actionVerbs.has(lower) || pastParticipleWords.has(lower)) {
                            return false;
                        }
                        if (lower.endsWith("s") && lower.length > 2) {
                            const base = lower.slice(0, -1);
                            if (actionVerbs.has(base)) return false;
                        }
                        if (lower.endsWith("ed") && lower.length > 3) {
                            const base = lower.slice(0, -2);
                            if (actionVerbs.has(base) || actionVerbs.has(base + "e")) return false;
                        }
                        if (lower.endsWith("ing") && lower.length > 4) {
                            const base = lower.slice(0, -3);
                            if (actionVerbs.has(base) || actionVerbs.has(base + "e")) return false;
                        }
                        return true;
                    }
                }
                const commonNouns = ["school", "home", "work", "church", "hotel", "box", "table", "water", "book", "name", "house", "day", "meeting", "train", "committee", "storm", "teacher", "homework", "girl", "leader", "doors", "seats", "food", "room", "ticket", "tickets", "plane", "bus", "night", "rain", "screenshot", "money", "country", "books", "girlfriend", "girlfriends", "idea", "monday", "tuesday", "wednesday", "thursday", "friday", "saturday", "sunday"];
                if (commonNouns.includes(lower)) {
                    return true;
                }
                return false;
            }

            function getSubjectTranslation(token) {
                const lower = token.toLowerCase().replace(/[.,;!?]+$/, "");
                if (lower === "i") return "ꤠꤢ꤭";
                if (lower === "he" || lower === "she" || lower === "it") return "ꤢꤧ꤬";
                if (lower === "we") return "ꤕꤟꤢꤧ꤬";
                if (lower === "they") return "ꤢꤧ꤬ꤞꤤ꤭";
                if (lower === "you") return "ꤔꤟꤢꤧ꤬";
                return null;
            }

            function isHaveAsAuxiliary(tokens, haveIndex) {
                if (haveIndex + 1 < tokens.length) {
                    const nextToken = tokens[haveIndex + 1];
                    if (isPastParticiple(nextToken)) {
                        return true;
                    }
                    if (nextToken.toLowerCase() === "been" && haveIndex + 2 < tokens.length) {
                        return true;
                    }
                }
                return false;
            }

            function isHaveAsMainVerb(tokens, haveIndex) {
                if (haveIndex + 1 < tokens.length) {
                    const nextToken = tokens[haveIndex + 1];
                    if (isNoun(nextToken)) {
                        return true;
                    }
                    if (isArticle(nextToken) && haveIndex + 2 < tokens.length) {
                        if (isNoun(tokens[haveIndex + 2])) {
                            return true;
                        }
                    }
                }
                return false;
            }

            function isWhWord(token) {
                const lower = token.toLowerCase().replace(/[.,;!?]+$/, "");
                return whQuestionWords.has(lower);
            }

            // --------------------------------------------------------------
            //  Get translation for a word
            // --------------------------------------------------------------
            function getWordTranslation(word) {
                const lower = word.toLowerCase().replace(/[.,;!?]+$/, "");
                if (dict.has(lower)) {
                    const val = dict.get(lower);
                    if (val && val.includes("|")) {
                        const parts = val.split("|");
                        const first = parts[0].split("_");
                        return first[1] || val;
                    }
                    if (val === "HAVE_PLACEHOLDER") {
                        return null;
                    }
                    if (val === "BEEN_PLACEHOLDER") {
                        return null; // shown via Have… ꤥ꤬ꤓꤌꤣ꤭ at end
                    }
                    if (val === "MUST_NOT_PLACEHOLDER") {
                        return null;
                    }
                    if (val === "DONE_PLACEHOLDER") {
                        return "ꤗꤟꤢꤩ꤬ꤓꤌꤣ꤭ꤟꤢꤪ";
                    }
                    if (val === "STILL_PLACEHOLDER") {
                        return null;
                    }
                    if (val === "GOING_TO_PLACEHOLDER") {
                        return null;
                    }
                    if (val === "TO_PLACEHOLDER") {
                        return null;
                    }
                    if (val === "WHEN_PLACEHOLDER") {
                        return null;
                    }
                    return val;
                }
                if (adjectiveMap.has(lower)) return adjectiveMap.get(lower);
                if (prepositionsAfter.has(lower)) return prepositionsAfter.get(lower);
                if (modalTranslations.has(lower)) return modalTranslations.get(lower);
                return word;
            }

            function getTranslation(word) {
                const lower = word.toLowerCase().replace(/[.,;!?]+$/, "");
                if (dict.has(lower)) {
                    const val = dict.get(lower);
                    if (val && val.includes("|")) {
                        const parts = val.split("|");
                        const first = parts[0].split("_");
                        return first[1] || val;
                    }
                    if (val === "HAVE_PLACEHOLDER") {
                        return null;
                    }
                    if (val === "DONE_PLACEHOLDER") {
                        return "ꤗꤟꤢꤩ꤬ꤓꤌꤣ꤭ꤟꤢꤪ";
                    }
                    if (val === "STILL_PLACEHOLDER") {
                        return null;
                    }
                    if (val === "GOING_TO_PLACEHOLDER") {
                        return null;
                    }
                    if (val === "TO_PLACEHOLDER") {
                        return null;
                    }
                    if (val === "WHEN_PLACEHOLDER") {
                        return null;
                    }
                    return val;
                }
                if (adjectiveMap.has(lower)) return adjectiveMap.get(lower);
                if (prepositionsAfter.has(lower)) return prepositionsAfter.get(lower);
                if (modalTranslations.has(lower)) return modalTranslations.get(lower);
                return word;
            }

            // --------------------------------------------------------------
            //  Translate phrase - Main translation logic
            // --------------------------------------------------------------



            // Move clause-final WH (what/how/…) to just before time-conjunction at end
            // e.g. need we leave before what → need what we leave before
            function reorderWhBeforeTimeConj(text) {
                if (!text) return text;
                const whForms = ["ꤒꤤ꤭ꤒꤢꤩ꤭", "ꤖꤢꤨꤒꤢꤩ꤭", "ꤙꤤꤒꤢꤩ꤭", "ꤢ꤬ꤗꤟꤢꤩ꤬ꤒꤢꤩ꤭", "ꤒꤣ꤬ꤊꤟꤊꤣ꤬ꤒꤢꤩ꤭"];
                const conjForms = ["ꤟꤤꤒꤥ꤬ꤢ꤬ꤋꤢꤧ꤭", "ꤓꤌꤣ꤭ꤘꤣꤋꤛꤢꤩ꤭", "ꤢ꤬ꤋꤢꤧ꤭", "ꤒꤢ꤬ꤘꤢꤦ꤬ꤒꤟꤌꤣ", "ꤔꤌꤣ꤬ꤕꤢ꤭", "ꤒꤥ꤬ꤟꤢꤩꤗꤢ꤬", "ꤗꤟꤢꤩ꤬ꤒꤢꤩ꤭ꤚꤢꤪ"];
                let words = text.split(/\s+/).filter(w => w.length > 0);
                // if last content word is WH and some conj appears before it, move WH before conj and its clause
                // Find last WH
                let whIdx = -1;
                for (let i = words.length - 1; i >= 0; i--) {
                    const bare = words[i].replace(/[.,;!?꤯]+$/, "");
                    if (whForms.includes(bare)) { whIdx = i; break; }
                }
                if (whIdx < 0) return text;
                // Find last conj before WH
                let conjIdx = -1;
                for (let i = whIdx - 1; i >= 0; i--) {
                    const bare = words[i].replace(/[.,;!?꤯]+$/, "");
                    if (conjForms.includes(bare)) { conjIdx = i; break; }
                }
                if (conjIdx < 0) return text;
                // Move WH to just before the subordinate clause start:
                // subordinate starts after main — find first subject-like word after a verb before conj?
                // Simpler: put WH immediately before conjIdx's preceding subject chain
                // User order: you need what | we leave before
                // So WH should sit right before the sub subject (we)
                // Find start of sub: walk left from conjIdx-1 while not hitting a "main-looking" boundary
                // Put WH at conjIdx (before conj), and sub subject words stay before conj
                // Current: need we leave before what
                // Target: need what we leave before
                // So insert WH at position of first word of sub clause (word after main verb objects)
                // Heuristic: move WH to index conjIdx - (sub length). Sub = words from some point to conjIdx-1.
                // Put WH right before sub start. Sub start ≈ first pronoun/subject before conj going left until verb/object of main ends.
                // Simplest heuristic matching user example: place WH immediately before the word sequence ending at conjIdx-1 that starts with a subject pronoun
                const subj = new Set(["ꤠꤢ꤭", "ꤢꤧ꤬", "ꤕꤟꤢꤧ꤬", "ꤢꤧ꤬ꤞꤤ꤭", "ꤔꤟꤢꤧ꤬"]);
                let subStart = conjIdx;
                for (let i = conjIdx - 1; i >= 0; i--) {
                    if (subj.has(words[i].replace(/[.,;!?꤯]+$/, ""))) {
                        subStart = i;
                    } else if (subStart < conjIdx) {
                        break;
                    }
                }
                if (subStart >= conjIdx) return text;
                const whWord = words[whIdx];
                words.splice(whIdx, 1);
                // adjust subStart if we removed after it
                if (whIdx < subStart) subStart -= 1;
                words.splice(subStart, 0, whWord);
                return words.join(" ");
            }


            // Append will/can/could/would short form from translatePhrase result
            function appendModalFromResult(text, phraseResult, tokensForScan) {
                let out = text || "";
                let form = null;
                if (phraseResult && phraseResult.modalInfo) {
                    const t = phraseResult.modalInfo.type;
                    if (t === "will" || t === "would") form = "ꤕꤢ꤭";
                    else if (t === "may") form = "ꤢ꤬ꤔꤟꤤꤏꤢꤜꤟꤢꤩ";
                    else if (t === "can" || t === "could") form = "ꤢ꤬ꤔꤟꤤꤕꤚꤢꤧ";
                    else if (phraseResult.modalInfo.translation) form = phraseResult.modalInfo.translation;
                }
                if (!form && tokensForScan) {
                    for (let i = 0; i < tokensForScan.length; i++) {
                        const tl = tokensForScan[i].toLowerCase().replace(/[.,;!?]+$/, "");
                        if (tl === "will" || tl === "would") { form = "ꤕꤢ꤭"; break; }
                        if (tl === "may") { form = "ꤢ꤬ꤔꤟꤤꤏꤢꤜꤟꤢꤩ"; break; }
                        if (tl === "can" || tl === "could") { form = "ꤢ꤬ꤔꤟꤤꤕꤚꤢꤧ"; break; }
                    }
                }
                if (form && !(out || "").includes(form)) {
                    out = (out ? out + " " : "") + form;
                }
                return out;
            }

            // Strip leading WH phrases from mainTokens so they go at end of main clause
            // (before subordinate after/before/when/…)
            function extractLeadingWhCan(tokens) {
                const whMap = {
                    "what can": "ꤒꤤ꤭ꤒꤢꤩ꤭ꤢ꤬ꤔꤟꤤꤟꤟꤢꤧ꤭",
                    "when can": "ꤙꤤꤋꤢꤧ꤭ꤒꤢꤩ꤭ꤢ꤬ꤔꤟꤤꤟꤟꤢꤧ꤭",
                    "how can": "ꤖꤢꤨꤒꤢꤩ꤭ꤢ꤬ꤔꤟꤤꤟꤟꤢꤧ꤭",
                    "where can": "ꤙꤤꤒꤢꤩ꤭ꤢ꤬ꤔꤟꤤꤟꤟꤢꤧ꤭",
                    "which can": "ꤒꤣ꤬ꤊꤟꤊꤣ꤬ꤒꤢꤩ꤭ꤢ꤬ꤔꤟꤤꤟꤟꤢꤧ꤭",
                    "who can": "ꤢꤨ꤭ꤕꤢꤩ꤭ꤢ꤬ꤔꤟꤤꤟꤟꤢꤧ꤭",
                    "who will": "ꤕꤢ꤭ꤗꤢ꤬ꤢꤨ꤭ꤕꤢꤩ꤭",
                    "who would": "ꤕꤢ꤭ꤗꤢ꤬ꤢꤨ꤭ꤕꤢꤩ꤭",
                                        "when will": "ꤕꤢ꤭ꤙꤤꤋꤢꤧ꤭ꤒꤢꤩ꤭",
                    "where will": "ꤙꤤꤒꤢꤩ꤭ꤕꤢ꤭ꤟꤟꤢꤧ꤭",
                    "how will": "ꤗꤟꤢꤩ꤬ꤕꤢ꤭ꤖꤢꤨꤒꤢꤩ꤭"
                };
                if (!tokens || tokens.length < 1) return { tokens: tokens, phrase: null };
                // two-token phrase
                if (tokens.length >= 2) {
                    const two = (tokens[0] + " " + tokens[1]).toLowerCase().replace(/[.,;!?]+$/g, "");
                    if (whMap[two]) {
                        return { tokens: tokens.slice(2), phrase: whMap[two] };
                    }
                }
                // tokenizer may merge "who will" / "what can" as one token
                const one = tokens[0].toLowerCase().replace(/[.,;!?]+$/g, "");
                if (whMap[one]) {
                    return { tokens: tokens.slice(1), phrase: whMap[one] };
                }
                return { tokens: tokens, phrase: null };
            }

            function translatePhrase(tokens, isQuestion, isHaveStart, isImperative, isModalBeforeConjunction, modalType, isWhNounQuestion, whNounWord, whNounSubject) {
                const everWordsAtEnd = new Set(["whatever", "whoever", "whomever", "whichever"]);

                // Split at whatever/whoever/… so will attaches to end of MAIN clause only
                // e.g. I will tell her whatever you need
                // → [I tell her] + ꤕꤢ꤭ + [you need] + whatever
                let everIdx = -1;
                let everKey = null;
                for (let i = 0; i < tokens.length; i++) {
                    const tl = tokens[i].toLowerCase().replace(/[.,;!?]+$/, "");
                    if (everWordsAtEnd.has(tl)) {
                        everIdx = i;
                        everKey = tl;
                        break;
                    }
                }
                if (everIdx >= 0 && !isWhNounQuestion) {
                    const mainTokens = tokens.slice(0, everIdx);
                    const subTokens = tokens.slice(everIdx + 1);
                    const everTrans = getWordTranslation(everKey) || dict.get(everKey) || everKey;

                    // Translate main (picks up will as modalInfo)
                    const mainRes = translatePhrase(mainTokens, isQuestion, isHaveStart, isImperative, isModalBeforeConjunction, modalType, false, null, null);
                    // Translate subordinate clause (no question/modal-at-end)
                    const subRes = translatePhrase(subTokens, false, false, false, false, null, false, null, null);

                    let modalEndForm = null;

                        if (bare === "pm" || lower === "p.m" || lower === "p.m.") {

                            continue;

                    }

                    // Frequency adverbs — fixed Kayah position regardless of English position
                    // Front: always, almost always, usually, normally, generally, sometimes, occasionally, seldom, rarely, hardly ever
                    // After main verb: often, frequently
                    {

                            "always": "ꤕꤝꤟꤥ꤭ꤖꤟꤌꤣ",
                            "almost always": "ꤕꤝꤟꤥ꤭ꤖꤟꤌꤣ",
                            "usually": "ꤢꤧꤒꤢ꤬ꤊꤤ꤬",
                            "normally": "ꤢꤧꤒꤢ꤬ꤊꤤ꤬",
                            "generally": "ꤢꤧꤒꤢ꤬ꤊꤤ꤬",
                            "sometimes": "ꤒꤢ꤬ꤖꤟꤌꤣꤒꤢ꤬ꤋꤛꤢ꤬",

                        // multi-word first

                            }
                            if (freqAfter[two]) {

                                continue;
                            }

                        if (freqFront[lower]) {
                            freqFrontTrans = freqFront[lower];
                            continue;
                        }
                        if (freqAfter[lower]) {
                            freqAfterVerbTrans = freqAfter[lower];
                            continue;

                    // Mid-clause never → ꤒꤢ꤬ꤖꤟꤌꤣꤒꤥ꤬

                            while (j < tokens.length) {

                            while (j < tokens.length) {

                            // collect remaining place words

                                if (!tl || ["and","but","or","because"].includes(tl)) break;
                                if (tl === "a" || tl === "an" || tl === "the") { j++; continue; }

                    for (let wi = 0; wi < cleaned.length; wi++) {
                        const bare = cleaned[wi].replace(/[.,;!?꤯]+$/, "");
                        if (howForms.has(bare) || afterNever.has(bare)) { ins = wi; break; }
                    }
                    const out = cleaned.slice(0, ins);
                    out.push(neverTranslation);
                    // will often still in modalToken (not yet in result) — place after never before how
                    if (willTok) {
                        out.push(willTok);
                    } else if (modalToken) {
                        const ml = modalToken.toLowerCase().replace(/[.,;!?]+$/, "");
                        if (ml === "will" || ml === "would") {
                            out.push("ꤕꤢ꤭");
                            modalToken = null; // consumed so later modalInfo won't duplicate
                        }
                    }
                    out.push(...cleaned.slice(ins));
                    result = out.join(" ");
                }
                // sentence-final adverbial before (no subordinate)
                // e.g. I never ever eat this before → … never ꤢ꤬ꤚꤟꤢꤩꤋꤢꤧ꤭
                if (beforeAdverbEnd) {
                    result = (result ? result + " " : "") + beforeAdverbEnd;
                }

                // Modal (will/can/should) on main clause before -ever words and before return
                // e.g. I will do whatever you want → … ꤕꤢ꤭ ꤒꤤ꤭… (will before whatever)
                let modalInfo = null;
                if (modalToken) {
                    const lowerModal = modalToken.toLowerCase();
                    const modalTrans = getModalTranslation(modalToken);
                    if (modalTrans) {
                        modalInfo = { type: lowerModal, translation: modalTrans, isQuestion: isQuestion };
                    }
                }

                // whatever / whoever / whomever / whichever → end of sentence
                // will/can/should goes right after the main verb:
                // e.g. I will do whatever you want
                // → ꤠꤢ꤭ ꤗꤟꤢꤩ꤬ ꤕꤢ꤭ ꤔꤟꤢꤧ꤬ ꤞꤢꤧꤐꤟꤢꤦ ꤒꤤ꤭…
                if (everWordTranslation) {
                    if (modalInfo && !isQuestion) {
                        const subjectForms = new Set(["ꤠꤢ꤭", "ꤢꤧ꤬", "ꤕꤟꤢꤧ꤬", "ꤢꤧ꤬ꤞꤤ꤭", "ꤔꤟꤢꤧ꤬"]);
                        const words = result.split(" ").filter(w => w.length > 0);
                        let inserted = false;
                        let newWords = [];
                        for (let wi = 0; wi < words.length; wi++) {
                            newWords.push(words[wi]);
                            // insert modal right after first non-subject (main verb)
                            if (!inserted && !subjectForms.has(words[wi])) {
                                newWords.push(modalInfo.translation);
                                inserted = true;
                            }
                        }
                        if (!inserted) newWords.push(modalInfo.translation);
                        result = newWords.join(" ");
                        modalInfo = null;
                        modalToken = null;
                    }
                    result = (result ? result + " " : "") + everWordTranslation;
                    result = reorderWhBeforeTimeConj(result);
                }

                // Dedupe will when never already placed will after never
                if (result && neverTranslation && result.includes(neverTranslation)) {
                    const parts = result.split(" ").filter(Boolean);
                    let seenWill = false;
                    const deduped = [];
                    for (const w of parts) {
                        if (w === "ꤕꤢ꤭" || w === "ꤕꤢ꤭ꤟꤟꤢꤧ꤭") {
                            if (seenWill) continue;
                            seenWill = true;
                        }
                        deduped.push(w);
                    }
                    result = deduped.join(" ");
                }

                // what/how second clause: place will after verb; end with ꤔꤌꤣ꤬
                {
                    const whatF = "ꤒꤤ꤭ꤒꤢꤩ꤭";
                    const howF = "ꤖꤢꤨꤒꤢꤩ꤭";
                    let parts = (result || "").split(" ").filter(Boolean);
                    const wi = parts.findIndex(w => w === whatF || w === howF);
                    if (wi >= 0) {
                        const isWhat = parts[wi] === whatF;
                        let willIdx = -1;
                        for (let i = wi + 1; i < parts.length; i++) {
                            if (parts[i] === "ꤕꤢ꤭" || parts[i] === "ꤕꤢ꤭ꤟꤟꤢꤧ꤭") { willIdx = i; break; }
                        }
                        // Pull will from modal if needed
                        if (willIdx < 0 && modalToken) {
                            const ml = modalToken.toLowerCase().replace(/[.,;!?]+$/, "");
                            if (ml === "will" || ml === "would") {
                                parts.push("ꤕꤢ꤭");
                                willIdx = parts.length - 1;
                                modalToken = null;
                                modalInfo = null;
                            }
                        }
                        if (willIdx >= 0) {
                            const will = parts[willIdx];
                            parts.splice(willIdx, 1);
                            if (isWhat) {
                                // what VERB will next → after first token after what
                                parts.splice(Math.min(wi + 2, parts.length), 0, will);
                            } else {
                                // how … will at end of how-clause (before ꤔꤌꤣ꤬)
                                parts.push(will);
                            }
                        }
                        if (!parts.includes("ꤔꤌꤣ꤬")) parts.push("ꤔꤌꤣ꤬");
                        result = parts.join(" ");
                    }
                }

                // will be here → be will here (ꤥ꤬ ꤕꤢ꤭ ꤙꤤꤛꤢꤩ꤭)
                if (result && result.includes("ꤥ꤬") && (result.includes("ꤙꤤꤛꤢꤩ꤭") || result.includes("ꤙꤤꤔꤌꤣ꤬"))) {
                    // if will marker exists somewhere, place after first ꤥ꤬ before here
                    let words = result.replace(/\s+/g, " ").trim().split(" ").filter(Boolean);
                    const willIdx = words.indexOf("ꤕꤢ꤭");
                    const beIdx = words.indexOf("ꤥ꤬");
                    let hereIdx = words.findIndex(w => w === "ꤙꤤꤛꤢꤩ꤭" || w === "ꤙꤤꤔꤌꤣ꤬");
                    if (beIdx >= 0 && hereIdx > beIdx) {
                        if (willIdx >= 0) {
                            words.splice(willIdx, 1);
                            words.splice(beIdx + 1, 0, "ꤕꤢ꤭");
                        }
                        // if will was stripped from sub, check original tokens via modalEndForm later — handle if missing:
                    }
                    result = words.join(" ");
                }

                // WH + to + VERB: I don't know what to do → I know don't to do what ꤔꤌꤣ꤬
                // Move ꤒꤥ꤬ after main verb (index 2 after subject+verb), before ꤊꤟꤢꤦ
                if (result && result.includes("ꤊꤟꤢꤦ") && result.includes("ꤔꤌꤣ꤬")) {
                    let words = result.replace(/\s+/g, " ").trim().split(" ").filter(Boolean);
                    const negForms = ["ꤒꤥ꤬"];
                    const toInf = "ꤊꤟꤢꤦ";
                    const toIdx = words.indexOf(toInf);
                    if (toIdx > 0) {
                        for (let ni = words.length - 1; ni >= 0; ni--) {
                            if (negForms.includes(words[ni]) && ni !== 2) {
                                const neg = words.splice(ni, 1)[0];
                                // after subject+verb
                                const ins = Math.min(2, toIdx);
                                words.splice(ins, 0, neg);
                                break;
                            }
                        }
                    }
                    result = words.join(" ");
                }

                // relative who clause → don't/neg before who-clause; end with ꤔꤌꤣ꤬
                // I don't know people who want to go → I know don't people who want to go ꤔꤌꤣ꤬
                if (relativeWhoClause && result) {
                    let words = result.replace(/\s+/g, " ").trim().split(" ").filter(Boolean);
                    const whoRel = "ꤕꤚꤟꤢꤧ꤬ꤘꤣ";
                    const negForms = ["ꤒꤥ꤬", "ꤒꤢꤧ꤭ꤗꤟꤢꤩ", "ꤒꤢꤧ꤭ꤗꤟꤢꤩ"];
                    const whoIdx = words.indexOf(whoRel);
                    if (whoIdx > 0) {
                        // move trailing/mid neg after main verb (index 1 typically), before people+who
                        // I know [don't] people who …
                        for (let ni = words.length - 1; ni >= 0; ni--) {
                            if (negForms.includes(words[ni])) {
                                const neg = words.splice(ni, 1)[0];
                                // insert after first verb-ish token (index 1 if present)
                                const insertAt = Math.min(2, words.length);
                                // prefer right after know (token 1)
                                words.splice(2, 0, neg); // after subject+verb (I know don’t …)
                                break;
                            }
                        }
                    }
                    if (!words.includes("ꤔꤌꤣ꤬")) words.push("ꤔꤌꤣ꤬");
                    result = words.join(" ");
                }

                return {
                    text: result,
                    hasNegation: hasNegation,
                    modalInfo: modalInfo,
                    toBeFound: toBeFound,
                    haveFound: haveFound,
                    haveTranslation: haveTranslation,
                    isHaveStart: isHaveStart || false,
                    nounTranslation: nounTranslation,
                    v3Translation: v3Translation,
                    isAuxiliaryHave: isAuxiliaryHave,
                    isMainVerbHave: isMainVerbHave,
                    isImperative: isImperative || false,
                    isDonStart: isDonStart || false
                };
            }

            // --------------------------------------------------------------
            //  Translate English → Kayah Li - Main function
            // --------------------------------------------------------------
            
            function dedupeWillAfterNever(s) {
                if (!s || !s.includes("ꤒꤢ꤬ꤖꤟꤌꤣ")) return s;
                const parts = s.split(" ").filter(Boolean);
                let seenWill = false;
                const out = [];
                for (const w of parts) {
                    const bare = w.replace(/[.,;!?꤯]+$/, "");
                    if (bare === "ꤕꤢ꤭" || bare === "ꤕꤢ꤭ꤟꤟꤢꤧ꤭") {
                        if (seenWill) continue;
                        seenWill = true;
                    }
                    out.push(w);
                }
                return out.join(" ");
            }


            // Tag / confirmation questions: "You go?" "Right?" → attach ꤟꤟꤢꤧ꤭ to last word
            // Skip when sentence already starts with WH / Do / Is / Aren't…
            function attachConfirmQuestionMarker(result, endsWithQuestion, firstToken) {
                if (!endsWithQuestion || !result) return result;
                const ft = (firstToken || "").toLowerCase().replace(/[.,;!?]+$/, "");
                const questionStarters = new Set([
                    "what", "who", "whose", "when", "where", "why", "which", "how",
                    "how many", "how much", "how about",
                    "do", "does", "did",
                    "is", "are", "was", "were", "am",
                    "isn't", "aren't", "wasn't", "weren't",
                    "can", "could", "will", "would", "may", "should", "shall",
                    "have", "has", "had", "haven't", "hasn't", "hadn't"
                ]);
                // also "where is", "what is", "how are", …
                if (questionStarters.has(ft)) return result;
                const ftFirst = ft.split(/\s+/)[0];
                if (questionStarters.has(ftFirst)) return result;
                if (result.includes("ꤟꤟꤢꤧ꤭")) return result;
                // Attach to last content word (strip trailing ? or punct first)
                let s = result.replace(/\s*[?？]+\s*$/, "").trim();
                if (!s) return result;
                const parts = s.split(" ").filter(Boolean);
                if (parts.length === 0) return result;
                const last = parts[parts.length - 1].replace(/[.,;:!?꤯]+$/, "");
                const punct = parts[parts.length - 1].slice(last.length);
                parts[parts.length - 1] = last + "ꤟꤟꤢꤧ꤭" + punct;
                return parts.join(" ");
            }

            function translateToKayah(text) {
                if (!text.trim()) return "";

                // Enter / newline → separate sentences (keep line breaks in output)
                if (/\r?\n/.test(text)) {
                    const lines = text.split(/\r?\n/);
                    return lines.map(function (line) {
                        if (!line.trim()) return "";
                        return translateToKayah(line);
                    }).join("\n");
                }

                // Translate content inside quotes: "I don't know" → "ꤠꤢ꤭ ꤞꤢꤧꤑꤢꤩ꤭ ꤒꤥ꤬"
                if (/["“”]/.test(text)) {
                    text = text.replace(/["“]([^"“”]+)["”]/g, function(_, inner) {
                        const innerTr = translateToKayah(inner.trim());
                        return '"' + innerTr + '"';
                    });
                    // If the whole string was only a quote, return as-is after inner translation
                    if (/^\s*"[^"]*"\s*[.!?]?\s*$/.test(text)) {
                        return text.trim();
                    }
                }

                const trimmed = text.trim();
                const lowerTrimmed = trimmed.toLowerCase();

                if (lowerTrimmed === "to") {
                    return "ꤘꤣ";
                }

                if (lowerTrimmed === "when") {
                    return "ꤙꤤꤋꤢꤧ꤭ꤒꤢꤩ꤭";
                }

                // Single-word lookup for conjunctions / prepositions that might be skipped in phrase logic
                if (!lowerTrimmed.includes(" ") && dict.has(lowerTrimmed)) {
                    const single = dict.get(lowerTrimmed);
                    if (single && !single.includes("PLACEHOLDER") && !single.includes("|")) {
                        // Prefer question form for lone WH words already handled above; otherwise return dict value
                        return single;
                    }
                }

                for (const key of exactPhraseKeys) {
                    if (lowerTrimmed === key) {
                        const result = dict.get(key);
                        if (result) return result;
                    }
                }

                if (trimmed.endsWith("?")) {
                    const base = trimmed.slice(0, -1).trim();
                    const lowerBase = base.toLowerCase();
                    if (exactPhraseKeys.has(lowerBase)) {
                        const result = dict.get(lowerBase);
                        if (result) return result + "?";
                    }
                }

                // Lone "due to" → both forms
                if (/^\s*due to\s*$/i.test(text.trim())) {
                    return "ꤗꤟꤢꤩ꤭ꤒꤢꤩ꤭ꤚꤢꤪ, ꤚꤢꤪ";
                }

                // Fronted "Due to X, MAIN" / "Because of X, MAIN" must not be split on the comma
                {
                    const dueFront = text.match(/^\s*Due to\s+(.+?),\s*(.+)$/i);
                    if (dueFront) {
                        const comp = dueFront[1].trim();
                        const main = dueFront[2].trim();
                        const mainOut = translateToKayah(main.replace(/^due to\b/i, "DUETO_SKIP"));
                        const compOut = translateToKayah(comp);
                        let r = "";
                        if (compOut) r = compOut.trim();
                        r = (r ? r + " " : "") + "ꤚꤢꤪ";
                        if (mainOut) r += " " + mainOut.trim();
                        return r.replace(/\s+/g, " ").trim();
                    }
                    // Because of you, I don't go → ꤗꤟꤢ you ꤋꤢꤨ꤬ you ꤋꤛꤢꤩ꤭ꤚꤢꤪ I go don't
                    const bofFront = text.match(/^\s*Because of\s+(.+?),\s*(.+)$/i);
                    if (bofFront) {
                        const comp = bofFront[1].trim();
                        const main = bofFront[2].trim();
                        const mainOut = translateToKayah(main);
                        const compOut = translateToKayah(comp);
                        let r = "ꤗꤟꤢ";
                        if (compOut) r += " " + compOut.trim();
                        r += " ꤋꤢꤨ꤬";
                        if (compOut) r += " " + compOut.trim();
                        r += " ꤋꤛꤢꤩ꤭ꤚꤢꤪ";
                        if (mainOut) r += " " + mainOut.trim();
                        return r.replace(/\s+/g, " ").trim();
                    }
                }

                // Translate between pauses: . , ? !  (each segment translated on its own)
                // Period → ꤯; other marks stay English.
                const rawSentences = text.split(/(?<=[.:,?!])\s*/).filter(s => s.trim().length > 0);
                if (rawSentences.length === 0) return "";

                const translatedSentences = rawSentences.map(sentence => {
                    sentence = sentence.trim();
                    if (!sentence) return "";

                    const sentLower = sentence.toLowerCase();

                    const endsWithQuestion = sentence.endsWith("?");
                    const endsWithPeriod = sentence.endsWith(".");
                    const endsWithExclamation = sentence.endsWith("!");
                    const endsWithComma = sentence.endsWith(",");
                    const endsWithSemicolon = sentence.endsWith(";");

                    let cleanSentence = sentence;
                    let trailingPunct = "";
                    if (endsWithQuestion) {
                        cleanSentence = sentence.slice(0, -1);
                        trailingPunct = "?";
                    } else if (endsWithExclamation) {
                        cleanSentence = sentence.slice(0, -1);
                        trailingPunct = "!";
                    } else if (endsWithPeriod) {
                        cleanSentence = sentence.slice(0, -1);
                        trailingPunct = "꤯";
                    } else if (endsWithComma) {
                        cleanSentence = sentence.slice(0, -1);
                        trailingPunct = ",";
                    } else if (endsWithSemicolon) {
                        cleanSentence = sentence.slice(0, -1);
                        trailingPunct = ";";
                    }

                    let tokens = tokenizeEnglish(cleanSentence);
                    if (tokens.length === 0) return "";

                    // "How about …" → body first, then ꤜꤢꤩ꤭ ꤢ꤬ꤗꤟꤢꤩ꤬ꤒꤢꤩ꤭ at end
                    // How about → ꤜꤢꤩ꤭ ꤢ꤬ꤗꤟꤢꤩ꤬ꤒꤢꤩ꤭
                    // How about you → ꤔꤟꤢꤧ꤬ ꤜꤢꤩ꤭ ꤢ꤬ꤗꤟꤢꤩ꤬ꤒꤢꤩ꤭
                    // How about you do it for me → ꤔꤟꤢꤧ꤬ ꤗꤟꤢꤩ꤬ ꤠꤢ꤭ ꤢ꤬ꤑꤢꤩ꤭ ꤜꤢꤩ꤭ ꤢ꤬ꤗꤟꤢꤩ꤬ꤒꤢꤩ꤭
                    {
                        const t0 = tokens[0].toLowerCase().replace(/[.,;!?]+$/, "");
                        const t1 = tokens.length > 1 ? tokens[1].toLowerCase().replace(/[.,;!?]+$/, "") : "";
                        const isHowAboutPhrase = (t0 === "how about") || (t0 === "how" && t1 === "about");
                        if (isHowAboutPhrase) {
                            const howAboutEnd = "ꤜꤢꤩ꤭ ꤢ꤬ꤗꤟꤢꤩ꤬ꤒꤢꤩ꤭";
                            const rest = (t0 === "how about") ? tokens.slice(1) : tokens.slice(2);
                            if (rest.length === 0) {
                                let r = howAboutEnd;
                                if (trailingPunct === "?") r += "?";
                                else if (trailingPunct) r += trailingPunct;
                                return r;
                            }
                            const restResult = translatePhrase(rest, false, false, false, false, null, false, null, null);
                            let body = (restResult.text || "").replace(/\s+/g, " ").trim();
                            body = body.replace(/ꤚꤤ꤬ꤊꤛꤢ꤭/g, "").replace(/\s+/g, " ").trim();
                            let r = (body ? body + " " : "") + howAboutEnd;
                            r = r.replace(/\s+/g, " ").trim();
                            if (trailingPunct === "?") r += "?";
                            else if (trailingPunct) r += trailingPunct;
                            return r;
                        }
                    }

                    // WH-clause (not "WH to VERB"): I don't know what he does
                    // → I know don't he does what
                    // I can't eat how they eat → I eat can't they eat how
                    // I won't go where they go → I go won't they go where
                    // They don't know yet how I will come → They know yet don't I come will how
                    {
                        // Note: "when" is handled as time-subordinator (will before when-clause), not here
                        const whClauseWords = new Set(["what", "how", "where", "why", "which"]);
                        const whClauseTrans = {
                            "what": "ꤒꤤ꤭ꤒꤢꤩ꤭",
                            "how": "ꤖꤢꤨꤒꤢꤩ꤭",
                            "where": "ꤙꤤꤒꤢꤩ꤭",
                            "why": "ꤢ꤬ꤗꤟꤢꤩ꤬ꤒꤢꤩ꤭",
                            "which": "ꤘꤣꤒꤢꤩ꤭"
                        };
                        let whIdx = -1;
                        let whKey = null;
                        for (let i = 0; i < tokens.length; i++) {
                            const tl = tokens[i].toLowerCase().replace(/[.,;!?]+$/, "");
                            // skip "how about" and "how many"/"how much"
                            if (tl === "how about" || tl === "how many" || tl === "how much") continue;
                            if (whClauseWords.has(tl)) {
                                // not "WH to VERB"
                                const next = i + 1 < tokens.length ? tokens[i + 1].toLowerCase().replace(/[.,;!?]+$/, "") : "";
                                if (next === "to" || tl.endsWith(" to")) continue;
                                // next should look like a subject (clause)
                                if (next && (isSubject(tokens[i + 1]) || isNoun(tokens[i + 1]))) {
                                    whIdx = i;
                                    whKey = tl;
                                    break;
                                }
                            }
                        }
                        const sent0wh = tokens[0].toLowerCase().replace(/[.,;!?]+$/, "");
                        if (sent0wh === "don't" || sent0wh === "dont" || sent0wh === "do not") {
                            whIdx = -1; // Don't … how/what → imperative path
                        }
                        if (whIdx > 0 && whKey) {
                            // If a time-conjunction appears after WH, let time-conj path handle
                            // e.g. Please tell me what you need before we leave
                            const timeWords = new Set(["before","after","when","while","until","till","since","because","if","unless","although","though"]);
                            let hasTimeAfter = false;
                            for (let j = whIdx + 1; j < tokens.length; j++) {
                                const jl = tokens[j].toLowerCase().replace(/[.,;!?]+$/, "");
                                if (timeWords.has(jl)) { hasTimeAfter = true; break; }
                            }
                            if (hasTimeAfter) {
                                // fall through to time-conjunction handling
                            } else {
                            const mainTokens = tokens.slice(0, whIdx);
                            const subTokens = tokens.slice(whIdx + 1);
                            // Strip negations/modals from main for separate placement
                            // will → ꤕꤢ꤭ at end of MAIN clause (before subordinate / WH)
                            const negSet = new Set(["don't", "doesn't", "didn't", "do not", "does not", "did not",
                                "can't", "cannot", "won't", "will not", "haven't", "hasn't", "hadn't"]);
                            const mainClean = [];
                            let negTrans = null;
                            let yetTrans = null;
                            let mainWill = false;
                            let mainCan = false;
                            for (let i = 0; i < mainTokens.length; i++) {
                                const tl = mainTokens[i].toLowerCase().replace(/[.,;!?]+$/, "");
                                if (tl === "will" || tl === "would") { mainWill = true; continue; }
                                if (tl === "can" || tl === "could") { mainCan = true; continue; }
                                if (negSet.has(tl) || negativeWords.has(tl)) {
                                    negTrans = getNegativeTranslation(mainTokens[i]);
                                    if (tl === "can't" || tl === "cannot") negTrans = "ꤢ꤬ꤔꤟꤤꤒꤥ꤬";
                                    else if (tl === "won't" || tl === "will not") negTrans = "ꤒꤥ꤬ꤕꤢ꤭";
                                    else if (tl === "haven't" || tl === "hasn't" || tl === "hadn't") negTrans = "ꤒꤥ꤬";
                                    else negTrans = "ꤒꤥ꤬";
                                    continue;
                                }
                                if (tl === "yet") {
                                    yetTrans = getWordTranslation("yet") || "ꤟꤤ";
                                    continue;
                                }
                                // skip auxiliary do/does/did in main
                                if (tl === "do" || tl === "does" || tl === "did") continue;
                                mainClean.push(mainTokens[i]);
                            }
                            const mainRes = translatePhrase(mainClean, false, false, false, false, null, false, null, null);
                            // Subordinate may contain will → short form on that clause
                            const subRes = translatePhrase(subTokens, false, false, false, false, null, false, null, null);
                            let subText = (subRes.text || "").replace(/\s+/g, " ").trim();
                            // will placed once below after full second clause
                            let mainText = (mainRes.text || "").replace(/\s+/g, " ").trim();
                            // strip any WH/neg that leaked into main
                            if (whClauseTrans[whKey]) {
                                mainText = mainText.split(" ").filter(w => w !== whClauseTrans[whKey]).join(" ");
                            }

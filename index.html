<script>
const SHEET_URL = "https://docs.google.com/spreadsheets/d/121GmIprQ39Q_T0_KoAURnI9qgBz5DJGBOatDwnNaWzo/export?format=csv";
const DATA_URL = "data.json";
let ENTRIES = [];
let searchLang = "en";
const q = document.getElementById("q");
const list = document.getElementById("list");
const detail = document.getElementById("detail");
const clearBtn = document.getElementById("clear");
const menu = document.getElementById("menuPopup");
const statusEl = document.getElementById("status");
document.getElementById("menuToggle").onclick = function () {
  menu.style.display = menu.style.display === "block" ? "none" : "block";
};
document.addEventListener("click", function (event) {
  if (!menu.contains(event.target) && !event.target.closest("#menuToggle")) menu.style.display = "none";
});
function esc(value) {
  return String(value || "").replace(/[&<>\"]/g, function (ch) {
    if (ch === "&") return "&" + "amp;";
    if (ch === "<") return "&" + "lt;";
    if (ch === ">") return "&" + "gt;";
    return "&" + "quot;";
  });
}
function getVoices() {
  return window.speechSynthesis ? speechSynthesis.getVoices() : [];
}
function pickVoice(lang) {
  var voices = getVoices();
  if (!voices.length) return null;
  lang = (lang || "en-US").toLowerCase();
  var exact = voices.find(function(v) { return v.lang && v.lang.toLowerCase() === lang; });
  if (exact) return exact;
  var prefix = lang.split("-")[0];
  var partial = voices.find(function(v) { return v.lang && v.lang.toLowerCase().indexOf(prefix) === 0; });
  return partial || null;
}
function speak(text, lang) {
  if (!window.speechSynthesis || !text) return;
  // iOS PWA workaround: cancel any pending, then speak after voices are ready
  speechSynthesis.cancel();
  function doSpeak() {
    var u = new SpeechSynthesisUtterance(text);
    u.lang = lang || "en-US";
    var voice = pickVoice(u.lang);
    if (voice) u.voice = voice;
    // iOS often needs a tiny delay after cancel
    setTimeout(function() { speechSynthesis.speak(u); }, 50);
  }
  if (getVoices().length) {
    doSpeak();
  } else {
    speechSynthesis.onvoiceschanged = function() {
      speechSynthesis.onvoiceschanged = null;
      doSpeak();
    };
    // Force voices to load on some iOS versions
    speechSynthesis.getVoices();
  }
}
function speakAll(entry) {
  if (!window.speechSynthesis || !entry) return;
  speechSynthesis.cancel();
  const parts = [];
  if (entry.en) parts.push({ text: entry.en, lang: "en-US" });
  if (entry.burmese) parts.push({ text: entry.burmese, lang: "my-MM" });
  if (entry.kyu) parts.push({ text: entry.kyu, lang: "my-MM" });
  if (!parts.length) return;
  let i = 0;
  function next() {
    if (i >= parts.length) return;
    const p = parts[i++];
    const u = new SpeechSynthesisUtterance(p.text);
    u.lang = p.lang;
    u.onend = next;
    speechSynthesis.speak(u);
  }
  next();
}
function parseCSV(str) {
  const rows = [];
  let row = [];
  let cell = "";
  let inQuotes = false;
  for (let i = 0; i < str.length; i++) {
    const c = str[i];
    if (inQuotes) {
      if (c === '"') {
        if (str[i + 1] === '"') { cell += '"'; i++; }
        else inQuotes = false;
      } else cell += c;
    } else {
      if (c === '"') inQuotes = true;
      else if (c === ",") { row.push(cell); cell = ""; }
      else if (c === "\n" || c === "\r") {
        if (c === "\r" && str[i + 1] === "\n") i++;
        row.push(cell);
        if (row.some(function (v) { return String(v).trim(); })) rows.push(row);
        row = [];
        cell = "";
      } else cell += c;
    }
  }
  if (cell || row.length) { row.push(cell); if (row.some(function (v) { return String(v).trim(); })) rows.push(row); }
  return rows;
}
function slugify(s) {
  return String(s || "").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "") || "entry";
}
function entriesFromCSV(csvText) {
  const rows = parseCSV(csvText);
  if (rows.length < 2) return [];
  const entries = [];
  for (let i = 1; i < rows.length; i++) {
    const r = rows[i];
    const en = (r[0] || "").trim();
    if (!en) continue;
    const kyu = (r[1] || "").trim();
    const burmese = (r[2] || "").trim();
    const pos = (r[3] || "").trim();
    const exRaw = (r[4] || "").trim();
    const examples = exRaw ? exRaw.split(/\s*\|\s*/).filter(Boolean) : [];
    entries.push({
      en: en,
      kyu: kyu,
      burmese: burmese,
      pos: pos,
      examples: examples,
      slug: slugify(en) + "-" + i
    });
  }
  return entries;
}
function search(term) {
  term = (term || "").trim();
  if (!term || !ENTRIES.length) return [];
  const lower = term.toLowerCase();
  const close = [];
  for (let i = 0; i < ENTRIES.length; i++) {
    const entry = ENTRIES[i];
    const en = String(entry.en || "").toLowerCase();
    const kyu = String(entry.kyu || "");
    const bur = String(entry.burmese || "");
    let score = -1;
    if (en === lower || kyu === term || bur === term) score = 0;
    else if (en.indexOf(lower) === 0 || kyu.indexOf(term) === 0 || bur.indexOf(term) === 0) score = 1;
    else if (en.indexOf(lower) >= 0 || kyu.indexOf(term) >= 0 || bur.indexOf(term) >= 0) score = 2;
    if (score >= 0) close.push([score, entry]);
  }
  close.sort(function (a, b) {
    return a[0] - b[0] || String(a[1].en).localeCompare(String(b[1].en));
  });
  return close.slice(0, 50).map(function (item) { return item[1]; });
}

function groupKey(entry) {
  if (searchLang === "kyu") return String(entry.kyu || "").trim();
  if (searchLang === "bur") return String(entry.burmese || "").trim();
  return String(entry.en || "").toLowerCase().trim();
}
function uniqueBySearch(rows) {
  const seen = {};
  const result = [];
  for (let i = 0; i < rows.length; i++) {
    const key = groupKey(rows[i]);
    if (!key || seen[key]) continue;
    seen[key] = true;
    result.push(rows[i]);
  }
  return result;
}
function allForKey(key) {
  if (!key) return [];
  const matches = [];
  for (let i = 0; i < ENTRIES.length; i++) {
    if (groupKey(ENTRIES[i]) === key) matches.push(ENTRIES[i]);
  }
  return matches;
}

function detectLang(term) {
  if (!term) return "en";
  var t = term.trim();
  var lower = t.toLowerCase();
  var hasEn = false, hasKyu = false, hasBur = false;
  for (var i = 0; i < ENTRIES.length && !(hasEn && hasKyu && hasBur); i++) {
    var e = ENTRIES[i];
    if (!hasEn && String(e.en || "").toLowerCase().indexOf(lower) >= 0) hasEn = true;
    if (!hasKyu && String(e.kyu || "").indexOf(t) >= 0) hasKyu = true;
    if (!hasBur && String(e.burmese || "").indexOf(t) >= 0) hasBur = true;
  }
  // Prefer exact-ish match priority: if only one language matches, use it; else prefer the one that matches earliest
  if (hasKyu && !hasEn && !hasBur) return "kyu";
  if (hasBur && !hasEn && !hasKyu) return "bur";
  if (hasEn && !hasKyu && !hasBur) return "en";
  // Mixed: check which field the term is more likely from by character range
  if (/[\uA900-\uA92F]/.test(t)) return "kyu";
  if (/[\u1000-\u109F]/.test(t)) return "bur";
  return "en";
}
function showList() {
  lastView = "search";
  document.body.classList.remove("word");
  openEntry = null;
  detail.style.display = "none";
  detail.innerHTML = "";
  list.style.display = "";
  searchLang = detectLang(q.value);
  const rows = q.value.trim() ? search(q.value) : [];
  clearBtn.hidden = !q.value;
  paint(uniqueBySearch(rows));
}
function findIndex(entry) {
  for (let i = 0; i < ENTRIES.length; i++) if (ENTRIES[i].slug === entry.slug) return i;
  return -1;
}
function remember(entry) {
  let items = [];
  try { items = JSON.parse(localStorage.getItem("kyu-history") || "[]"); } catch (e) { items = []; }
  if (!Array.isArray(items)) items = [];
  items = [entry.slug].concat(items.filter(function (slug) { return slug !== entry.slug; })).slice(0, 40);
  localStorage.setItem("kyu-history", JSON.stringify(items));
}
function entryBySlug(slug) {
  for (let i = 0; i < ENTRIES.length; i++) if (ENTRIES[i].slug === slug) return ENTRIES[i];
  return null;
}
function savedEntries(kind) {
  if (kind === "history") {
    let slugs = [];
    try { slugs = JSON.parse(localStorage.getItem("kyu-history") || "[]"); } catch (e) { slugs = []; }
    if (!Array.isArray(slugs)) return [];
    return slugs.map(entryBySlug).filter(Boolean);
  }
  const rows = [];
  for (let i = 0; i < localStorage.length; i++) {
    const key = localStorage.key(i);
    if (key && key.indexOf("kyu-star:") === 0 && localStorage.getItem(key) === "1") {
      const entry = entryBySlug(key.slice(9));
      if (entry) rows.push(entry);
    }
  }
  rows.sort(function (a, b) { return String(a.en).localeCompare(String(b.en)); });
  return rows;
}
function paint(rows, kind) {
  if (!ENTRIES.length) {
    list.innerHTML = "<li class=\"loading\">Dictionary not loaded yet.</li>";
    return;
  }
  if (!rows.length && !kind && !q.value.trim()) {
    list.innerHTML = "";
    return;
  }
  if (!rows.length) {
    list.innerHTML = "<li class=\"loading\">No matches.</li>";
    return;
  }
  list.innerHTML = rows.map(function (entry, index) {
    var parts = [];
    if (searchLang === "kyu") {
      parts.push(esc(entry.kyu || ""));
      if (entry.burmese) parts.push(esc(entry.burmese));
      parts.push(esc(entry.en));
    } else if (searchLang === "bur") {
      if (entry.burmese) parts.push(esc(entry.burmese));
      parts.push(esc(entry.kyu || ""));
      parts.push(esc(entry.en));
    } else {
      parts.push(esc(entry.en));
      parts.push(esc(entry.kyu || ""));
      if (entry.burmese) parts.push(esc(entry.burmese));
    }
    var sense = parts.filter(Boolean).join(" | ");
    var del = kind ? "<button class=\"del\" data-i=\"" + index + "\" aria-label=\"Delete\"><span>×</span></button>" : "<button class=\"speak\" data-speak=\"" + esc(entry.burmese || entry.kyu || entry.en) + "\" aria-label=\"Speak\"><svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><polygon points=\"11 5 6 9 2 9 2 15 6 15 11 19 11 5\"/><path d=\"M15.54 8.46a5 5 0 0 1 0 7.07\"/></svg></button>";
    var main = searchLang === "kyu" ? (entry.kyu || entry.en) : (searchLang === "bur" ? (entry.burmese || entry.en) : entry.en);
    return "<li><button class=\"word\" data-i=\"" + index + "\"><p class=\"en\">" + esc(main) + "</p><p class=\"sense\">" + sense + "</p></button>" + del + "</li>";
  }).join("");
  const buttons = list.querySelectorAll(".word");
  for (let i = 0; i < buttons.length; i++) {
    buttons[i].onclick = function () { showDetailGroup(groupKey(rows[Number(this.dataset.i)])); };
  }
  const speakers = list.querySelectorAll(".speak");
  for (let i = 0; i < speakers.length; i++) {
    speakers[i].onclick = function () {
      const idx = Number(this.closest("li").querySelector(".word").dataset.i);
      const entry = rows[idx];
      if (entry) speakAll(entry);
    };
  }
  const deletes = list.querySelectorAll(".del");
  for (let i = 0; i < deletes.length; i++) {
    deletes[i].onclick = function () {
      removeSaved(kind, rows[Number(this.dataset.i)]);
      showSaved(kind);
    };
  }
}
function removeSaved(kind, entry) {
  if (!entry) return;
  if (kind === "favorite") {
    localStorage.removeItem("kyu-star:" + entry.slug);
    return;
  }
  let items = [];
  try { items = JSON.parse(localStorage.getItem("kyu-history") || "[]"); } catch (e) { items = []; }
  if (!Array.isArray(items)) items = [];
  localStorage.setItem("kyu-history", JSON.stringify(items.filter(function (slug) { return slug !== entry.slug; })));
}
function showSaved(kind) {
  lastView = kind;
  menu.style.display = "none";
  document.body.classList.remove("word");
  openEntry = null;
  detail.style.display = "none";
  detail.innerHTML = "";
  list.style.display = "";
  q.value = "";
  clearBtn.hidden = true;
  paint(savedEntries(kind), kind);
  window.scrollTo(0, 0);
}

function speakBtn(text, lang, label) {
  if (!text) return "";
  return "<button class=\"speak-inline\" data-text=\"" + esc(text) + "\" data-lang=\"" + (lang || "my-MM") + "\" aria-label=\"Speak " + label + "\" title=\"Speak " + label + "\">🔊</button>";
}
function wireSpeakButtons() {
  const btns = detail.querySelectorAll(".speak-inline");
  for (let i = 0; i < btns.length; i++) {
    btns[i].onclick = function () {
      speak(this.getAttribute("data-text"), this.getAttribute("data-lang"));
    };
  }
}
function showDetailGroup(key) {
  const matches = allForKey(key);
  if (!matches.length) return;
  remember(matches[0]);
  openEntry = matches[0];
  document.body.classList.add("word");
  list.style.display = "none";
  let html = "";
  for (let i = 0; i < matches.length; i++) {
    const e = matches[i];
    const examples = (e.examples || []).map(function (line) { return "<p class=\"ex\">" + esc(line) + "</p>"; }).join("");
    var enLine = "<div class=\"line\"><h2 class=\"line-text\">" + esc(e.en) + "</h2>" + speakBtn(e.en, "en-US", "English") + "</div>";
    var kyuLine = "<div class=\"line\"><p class=\"line-text\"><span>(" + esc(e.pos) + ")</span> " + esc(e.kyu || "") + "</p></div>";
    var burLine = e.burmese ? "<div class=\"line\"><p class=\"line-text\">" + esc(e.burmese) + "</p>" + speakBtn(e.burmese, "my-MM", "Burmese") + "</div>" : "";
    if (searchLang === "kyu") html += kyuLine + burLine + enLine;
    else if (searchLang === "bur") html += burLine + kyuLine + enLine;
    else html += enLine + kyuLine + burLine;
    html += examples;
    if (i < matches.length - 1) html += "<hr style=\"border:0;border-top:1px solid #eee;margin:16px 0\">";
  }
  detail.style.display = "block";
  detail.innerHTML = html;
  wireSpeakButtons();
  const index = findIndex(matches[0]);
  document.getElementById("prevWord").disabled = index <= 0;
  document.getElementById("nextWord").disabled = index < 0 || index >= ENTRIES.length - 1;
  document.getElementById("starWord").classList.toggle("on", localStorage.getItem("kyu-star:" + matches[0].slug) === "1");
  window.scrollTo(0, 0);
}
function showDetail(entry) {
  remember(entry);
  openEntry = entry;
  document.body.classList.add("word");
  list.style.display = "none";
  const examples = (entry.examples || []).map(function (line) { return "<p class=\"ex\">" + esc(line) + "</p>"; }).join("");
  detail.style.display = "block";
  var enLine = "<div class=\"line\"><h2 class=\"line-text\">" + esc(entry.en) + "</h2>" + speakBtn(entry.en, "en-US", "English") + "</div>";
  var kyuLine = "<div class=\"line\"><p class=\"line-text\"><span>(" + esc(entry.pos) + ")</span> " + esc(entry.kyu || "") + "</p></div>";
  var burLine = entry.burmese ? "<div class=\"line\"><p class=\"line-text\">" + esc(entry.burmese) + "</p>" + speakBtn(entry.burmese, "my-MM", "Burmese") + "</div>" : "";
  var ordered = searchLang === "kyu" ? kyuLine + burLine + enLine : (searchLang === "bur" ? burLine + kyuLine + enLine : enLine + kyuLine + burLine);
  detail.innerHTML = ordered + examples;
  wireSpeakButtons();
  const index = findIndex(entry);
  document.getElementById("prevWord").disabled = index <= 0;
  document.getElementById("nextWord").disabled = index < 0 || index >= ENTRIES.length - 1;
  document.getElementById("starWord").classList.toggle("on", localStorage.getItem("kyu-star:" + entry.slug) === "1");
  window.scrollTo(0, 0);
}
let openEntry = null;
let lastView = "search";
document.getElementById("backWord").onclick = function () {
  if (lastView === "history") showSaved("history");
  else if (lastView === "favorite") showSaved("favorite");
  else showList();
};
document.getElementById("prevWord").onclick = function () {
  const index = findIndex(openEntry);
  if (index > 0) showDetail(ENTRIES[index - 1]);
};
document.getElementById("nextWord").onclick = function () {
  const index = findIndex(openEntry);
  if (index >= 0 && index < ENTRIES.length - 1) showDetail(ENTRIES[index + 1]);
};
document.getElementById("starWord").onclick = function () {
  if (!openEntry) return;
  const key = "kyu-star:" + openEntry.slug;
  const on = localStorage.getItem(key) !== "1";
  localStorage.setItem(key, on ? "1" : "0");
  this.classList.toggle("on", on);
};
document.getElementById("speakWord").onclick = function () { if (openEntry) speakAll(openEntry); };
document.getElementById("shareWord").onclick = function () {
  if (!openEntry) return;
  const text = openEntry.en + " (" + openEntry.pos + ") " + (openEntry.kyu || "") + (openEntry.burmese ? " / " + openEntry.burmese : "");
  if (navigator.share) navigator.share({ title: openEntry.en, text: text });
  else if (navigator.clipboard) navigator.clipboard.writeText(text);
};
q.addEventListener("input", showList);
clearBtn.onclick = function () { q.value = ""; showList(); q.focus(); };
document.getElementById("searchForm").onsubmit = function (event) {
  event.preventDefault();
  const term = q.value.trim();
  if (!term) return;
  const rows = uniqueBySearch(search(term));
  if (rows.length) showDetailGroup(groupKey(rows[0]));
};
document.getElementById("openDictionary").onclick = function (event) { event.preventDefault(); menu.style.display = "none"; showList(); };
document.getElementById("openFavorite").onclick = function (event) { event.preventDefault(); showSaved("favorite"); };
document.getElementById("openHistory").onclick = function (event) { event.preventDefault(); showSaved("history"); };
function setStatus(msg) {
  statusEl.textContent = msg;
}
async function loadLocalData() {
  try {
    const res = await fetch(DATA_URL);
    if (!res.ok) throw new Error("no local data");
    const data = await res.json();
    if (Array.isArray(data) && data.length > 100) {
      ENTRIES = data;
      setStatus("");
      showList();
      return true;
    }
  } catch (e) {
    console.log("Local data failed:", e);
  }
  return false;
}
async function refreshFromSheet() {
  try {
    const res = await fetch(SHEET_URL, { cache: "no-store" });
    if (!res.ok) return;
    const text = await res.text();
    const fresh = entriesFromCSV(text);
    if (fresh.length > 100) {
      ENTRIES = fresh;
      setStatus("");
      if (lastView === "search") showList();
    }
  } catch (e) {
    if (!ENTRIES.length) {
      setStatus("");
    } else {
      setStatus("");
    }
  }
}
async function init() {
  setStatus("");
  const loaded = await loadLocalData();
  if (!loaded) {
    setStatus("");
  }
  await refreshFromSheet();
  if (!ENTRIES.length) {
    list.innerHTML = "";
    setStatus("");
  }
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("sw.js").catch(function () {});
  }
}
init();
</script>

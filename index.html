<form class="search" id="searchForm">
  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#8b919a" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
  <input id="q" placeholder="English or Kayah Li" autocomplete="off" spellcheck="false">
  <button class="clear" id="clear" type="button" hidden aria-label="Clear">×</button>
</form>
<ul id="list"></ul>
<section id="detail"></section>
<script src="entries.js"></script>
<script>
const q = document.getElementById("q");
const list = document.getElementById("list");
const detail = document.getElementById("detail");
const clearBtn = document.getElementById("clear");
const menu = document.getElementById("menuPopup");
document.getElementById("menuToggle").onclick = function () {
  menu.style.display = menu.style.display === "block" ? "none" : "block";
};
document.addEventListener("click", function (event) {
  if (!menu.contains(event.target) && !event.target.closest("#menuToggle")) menu.style.display = "none";
});
function esc(value) {
  return String(value || "").replace(/[&<>"]/g, function (ch) {
    if (ch === "&") return "&amp;";
    if (ch === "<") return "&lt;";
    if (ch === ">") return "&gt;";
    return "&quot;";
  });
}
function speak(text) {
  if (!window.speechSynthesis || !text) return;
  const u = new SpeechSynthesisUtterance(text);
  u.lang = /[\uA900-\uA92F]/.test(text) ? "my-MM" : "en-US";
  speechSynthesis.cancel();
  speechSynthesis.speak(u);
}
function search(term) {
  term = term.trim();
  if (!term) return [];
  const lower = term.toLowerCase();
  const close = [];
  for (let i = 0; i < ENTRIES.length; i++) {
    const entry = ENTRIES[i];
    const en = String(entry.en || "").toLowerCase();
    const kyu = String(entry.kyu || "");
    let score = -1;
    if (en === lower || kyu === term) score = 0;
    else if (en.indexOf(lower) === 0 || kyu.indexOf(term) === 0) score = 1;
    else if (en.indexOf(lower) >= 0 || kyu.indexOf(term) >= 0) score = 2;
    if (score >= 0) close.push([score, entry]);
  }
  close.sort(function (a, b) {
    return a[0] - b[0] || String(a[1].en).localeCompare(String(b[1].en));
  });
  return close.slice(0, 40).map(function (item) { return item[1]; });
}
function showList() {
  detail.style.display = "none";
  detail.innerHTML = "";
  list.style.display = "";
  const rows = search(q.value);
  clearBtn.hidden = !q.value;
  list.innerHTML = rows.map(function (entry, index) {
    return '<li><button class="word" data-i="' + index + '"><p class="en">' + esc(entry.en) + '</p><p class="kyu"><span class="pos">(' + esc(entry.pos) + ')</span>' + esc(entry.kyu) + '</p></button><button class="speak" data-speak="' + esc(entry.en) + '" aria-label="Speak"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/></svg></button></li>';
  }).join("");
  const buttons = list.querySelectorAll(".word");
  for (let i = 0; i < buttons.length; i++) {
    buttons[i].onclick = function () { showDetail(rows[Number(this.dataset.i)]); };
  }
  const speakers = list.querySelectorAll(".speak");
  for (let i = 0; i < speakers.length; i++) {
    speakers[i].onclick = function () { speak(this.getAttribute("data-speak")); };
  }
}
function showDetail(entry) {
  list.style.display = "none";
  const examples = (entry.examples || []).map(function (line) { return "<p>" + esc(line) + "</p>"; }).join("");
  detail.style.display = "block";
  detail.innerHTML = '<button class="back" id="back">← ꤍꤟꤥꤡꤟꤢꤪꤐꤟꤢ꤭</button><h2>' + esc(entry.en) + '</h2><p><b>(' + esc(entry.pos) + ')</b> ' + esc(entry.kyu) + '</p>' + (entry.ipa ? "<p>" + esc(entry.ipa) + "</p>" : "") + (entry.grammar ? "<p>" + esc(entry.grammar) + "</p>" : "") + examples;
  document.getElementById("back").onclick = showList;
}
q.addEventListener("input", showList);
clearBtn.onclick = function () { q.value = ""; showList(); q.focus(); };
document.getElementById("searchForm").onsubmit = function (event) { event.preventDefault(); };
showList();
</script>
